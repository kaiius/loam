<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildcode — a tiny artificial-life terrarium</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #101020;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f2f0e8; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui button { pointer-events: auto; }

  #topbar {
    position: absolute; top: 10px; left: 12px; right: 12px;
    display: flex; align-items: center; gap: 10px;
    background: rgba(16, 16, 32, 0.62); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
    padding: 8px 14px; font-size: 14px; pointer-events: auto;
    width: fit-content; max-width: calc(100% - 24px);
  }
  #logo { font-weight: 700; letter-spacing: 0.3px; }
  #topbar .spacer { width: 8px; }
  #topbar button {
    background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.16);
    border-radius: 9px; padding: 5px 10px; font-size: 14px; cursor: pointer;
  }
  #topbar button:hover { background: rgba(255,255,255,0.22); }
  #topbar button.active { background: rgba(140, 200, 255, 0.35); border-color: rgba(140,200,255,0.6); }
  #clock, #census { opacity: 0.9; white-space: nowrap; }

  #panel {
    position: absolute; top: 64px; right: 12px; width: 264px;
    background: rgba(16, 16, 32, 0.78); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
    padding: 14px; font-size: 13px; pointer-events: auto;
  }
  #panel.hidden { display: none; }

  /* v0.26 "Procedural worldgen": the New World panel */
  #worldpanel {
    position: absolute; top: 64px; right: 12px; width: 264px;
    background: rgba(16, 16, 32, 0.78); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
    padding: 14px; font-size: 13px; pointer-events: auto;
  }
  #worldpanel.hidden { display: none; }
  .wp-cur { opacity: 0.85; margin-bottom: 10px; line-height: 1.5; }
  .wp-row { display: flex; align-items: center; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .wp-row > span { width: 64px; opacity: 0.9; flex: none; }
  .wp-row button {
    background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.16);
    border-radius: 9px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  .wp-row button:hover { background: rgba(255,255,255,0.22); }
  .wp-row button.active { background: rgba(140, 200, 255, 0.35); border-color: rgba(140,200,255,0.6); }
  #worldSeed {
    flex: 1; min-width: 0; background: rgba(255,255,255,0.08); color: #fff;
    border: 1px solid rgba(255,255,255,0.16); border-radius: 9px;
    padding: 6px 9px; font-size: 13px; font-family: inherit;
  }
  #worldSeed::placeholder { color: rgba(255,255,255,0.45); }
  #worldGo { flex: 1; padding: 8px; }
  .wp-note { opacity: 0.6; font-size: 11px; line-height: 1.5; margin-top: 4px; }
  .p-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .p-head h2 { font-size: 17px; flex: 1; }
  .p-head button { background: none; border: none; color: #aaa; font-size: 14px; cursor: pointer; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); }
  .badges { opacity: 0.85; margin-bottom: 10px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .bar-row span { width: 86px; opacity: 0.9; }
  .bar { flex: 1; height: 8px; background: rgba(255,255,255,0.12); border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 5px; transition: width 0.3s; }
  .traits { margin: 10px 0 6px; opacity: 0.85; font-style: italic; }
  .family { opacity: 0.75; margin-bottom: 6px; line-height: 1.5; }
  .lineage { margin: 8px 0; padding: 8px; border-radius: 10px; background: rgba(255,255,255,0.04); }
  .l-title { font-weight: 600; margin-bottom: 4px; }
  .l-chain { font-size: 12px; opacity: 0.85; line-height: 1.6; margin-bottom: 6px; }
  .l-gen { opacity: 0.6; font-size: 10px; }
  .l-table { width: 100%; font-size: 11px; border-collapse: collapse; margin-bottom: 6px; }
  .l-table th, .l-table td { padding: 2px 4px; text-align: right; opacity: 0.9; }
  .l-table td:first-child, .l-table th:first-child { text-align: left; opacity: 0.7; }
  .l-table .l-you { font-weight: 600; }
  .l-up { color: #7ccf5f; } .l-dn { color: #e85c5c; } .l-same { opacity: 0.4; }
  .l-kids { font-size: 12px; }
  .l-kid { margin: 2px; padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: inherit; cursor: pointer; font-size: 11px; }
  .l-none { opacity: 0.5; }
  .zone { font-size: 12px; opacity: 0.75; margin: 2px 0 6px; }
  .doing { margin-bottom: 10px; opacity: 0.9; }
  .p-actions { display: flex; gap: 8px; }
  .p-actions button {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.1); color: #fff; font-size: 13px; cursor: pointer;
  }
  .p-actions button:hover { background: rgba(255,255,255,0.22); }
  .hint2 { opacity: 0.7; margin-top: 8px; line-height: 1.5; }
  .senses { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.12); }
  .sense { font-size: 13px; line-height: 1.55; opacity: 0.92; }
  .l-title { font-size: 12px; opacity: 0.65; margin-bottom: 4px; }

  #toasts { position: absolute; left: 12px; bottom: 44px; display: flex;
    flex-direction: column; gap: 6px; max-width: 320px; }
  .toast {
    background: rgba(16, 16, 32, 0.78); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; padding: 8px 12px; font-size: 13px;
    opacity: 0; transform: translateY(8px); transition: all 0.35s;
  }
  .toast.show { opacity: 1; transform: none; }

  #hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    font-size: 12px; opacity: 0.65; background: rgba(16,16,32,0.5);
    padding: 6px 14px; border-radius: 20px; white-space: nowrap;
  }

  /* v0.14.2 "Wayfinding": camera controls, bottom-left */
  #camctl { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
  #camctl button {
    width: 40px; height: 40px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.16); background: rgba(16,16,32,0.62);
    backdrop-filter: blur(8px); color: #fff; font-size: 18px; cursor: pointer;
  }
  #camctl button:hover { background: rgba(255,255,255,0.22); }
  #camctl button:active { background: rgba(140, 200, 255, 0.35); }

  /* v0.14: family tree + evolution tracker panels */
  .bigpanel {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    width: min(760px, calc(100% - 48px)); max-height: calc(100% - 130px);
    overflow-y: auto; background: rgba(16, 16, 32, 0.88); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
    padding: 14px; font-size: 13px; pointer-events: auto;
  }
  .bigpanel.hidden { display: none; }
  .bp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bp-head h2 { font-size: 16px; flex: 1; }
  .bp-head button { background: none; border: none; color: #aaa; font-size: 14px; cursor: pointer; }
  .tdetail { font-size: 12px; opacity: 0.85; margin-bottom: 8px; }
  .tsvg { background: rgba(255,255,255,0.03); border-radius: 10px; overflow: hidden; }
  .tnote { font-size: 11px; opacity: 0.6; margin-top: 6px; }
  .estrip { margin: 10px 0; }
  .etitle { font-size: 12px; font-weight: 600; opacity: 0.85; margin-bottom: 2px; }
  .emarkers { margin-bottom: 4px; }
  .elegend { font-size: 11px; opacity: 0.85; margin: 4px 0; }
  .elegend span { margin-right: 10px; }

  /* v0.20 "Species": the living taxonomy */
  .srow { cursor: pointer; }
  .srow:hover { background: rgba(255,255,255,0.08); }
  .snew { font-size: 11px; background: rgba(124,207,95,0.18); border: 1px solid rgba(124,207,95,0.4);
    border-radius: 6px; padding: 1px 6px; color: #a8e08a; }
  .sback { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 7px; color: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; margin-bottom: 8px; }
  .sback:hover { background: rgba(255,255,255,0.2); }
  .trow { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.85;
    padding: 2px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .smems { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .smem { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px; color: inherit; font-size: 12px; padding: 4px 8px; cursor: pointer; }
  .smem:hover { background: rgba(255,255,255,0.2); }
  .linkbtn { background: none; border: none; color: inherit; font: inherit; cursor: pointer;
    padding: 0; text-decoration: underline; text-decoration-style: dotted; }
  .linkbtn:hover { opacity: 0.8; }

  /* Chronicle — the world's official record */
  .ch-chapter { margin: 16px 0 6px; }
  .ch-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .ch-blurb { font-size: 11px; opacity: 0.6; margin-bottom: 8px; font-style: italic; }
  .ch-empty { font-size: 12px; opacity: 0.5; font-style: italic; margin-bottom: 4px; }
  .ch-entry { display: flex; gap: 8px; align-items: flex-start; padding: 7px 9px;
    border-radius: 10px; background: rgba(255,255,255,0.04); margin-bottom: 6px; line-height: 1.45; }
  .ch-day { flex: none; width: 46px; font-size: 10px; opacity: 0.55; padding-top: 3px; }
  .ch-icon { flex: none; font-size: 14px; padding-top: 1px; }
  .ch-text { flex: 1; font-size: 13px; }
  .ch-jumps { flex: none; display: flex; gap: 4px; }
  .ch-jumps button {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 7px; color: inherit; font-size: 12px; padding: 2px 6px; cursor: pointer;
  }
  .ch-jumps button:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
