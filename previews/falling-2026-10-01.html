  // No cap on growth: the juvenile window (~+40 neurons typical) bounds it.
  // Adult brains trim dead weight but the genetic scale survives aging.
  const last = brain.layers[brain.nLayers - 1];
  const floor = brain.nLayers === 1 ? MIN_ASSOC : 8;
  if (juvenile && rng.chance(p * 2)) {
    addAssocNeuron(brain);
  } else if (!juvenile && rng.chance(p * 0.5) && last.n > floor && brain.nAssoc > MIN_ASSOC) {
    pruneAssocNeuron(brain);
  }
}

function addAssocNeuron(brain) {
  const rng = brain.rng;
  const li = brain.nLayers - 1;
  const L = brain.layers[li];
  // New neuron: sparse inputs from the previous layer (senses for layer 0),
  // sparse outputs into the motor readout.
  const prevN = li === 0 ? N_IN - 1 : brain.layers[li - 1].n;
  const density = li === 0 ? (brain.s2aDensity ?? 0.35) : 0.5;
  const nIn = Math.max(1, Math.round(prevN * density * (0.5 + rng.next())));
  const cols = new Set();
  while (cols.size < nIn) cols.add(rng.int(0, prevN - 1));
  L.idx.push([...cols]);
  L.w.push([...cols].map(() => rng.range(-0.9, 0.9)));
  L.bias.push(rng.range(-0.2, 0.2));
  const newIdx = L.n;
  L.n++;
  // Wire into motor readout sparsely.
  for (let j = 0; j < N_OUT; j++) {
    if (rng.chance(0.5)) {
      brain.a2m.idx[j].push(newIdx);
      brain.a2m.w[j].push(rng.range(-0.9, 0.9));
      brain.traces.e[j].push(0);
    }
  }
  brain.nAssoc++;
}

function pruneAssocNeuron(brain) {
  // Prune the neuron with the weakest total motor weight (least useful).
  const li = brain.nLayers - 1;
  const L = brain.layers[li];
  let weakest = 0;
  let weakScore = Infinity;
  for (let i = 0; i < L.n; i++) {
    let s = 0;
    for (let j = 0; j < N_OUT; j++) {
      const idx = brain.a2m.idx[j].indexOf(i);
      if (idx >= 0) s += Math.abs(brain.a2m.w[j][idx]);
    }
    s += Math.abs(L.bias[i]);
    if (s < weakScore) { weakScore = s; weakest = i; }
  }
  L.idx.splice(weakest, 1);
  L.w.splice(weakest, 1);
  L.bias.splice(weakest, 1);
  L.n--;
  for (let j = 0; j < N_OUT; j++) {
    const idx = brain.a2m.idx[j].indexOf(weakest);
    if (idx >= 0) {
      brain.a2m.idx[j].splice(idx, 1);
      brain.a2m.w[j].splice(idx, 1);
      brain.traces.e[j].splice(idx, 1);
    }
    // Shift indices above the removed neuron down.
    for (let n = 0; n < brain.a2m.idx[j].length; n++) {
      if (brain.a2m.idx[j][n] > weakest) brain.a2m.idx[j][n]--;
    }
  }
  brain.nAssoc--;
}

// A newborn's brain inherits structure from its parents: sparse topology is
// resampled, but the instinct wiring (genetic) is fresh and the attention
// prior starts uniform. Kept for API parity with the Emberhollow design.
function inheritStructure(pheno, rng) {
  return createBrain(pheno, rng);
}


// ---- src/sim/memory.js ----
// Episodic memory: a creature's past, kept honestly.
// Episodes are written only from lived or genuinely observed experience —
// never synthesized. The past votes on decisions (recall); it doesn't rule.
// Sustained sleep replays the most salient episodes back through the brain.
//
// Adapted for Wildcode's scale from the Emberhollow design (shared with
// permission): bounded salience-based forgetting, transient recall votes,
// discounted observational learning, sleep consolidation. Pruned away:
// spiking neurons, epigenetics, call vocabularies, tradition censuses —
// all real, all wrong for a 10Hz browser sim.


const RECALL_K = 3; // episodes voting on a decision
const RECALL_BUDGET = 0.2; // shared vote budget (+/-)
const REPLAY_COUNT = 5; // episodes replayed per consolidation
const REPLAY_SCALE = 0.3; // consolidation learns at a fraction of life
const WRITE_REWARD = 0.3; // |reward| above this writes an episode
const OBSERVE_RANGE = 220; // px: witnesses must be this close
const OBSERVE_DISCOUNT = 0.5; // watching is worth half of doing

// Memory capacity is evolvable: the `memory` gene sets it (16–64 episodes).
function memoryCapacity(pheno) {
  return 16 + Math.round(pheno.memory * 48);
}

function createMemory(pheno) {
  return { episodes: [], capacity: memoryCapacity(pheno) };
}

function salienceOf(ep) {
  return Math.abs(ep.reward) + (ep.critical ? 0.5 : 0) + (ep.kind === 'observed' ? 0.1 : 0);
}

// The write rule: salient outcomes, critical drive states, social events.
// Everything else is weather — it passes through without a trace.
function shouldWrite({ reward, critical, kind }) {
  if (kind === 'observed') return Math.abs(reward) > 0.12;
  return Math.abs(reward) > WRITE_REWARD || !!critical;
}

function writeEpisode(mem, ep) {
  ep.salience = salienceOf(ep);
  if (mem.episodes.length >= mem.capacity) {
    // Forgetting kills the dimmest first.
    let dim = 0;
    for (let i = 1; i < mem.episodes.length; i++) {
      if (mem.episodes[i].salience < mem.episodes[dim].salience) dim = i;
    }
    if (ep.salience <= mem.episodes[dim].salience) return false;
    mem.episodes[dim] = ep;
  } else {
    mem.episodes.push(ep);
  }
  return true;
}

function cosine(a, b) {
  let dot = 0,
    na = 0,
    nb = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    na += a[i] * a[i];
    nb += b[i] * b[i];
  }
  return na === 0 || nb === 0 ? 0 : dot / (Math.sqrt(na) * Math.sqrt(nb));
}

// Recall: the k most similar episodes vote on the motor decision with a
// shared budget. Returns transient action votes (not written to the brain).
function recall(mem, input, k = RECALL_K) {
  const votes = new Array(ACTIONS.length).fill(0);
  if (mem.episodes.length === 0) return votes;
  const scored = [];
  for (const ep of mem.episodes) {
    const sim = cosine(input, ep.input);
    if (sim > 0.01) scored.push({ ep, sim });
  }
  scored.sort((a, b) => b.sim - a.sim);
  let total = 0;
  for (let n = 0; n < Math.min(k, scored.length); n++) {
    const { ep, sim } = scored[n];
    const v = Math.sign(ep.reward) * sim;
    votes[ep.action] += v;
    total += Math.abs(v);
  }
  if (total > 0) {
    const scale = Math.min(1, RECALL_BUDGET / total);
    for (let j = 0; j < votes.length; j++) votes[j] *= scale;
  }
  return votes;
}

// Sleep consolidation: replay the most salient episodes through the brain
// at a fraction of live learning strength. With no lived episodes, changes
// nothing.
function consolidate(mem, brain, pheno) {
  if (mem.episodes.length === 0) return 0;
  const top = [...mem.episodes]
    .sort((a, b) => b.salience - a.salience)
    .slice(0, REPLAY_COUNT);
  for (const ep of top) {
    forward(brain, ep.input);
    learn(brain, pheno, Math.max(-1, Math.min(1, ep.reward * REPLAY_SCALE)));
  }
  return top.length;
}


// ---- src/sim/culture.js ----
// Culture: traditions — behaviors that outlive their inventors.
//
// Episodic memory dies with the creature. Traditions don't. They're a
// world-level registry of invented, named, transmissible behavioral
// variants: each has an inventor, a birth generation, and a carrier set.
// When the last carrier dies, the tradition goes extinct. That's the
// library test made mechanical — culture is inheritance that isn't DNA,
// and it can be lost.
//
// v0.7 ships one tradition kind: `grove`, a foraging-site preference.
// Fruit spawns near fixed plant positions, so "the east grove is rich" is
// genuinely useful knowledge with a real fitness gradient: carriers find
// food faster, eat more, breed more, and the tradition spreads. A grove
// tradition in a bad spot is genuinely harmful — selection weeds it out.
// No cargo-cult: every tradition must earn its carriers.
//
// Transmission is two-channel:
//   horizontal — witnesses of a carrier's successful meals adopt (fidelity
//     from the `tradition` gene; copying is near-lossless, not the 0.5
//     discount of episodic observation)
//   vertical — hatchlings inherit parents' traditions at birth
// The ratchet metric is the time series in culture.samples: repertoire
// size, cumulative founded/extinct, carrier count. A turning ratchet
// grows its repertoire; a stalled one founds and forgets at equal rates.


const MAX_TRADITIONS = 12; // per world — the repertoire is bounded
const MAX_CARRY = 4; // per creature — nobody holds everything
const GROVE_MEALS = 3; // meals clustered in space+time to invent
const GROVE_WINDOW = 180; // seconds the meals must fall inside
const GROVE_RADIUS = 150; // px clustering radius for invention
const GROVE_NEARBY = 200; // px: don't found a duplicate grove here
// v0.20 "Hands": craft-tradition invention thresholds — successful tool
// uses clustered in space+time, mirroring the grove machinery.
const CRAFT_USES = 3; // successful uses clustered to invent
const CRAFT_WINDOW = 240; // seconds the uses must fall inside
const CRAFT_RADIUS = 150; // px clustering radius for invention
const TRADITION_VOTE_BUDGET = 0.3; // shared vote budget (cf recall 0.2)

const GROVE_NAMES = ['Grove', 'Run', 'Patch', 'Hollow', 'Thicket', 'Meadow'];

function createCulture() {
  return {
    traditions: [], // live traditions
    founded: 0, // cumulative inventions
    extinct: 0, // cumulative extinctions
    nextId: 1,
    samples: [], // ratchet time series: {t, live, founded, extinct, carriers, maxGen}
  };
}

// Fidelity of cultural copying, from the `tradition` gene: 0.5–1.
// High fidelity = faithful copies and loyal retention.
function fidelityOf(pheno) {
  const t = pheno.tradition ?? 0.5; // ?? not || — a 0 gene is real data
  return 0.5 + 0.5 * t;
}

function getTradition(culture, id) {
  return culture.traditions.find((t) => t.id === id) || null;
}

function liveTraditions(c, culture) {
  return (c.traditions || [])
    .map((id) => getTradition(culture, id))
    .filter(Boolean);
}

function traditionName(kind, inventorName, rng) {
  if (kind === 'grove') return `${inventorName}'s ${rng.pick(GROVE_NAMES)}`;
  return `${inventorName}'s Way`;
}

// v0.20 "Hands": invent a craft tradition — a tool-use variant with a
// material and a verb pattern, e.g. { material: 'stone', pattern: 'strike' }.
// Clustered successful uses found it (cf. maybeFoundGrove); it shares the
// MAX_TRADITIONS pool honestly with grove traditions — no sub-cap, no
// protection for food culture (Joshua's decision, 2026-09-30). If tool
// culture starves food culture, that is a finding.
function foundCraft(culture, inventor, material, materialName, pattern, tick, gen, rng) {
  if (culture.traditions.length >= MAX_TRADITIONS) return null;
  for (const t of culture.traditions) {
    if (t.kind === 'craft' && t.material === material && t.pattern === pattern) return null;
  }
  const t = {
    id: culture.nextId++,
    kind: 'craft',
    name: `${inventor.name}'s ${materialName} Way`,
    material,
    pattern, // verb pattern, e.g. 'strike' — the engine never names tools
    inventor: inventor.name,
    birthTick: tick,
    birthGen: gen,
    carriers: new Set([inventor.id]),
    uses: 0, // times a carrier acted on it
  };
  culture.traditions.push(t);
  culture.founded++;
  if (!inventor.traditions) inventor.traditions = [];
  if (!inventor.traditions.includes(t.id)) inventor.traditions.push(t.id);
  return t;
}

// Invent a grove tradition at x. Returns the tradition or null (cap reached).
function foundGrove(culture, inventor, x, r, tick, gen, rng) {
  if (culture.traditions.length >= MAX_TRADITIONS) return null;
  const t = {
    id: culture.nextId++,
    kind: 'grove',
    name: traditionName('grove', inventor.name, rng),
    x: Math.round(x),
    r,
    inventor: inventor.name,
    birthTick: tick,
    birthGen: gen,
    carriers: new Set([inventor.id]),
    uses: 0, // times a carrier acted on it
  };
  culture.traditions.push(t);
  culture.founded++;
  if (!inventor.traditions) inventor.traditions = [];
  if (!inventor.traditions.includes(t.id)) inventor.traditions.push(t.id);
  return t;
}

// Copy a tradition to a new carrier, with fidelity-scaled noise.
// Returns true if adopted.
function adoptTradition(culture, creature, trad, fidelity, rng) {
  if (!creature.traditions) creature.traditions = [];
  if (creature.traditions.includes(trad.id)) return false;
  if (creature.traditions.length >= MAX_CARRY) return false;
  // High-fidelity copy with a whisper of noise — the ratchet needs
  // near-lossless transmission, not perfect cloning. The tradition keeps
  // one shared identity (and carrier set); each holder just aims a little
  // off, scaled by (1 - fidelity).
  if (trad.kind === 'grove') {
    const noise = (1 - fidelity) * 120;
    creature.traditionAim = creature.traditionAim || {};
    creature.traditionAim[trad.id] = Math.round(trad.x + rng.range(-noise, noise));
  }
  creature.traditions.push(trad.id);
  trad.carriers.add(creature.id);
  return true;
}

// A creature's aimed point for a grove tradition (its noisy copy).
function groveAim(c, trad) {
  if (c.traditionAim && c.traditionAim[trad.id] !== undefined) return c.traditionAim[trad.id];
  return trad.x;
}

// Tradition votes on the motor decision — like recall votes, they nudge
// without ruling, and they never touch learned weights.
function traditionVotes(c, culture, senses) {
  const votes = new Array(ACTIONS.length).fill(0);
  const SEEK = ACTIONS.indexOf('seekFood');
  const GRASP = ACTIONS.indexOf('grasp'); // v0.20: -1 until Hands wires it
  let total = 0;
  for (const t of liveTraditions(c, culture)) {
    if (t.kind === 'grove' && senses.hunger > 0.35) {
      votes[SEEK] += 0.3;
      total += 0.3;
    }
    // v0.20 "Hands": a craft tradition votes for the grasp instinct when
    // objects are near — culture teaches the hands what to reach for.
    if (t.kind === 'craft' && GRASP >= 0 && (senses.objectNear || 0) > 0) {
      votes[GRASP] += 0.3;
      total += 0.3;
    }
  }
  if (total > 0) {
    const scale = Math.min(1, TRADITION_VOTE_BUDGET / total);
    for (let j = 0; j < votes.length; j++) votes[j] *= scale;
  }
  return votes;
}

// Where should a hungry carrier go when no food is in sight? The grove.
function groveTarget(c, culture, senses) {
  if (senses.hunger < 0.3) return null;
  let best = null;
  for (const t of liveTraditions(c, culture)) {
    if (t.kind !== 'grove') continue;
    const gx = groveAim(c, t);
    if (!best || Math.abs(gx - c.x) < Math.abs(best - c.x)) best = gx;
  }
  return best;
}

// Drop traditions whose last carrier is gone. Returns the extinct ones.
function pruneExtinct(culture, creatures) {
  const alive = new Set();
  for (const c of creatures) if (c.alive) alive.add(c.id);
  const gone = [];
  culture.traditions = culture.traditions.filter((t) => {
    for (const id of [...t.carriers]) if (!alive.has(id)) t.carriers.delete(id);
    if (t.carriers.size === 0) {
      gone.push(t);
      culture.extinct++;
      return false;
    }
    return true;
  });
  return gone;
}

// Ratchet census: sample the repertoire. Call every few sim-minutes.
function sampleCulture(world) {
  const cu = world.culture;
  let carriers = 0;
  let maxGen = 0;
  for (const t of cu.traditions) {
    carriers += t.carriers.size;
    if (t.birthGen > maxGen) maxGen = t.birthGen;
  }
  cu.samples.push({
    t: Math.round(world.time),
    live: cu.traditions.length,
    founded: cu.founded,
    extinct: cu.extinct,
    carriers,
    maxGen,
  });
}

// Cumulative Ratchet Index: fraction of all invented traditions still alive.
// 1 = nothing ever lost; 0 = the repertoire is a sieve.
function ratchetIndex(culture) {
  if (culture.founded === 0) return 0;
  return culture.traditions.length / culture.founded;
}


// ---- src/sim/language.js ----
// language.js — v0.16 "Tongues": the emergent lexicon.
//
// Every tanglekin carries a small lexicon of acoustic prototypes
// (pitch, length, loudness), each with a context tally and a confidence.
// No meaning is ever assigned: a word's "meaning" is only the statistics
// of where it gets used — a field linguist's notebook, not a dictionary.
//
// The update rules (from the v0.16 review):
//   (a) ASYMMETRIC updates — the speaker reinforces toward its OWN salient
//       state (it knows why it called); the hearer updates toward the most
//       salient observable context in a short recency-weighted window.
//   (b) PROBATIONARY buffer — a novel call births a candidate; it graduates
//       into the lexicon only after LEX_PROBATION_HEARINGS hearings. The
//       novelty threshold adapts to local prototype density so babble
//       can't flood the slots.
//   (c) SLOW decay — confidence fades over minutes; an entry is forgotten
//       only when confidence is low AND few troop-mates speak it. Culture
//       lives at the troop level.
//   (f) INFANT critical-period boost — lexLearnRate() scales up while young,
//       gene-modulated (lexCrit). Vertical transmission stabilizes the
//       lexicon across generations.
//
// This module is dependency-free on purpose: the sim (creature.js, world.js)
// calls in; nothing here imports the sim. All acoustic math is NaN-guarded.

const LEX_CONTEXTS = ['food', 'alarm', 'mate', 'contact', 'come'];
const LEX_PROBATION_HEARINGS = 3;
const LEX_MAX_PROBATION = 6;
const LEX_DECAY_TAU = 300;      // sim-seconds for confidence to decay by 1/e
const LEX_FORGET_CONF = 0.22;   // below this, an entry may be forgotten...
const LEX_FORGET_SPEAKERS = 2;  // ...but only if fewer troop-mates speak it
const LEX_MIN_ENTRIES = 3;      // never wipe a lexicon below this

function clamp01f(x) {
  if (!Number.isFinite(x)) return 0.5;
  return x < 0 ? 0 : x > 1 ? 1 : x;
}

function cleanProto(proto) {
  return {
    pitch: clamp01f(proto && proto.pitch),
    length: clamp01f(proto && proto.length),
    loudness: clamp01f(proto && proto.loudness),
  };
}

function emptyTallies() {
  const t = {};
  for (const k of LEX_CONTEXTS) t[k] = 0;
  return t;
}

// --- Substrate genes (expressed on the phenotype; see genome.js chr 8) ---

// Lexicon slot count: 4 + round(12 * lexCap). Founder lexCap 0.65 → ~12.
function lexSlots(pheno) {
  return 4 + Math.round(12 * clamp01f(pheno.lexCap ?? 0.65));
}
// Hearing threshold: a call is heard only if its amplitude at the ear beats
// this. Lower gene value → keener ears.
function hearThresh(pheno) {
  return 0.12 + 0.66 * clamp01f(pheno.lexHear ?? 0.5);
}
// Base loudness: the lexLoud gene blended with the old vocalVolume accent.
function baseLoud(pheno) {
  return clamp01f(0.65 * clamp01f(pheno.lexLoud ?? 0.5) + 0.35 * clamp01f(pheno.vocalVolume ?? 0.5));
}
// Body size sets base pitch — physics, not script. Big bodies rumble,
// small bodies chirp. size 0..1 → factor 1.0..0.5.
function sizePitchFactor(pheno) {
  return 1 - 0.5 * clamp01f(pheno.size ?? 0.5);
}
// Learning rate with the infant critical-period boost (delta f),
// gene-modulated by lexCrit.
function lexLearnRate(pheno, isYoung) {
  const base = 0.25 + 0.75 * clamp01f(pheno.lexLearn ?? 0.5);
  if (!isYoung) return base;
  return base * (1 + 2 * clamp01f(pheno.lexCrit ?? 0.5));
}

// --- The lexicon ---------------------------------------------------------

function createLexicon(slots) {
  return { entries: [], probation: [], slots: Math.max(4, slots | 0 || 12) };
}

function makeEntry(proto, ctx, learn, t) {
  const e = {
    proto: cleanProto(proto),
    contexts: emptyTallies(),
    confidence: 0.5,
    heard: 0,
    used: 0,
    bornAt: t,
    lastHeard: t,
    speakers: 0, // refreshed by the troop census (world.js)
  };
  if (ctx && LEX_CONTEXTS.includes(ctx)) e.contexts[ctx] = learn;
  return e;
}

// Distance in acoustic space, 0 (identical) to ~1 (opposite corners).
// Pitch weighted most — ears track pitch best.
function acousticDistance(a, b) {
  const dp = (clamp01f(a.pitch) - clamp01f(b.pitch)) * 1.0;
  const dl = (clamp01f(a.length) - clamp01f(b.length)) * 0.8;
  const dv = (clamp01f(a.loudness) - clamp01f(b.loudness)) * 0.8;
  return Math.min(1, Math.sqrt(dp * dp + dl * dl + dv * dv) / 1.51);
}

function nearestIn(list, proto) {
  let best = null, bestD = Infinity;
  for (const e of list) {
    const d = acousticDistance(e.proto, proto);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best ? { entry: best, dist: bestD } : null;
}

// The novelty threshold adapts to local prototype density (delta b): with
// few entries, almost anything births a candidate; as the lexicon fills,
// only genuinely novel sounds do. Babble can't flood the slots.
function noveltyThreshold(lex) {
  const n = lex.entries.length;
  if (n < 2) return 0.32;
  let sum = 0;
  for (let i = 0; i < n; i++) {
    let m = Infinity;
    for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const d = acousticDistance(lex.entries[i].proto, lex.entries[j].proto);
      if (d < m) m = d;
    }
    sum += m;
  }
  const meanNN = sum / n;
  return Math.min(0.35, Math.max(0.10, meanNN * 0.6));
}

function weakestEntry(lex) {
  let w = null;
  for (const e of lex.entries) {
    if (!w || e.confidence < w.confidence ||
        (e.confidence === w.confidence && e.lastHeard < w.lastHeard)) w = e;
  }
  return w;
}

function graduateCandidate(lex, cand, t) {
  const i = lex.probation.indexOf(cand);
  if (i >= 0) lex.probation.splice(i, 1);
  const e = makeEntry(cand.proto, null, 0, t);
  e.contexts = { ...cand.contexts };
  e.confidence = 0.55;
  e.heard = cand.hearings;
  e.lastHeard = t;
  if (lex.entries.length >= lex.slots) {
    const w = weakestEntry(lex);
    if (w) lex.entries.splice(lex.entries.indexOf(w), 1);
  }
  lex.entries.push(e);
  return e;
}

// The hearer's path (delta a, second half): a heard call either reinforces
// the nearest prototype (toward the hearer's own salient context) or, if
// novel, births a probationary candidate.
function registerHeard(lex, proto, ctx, weight, learn, t) {
  proto = cleanProto(proto);
  weight = clamp01f(weight);
  learn = Math.max(0, learn);
  const nearE = nearestIn(lex.entries, proto);
  const nearC = nearestIn(lex.probation, proto);
  const thr = noveltyThreshold(lex);
  let near = null, isCand = false;
  if (nearE && (!nearC || nearE.dist <= nearC.dist)) near = nearE;
  else if (nearC) { near = nearC; isCand = true; }

  if (near && near.dist <= thr) {
    const e = near.entry;
    if (LEX_CONTEXTS.includes(ctx)) e.contexts[ctx] += learn * weight;
    if (isCand) {
      e.hearings = (e.hearings || 1) + 1;
      e.lastHeard = t;
      if (e.hearings >= LEX_PROBATION_HEARINGS) return graduateCandidate(lex, e, t);
      return e;
    }
    e.confidence = Math.min(1, e.confidence + 0.15 * learn * weight);
    e.heard += 1;
    e.lastHeard = t;
    return e;
  }
  // Novel: birth a candidate (delta b). Probation is capped; the oldest
  // unheard candidate is dropped to make room.
  const cand = {
    proto, contexts: emptyTallies(), hearings: 1, bornAt: t, lastHeard: t,
  };
  if (LEX_CONTEXTS.includes(ctx)) cand.contexts[ctx] = learn * weight;
  lex.probation.push(cand);
  if (lex.probation.length > LEX_MAX_PROBATION) {
    let oi = 0;
    for (let i = 1; i < lex.probation.length; i++) {
      if (lex.probation[i].bornAt < lex.probation[oi].bornAt) oi = i;
    }
    lex.probation.splice(oi, 1);
  }
  return cand;
}

// The speaker's path (delta a, first half): the speaker knows why it called,
// so its own production goes straight into the lexicon — no probation.
// Returns the entry the emitted prototype was registered against.
function registerSpoken(lex, proto, ctx, learn, t) {
  proto = cleanProto(proto);
  learn = Math.max(0, learn);
  const near = nearestIn(lex.entries, proto);
  const thr = noveltyThreshold(lex);
  if (near && near.dist <= thr) {
    const e = near.entry;
    if (LEX_CONTEXTS.includes(ctx)) e.contexts[ctx] += learn;
    e.confidence = Math.min(1, e.confidence + 0.12 * learn);
    e.used += 1;
    e.lastHeard = t;
    return e;
  }
  const e = makeEntry(proto, ctx, learn, t);
  e.used = 1;
  if (lex.entries.length >= lex.slots) {
    const w = weakestEntry(lex);
    if (w) lex.entries.splice(lex.entries.indexOf(w), 1);
  }
  lex.entries.push(e);
  return e;
}

// Speaking: in a salient state, emit the prototype most tied to it, with a
// little production noise (delta: lexNoise). If nothing is tied to the
// state yet, babble around the creature's own voice — troops whose accents
// have converged babble similar pitches, which is how shared clusters form.
function speakFromLexicon(c, ctx, rng) {
  const lex = c.lexicon;
  const pheno = c.pheno || {};
  let best = null, bestScore = 0;
  for (const e of lex.entries) {
    const s = (e.contexts[ctx] || 0) * (0.5 + e.confidence);
    if (s > bestScore) { bestScore = s; best = e; }
  }
  const noiseAmp = 0.10 * clamp01f(pheno.lexNoise ?? 0.3);
  const nz = (amp) => (rng.next() * 2 - 1) * amp;
  if (best && bestScore > 0.05) {
    return {
      entry: best,
      proto: {
        pitch: clamp01f(best.proto.pitch + nz(noiseAmp)),
        length: clamp01f(best.proto.length + nz(noiseAmp)),
        loudness: clamp01f(best.proto.loudness + nz(noiseAmp)),
      },
    };
  }
  // Babble: centered on the creature's own accent × body size.
  const accent = clamp01f(c.voicePitch ?? 0.5) * sizePitchFactor(pheno);
  return {
    entry: null,
    proto: {
      pitch: clamp01f(accent + nz(0.25)),
      length: clamp01f(0.2 + rng.next() * 0.5),
      loudness: clamp01f(baseLoud(pheno) + nz(0.2)),
    },
  };
}

// Slow decay (delta c): confidence fades over minutes of disuse. An entry
// is forgotten only when confidence is low AND few troop-mates speak it —
// culture lives at the troop level, not in one head.
function decayLexicon(lex, dt, t) {
  if (dt <= 0) return;
  const f = Math.exp(-dt / LEX_DECAY_TAU);
  for (const e of lex.entries) e.confidence *= f;
  for (let i = lex.entries.length - 1; i >= 0; i--) {
    const e = lex.entries[i];
    if (lex.entries.length <= LEX_MIN_ENTRIES) break;
    if (e.confidence < LEX_FORGET_CONF && (e.speakers || 0) < LEX_FORGET_SPEAKERS) {
      lex.entries.splice(i, 1);
    }
  }
  const now = t || 0;
  for (let i = lex.probation.length - 1; i >= 0; i--) {
    if (now - lex.probation[i].bornAt > 120) lex.probation.splice(i, 1);
  }
}

// --- The hearer's salient context (delta a, hearer half) ------------------
// Each creature keeps a short window of salient contexts it has observed
// (its own states + witnessed salient events). On hearing a call, the most
// salient context in the window — weighted by recency — is what the heard
// prototype gets reinforced toward. The hearer never knows the speaker's
// state; it only knows what was salient to IT when the call arrived.
const CTX_WINDOW = 24;   // entries
const CTX_WINDOW_SECS = 3; // recency horizon
function pushContextWindow(c, ctx, w, t) {
  if (!LEX_CONTEXTS.includes(ctx)) return;
  if (!c._contextWindow) c._contextWindow = [];
  c._contextWindow.push({ t, ctx, w: Math.max(0, Math.min(1, w || 0)) });
  if (c._contextWindow.length > CTX_WINDOW) {
    c._contextWindow.splice(0, c._contextWindow.length - CTX_WINDOW);
  }
}
function hearerSalientContext(c, t) {
  let best = null, bestScore = 0;
  const win = c._contextWindow || [];
  for (const e of win) {
    const age = t - e.t;
    if (age < 0 || age > CTX_WINDOW_SECS) continue;
    const s = e.w * (1 - age / CTX_WINDOW_SECS);
    if (s > bestScore) { bestScore = s; best = e.ctx; }
  }
  if (!best) return { ctx: 'contact', weight: 0.2 };
  return { ctx: best, weight: Math.min(1, 0.3 + bestScore) };
}

// --- The field-linguist's notebook ----------------------------------------
// wordName is a pure, deterministic function of acoustics: the same
// prototype gets the same pronounceable name every session. No meaning is
// assigned — the name is just a handle for the statistics.
const WN_ON = [['w', 'm'], ['n', 'k'], ['t', 'k']];   // by pitch: low, mid, high
const WN_VW = [['uh', 'oo'], ['eh', 'ah'], ['i', 'ay']];
const WN_CODA = ['m', 'p', 't'];                       // short + loud only
function wordName(proto) {
  const p = cleanProto(proto);
  const pb = p.pitch < 0.34 ? 0 : p.pitch < 0.67 ? 1 : 2;
  const lb = p.length < 0.5 ? 0 : 1;
  const vb = p.loudness < 0.5 ? 0 : 1;
  const on = WN_ON[pb][(lb + vb) % 2];
  const vw = WN_VW[pb][lb];
  let w = on + vw;
  if (lb === 1) w += vw[0];              // lengthened: mooo
  if (vb === 1 && lb === 0) w += WN_CODA[pb]; // clipped + loud: KIT!
  if (vb === 1) w = w.toUpperCase() + '!';
  return w;
}

// Context statistics for one entry: the inferred-meaning view.
function entryStats(e) {
  let total = 0;
  for (const k of LEX_CONTEXTS) total += e.contexts[k] || 0;
  const pct = {};
  for (const k of LEX_CONTEXTS) pct[k] = total > 0 ? (e.contexts[k] || 0) / total : 0;
  let top = 'contact', topP = 0;
  for (const k of LEX_CONTEXTS) if (pct[k] > topP) { topP = pct[k]; top = k; }
  return { total, pct, top, topPct: topP };
}

// v0.16: the recent-utterance log — the Tongues notebook's raw material.
// Every utterance is recorded with its TRUE context (the speaker's real
// salient state at emission). The notebook shows inferred statistics, never
// assigned meanings; the log is the ground truth underneath.
function pushUtterance(world, call) {
  if (!world.utterLog) world.utterLog = [];
  world.utterLog.push({
    t: world.time,
    name: wordName(call.proto || call),
    speaker: call.callerName || '—',
    ctx: call.type,
    pitch: call.pitch,
    fromTeacher: !!call.fromTeacher,
  });
  if (world.utterLog.length > 80) world.utterLog.splice(0, world.utterLog.length - 80);
}

// Lexicon distance 0..1: mean nearest-neighbor acoustic distance, symmetric.
// Wired into v0.14's dialect mate-choice and the hybrid penalty (delta d) —
// this is what turns word-drift into distinct languages.
function lexiconDistance(lexA, lexB) {
  const A = (lexA && lexA.entries) || [];
  const B = (lexB && lexB.entries) || [];
  if (!A.length && !B.length) return 0;  // no words yet: nothing to differ about
  if (!A.length || !B.length) return 0.5; // one side silent: neutral, not hostile
  const oneWay = (X, Y) => {
    let s = 0;
    for (const e of X) {
      let m = Infinity;
      for (const o of Y) {
        const d = acousticDistance(e.proto, o.proto);
        if (d < m) m = d;
      }
      s += m;
    }
    return s / X.length;
  };
  return clamp01f((oneWay(A, B) + oneWay(B, A)) / 2);
}


// ---- src/sim/social.js ----
// Social substrate: pairwise bonds, pedigree kinship, and detected tribes.
// v0.12. Bonds are memory, not genetics — no genes here. Tribes are never
// assigned, only detected: clusters of creatures whose imprinted home ranges
// overlap. Family/friend/stranger become distinguishable brain inputs.


// Unordered pair key — (a,b) and (b,a) are the same bond.
function bondKey(a, b) {
  return a < b ? `${a}-${b}` : `${b}-${a}`;
}

function createBonds() {
  return new Map(); // key -> { v: -1..1, t: last update time }
}

function getBond(bonds, a, b) {
  const e = bonds.get(bondKey(a.id ?? a, b.id ?? b));
  return e ? e.v : 0;
}

// Nudge a bond, clamped to [-1, 1]. Returns the new value.
function nudgeBond(world, a, b, delta) {
  if (!a || !b || a === b) return 0;
  const k = bondKey(a.id, b.id);
  let e = world.bonds.get(k);
  if (!e) {
    e = { v: 0, t: world.time };
    world.bonds.set(k, e);
  }
  e.v = Math.max(-1, Math.min(1, e.v + delta));
  e.t = world.time;
  return e.v;
}

// Per-tick bond dynamics: familiarity from peaceful proximity, play
// together, slow decay toward strangers, pruning of the dead.
function tickBonds(world, dt) {
  const bonds = world.bonds;
  if (!bonds) return;
  const FAMILIAR_RANGE = 120;
  const PLAY_RANGE = 100;
  // Familiarity: pairs close together on the same platform grow fonder.
  // Use the spatial index — O(n log n), same as the neighbor sense.
  const idx = world._spatial;
  if (idx) {
    for (const arr of idx.values()) {
      for (let i = 0; i < arr.length; i++) {
        const a = arr[i];
        for (let j = i + 1; j < arr.length; j++) {
          const b = arr[j];
          const dx = b.x - a.x;
          if (dx > FAMILIAR_RANGE) break;
          nudgeBond(world, a, b, 0.004 * dt); // mere exposure
          if (a.playing && b.playing && dx < PLAY_RANGE) {
            nudgeBond(world, a, b, 0.03 * dt); // play together, stay together
          }
        }
      }
    }
  }
  // Decay toward 0 and prune dead pairs. Iterate a snapshot: deletion during
  // iteration is safe on Maps, but the alive-set lookup needs the list.
  const alive = new Set(world.creatures.map((c) => c.id));
  for (const [k, e] of bonds) {
    const [ia, ib] = k.split('-').map(Number);
    if (!alive.has(ia) || !alive.has(ib)) {
      bonds.delete(k);
      continue;
    }
    e.v -= e.v * 0.01 * dt; // bonds fade without contact — ~100s half-life
    if (Math.abs(e.v) < 0.01 && world.time - e.t > 120) bonds.delete(k);
  }
}

// Pedigree kinship from the v0.10 lineage registry: 1.0 for parent/child or
// siblings, 0.5 for shared grandparent, else 0. Exact, cheap, honest.
function pedigreeKin(world, a, b) {
  if (!a || !b || a === b) return 0;
  const la = world.lineage.get(a.id);
  const lb = world.lineage.get(b.id);
  if (!la || !lb) return 0;
  const pa = la.parents || [];
  const pb = lb.parents || [];
  // Parent/child either direction.
  if (pa.includes(b.id) || pb.includes(a.id)) return 1;
  // Siblings: share a parent.
  if (pa.some((p) => pb.includes(p))) return 1;
  // Cousins: share a grandparent.
  const gpa = new Set();
  for (const p of pa) {
    const lp = world.lineage.get(p);
    if (lp && lp.parents) for (const g of lp.parents) gpa.add(g);
  }
  for (const p of pb) {
    const lp = world.lineage.get(p);
    if (lp && lp.parents) for (const g of lp.parents) if (gpa.has(g)) return 0.5;
  }
  return 0;
}

// Tribe detection: greedy clustering of living creatures by homeX.
// Returns [{ id, name, color, homeX, members }]. Identity is analytical —
// recomputed from scratch, so bands can form, merge, and dissolve.
const TRIBE_RADIUS = 350;
const TRIBE_COLORS = [
  '#e08a3c', '#4ca3e0', '#9d6ce0', '#4ce0a3',
  '#e04c6e', '#c9d14a', '#6ee0d8', '#e0e0e0',
];

function detectTribes(world) {
  const living = world.creatures.filter((c) => c.alive && c.homeX !== undefined);
  const unassigned = new Set(living.map((c) => c.id));
  const byId = new Map(living.map((c) => [c.id, c]));
  const tribes = [];
  // Seed each band from the leftmost unassigned home; absorb neighbors.
  while (unassigned.size > 0) {
    let seedId = null;
    let seedX = Infinity;
    for (const id of unassigned) {
      const c = byId.get(id);
      if (c.homeX < seedX) { seedX = c.homeX; seedId = id; }
    }
    const members = [];
    for (const id of [...unassigned]) {
      const c = byId.get(id);
      if (Math.abs(c.homeX - seedX) <= TRIBE_RADIUS) {
        members.push(c);
        unassigned.delete(id);
      }
    }
    let cx = 0;
    for (const m of members) cx += m.homeX;
    cx /= members.length;
    tribes.push({ members: members.map((m) => m.id), homeX: cx });
  }
  // Name bands by zone, disambiguated within the zone.
  const zoneCount = {};
  for (const t of tribes) {
    const z = zoneAt(t.homeX).key;
    zoneCount[z] = (zoneCount[z] || 0) + 1;
    const zoneName = zoneAt(t.homeX).name;
    t.name = `${zoneName} band ${zoneCount[z]}`;
    t.zone = z;
  }
  tribes.sort((a, b) => a.homeX - b.homeX);
  tribes.forEach((t, i) => {
    t.id = `band-${i}`;
    t.color = TRIBE_COLORS[i % TRIBE_COLORS.length];
  });
  return tribes;
}

// The creature's strongest bond (by absolute value): { other, v } | null.
// Used by the creature panel — friendship, made visible.
function strongestBond(world, c) {
  let best = null;
  for (const [k, e] of world.bonds) {
    const d = k.indexOf('-');
    const ia = Number(k.slice(0, d));
    const ib = Number(k.slice(d + 1));
    let otherId = -1;
    if (ia === c.id) otherId = ib;
    else if (ib === c.id) otherId = ia;
    else continue;
    if (!best || Math.abs(e.v) > Math.abs(best.v)) {
      best = { otherId, v: e.v };
    }
  }
  if (!best) return null;
  const other = world.creatures.find((o) => o.id === best.otherId);
  return { other: other || { name: `#${best.otherId}` }, v: best.v };
}

// QA/telemetry snapshot: band count, sizes, home fidelity, bond health.
function socialStats(world) {
  const living = world.creatures.filter((c) => c.alive);
  let homeDistSum = 0;
  let homeN = 0;
  for (const c of living) {
    if (c.homeX !== undefined && c._senses && c._senses.homeDist !== undefined) {
      homeDistSum += c._senses.homeDist;
      homeN++;
    }
  }
  let bondSum = 0;
  let bondN = 0;
  let friendPairs = 0; // pairs with bond > 0.3
  for (const e of world.bonds.values()) {
    bondSum += e.v;
    bondN++;
    if (e.v > 0.3) friendPairs++;
  }
  const tribes = world.tribes || [];
  return {
    tribes: tribes.length,
    meanTribeSize: tribes.length ? living.length / tribes.length : 0,
    homeFidelity: homeN ? 1 - homeDistSum / homeN : 0, // 1 = never leaves home
    bonds: bondN,
    meanBond: bondN ? bondSum / bondN : 0,
    friendPairs,
  };
}


// ---- src/sim/creature.js ----
// A creature: genome + biochemistry + brain + body in the world.
// Per tick: sense → brain decides → act → learn from the outcome.

// v0.18 "Realms": the biome map — region layout, temperature fields,
// waters, ground. Pure geography; every call NaN-guarded at use.

let nextId = 1;

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
// NaN-safe position readers (the v0.15 lesson — never let a bad coordinate
// poison distance math).
function cx0(c) { return Number.isFinite(c.x) ? c.x : 0; }
function cy0(c) { return Number.isFinite(c.y) ? c.y : 800; }

// --- physics: the canopy has gravity now ---------------------------------
// y grows downward (screen space). Ground platform at y=800 spans the whole
// world, so every fall ends somewhere — there is no void below.
const GRAVITY = 900; // px/s^2 — the world's own law, not a dice roll
const MAX_FALL = 950; // terminal velocity px/s
const FALL_HURT_V = 520; // land faster than this and it costs you
const FALL_DMG = 1 / 900; // injury per px/s of impact past the threshold
// v0.20 "Falling": the vestibular threshold — dropping faster than this, the
// fall is felt while it happens (sense 34). Below it, short hops stay quiet.
const FALL_FEEL_V = 180;
// v0.20 "Falling": a fall longer than this strands — the landing is an
// ecological event (chronicle line, a long climb back), not a damage tick.
const STRAND_PX = 350;
const JUMP_V_BASE = 260; // px/s upward at legPower 0
const JUMP_V_GAIN = 420; // +px/s of launch at legPower 1
const JUMP_RANGE_DY = 280; // highest ledge the jumpNear sense can see
const JUMP_RANGE_DX = 220; // farthest sideways the jumpNear sense sees
// v0.17 "Bauplan": the glide verb's reach — a ledge within this box but
// beyond jump range is what farLedge (sense 25) reports.
const GLIDE_RANGE_DY = 520; // highest ledge a glide can reach
const GLIDE_RANGE_DX = 450; // farthest sideways a glide carries
// v0.18 "Realms": water physics. Buoyancy is a spring toward the float
// equilibrium (FLOAT_MARGIN below the surface) with damping — creatures
// float with their backs out, reading submerged=false, breathing air.
// The submerged line is the literal task formula: 14px+ under the surface.
const SUBMERGE_MARGIN = 14; // px below surfaceY = submerged (task formula)
const FLOAT_MARGIN = 11; // px below surface at the float equilibrium
const BUOY_K = 20; // buoyancy spring constant
const BUOY_DAMP = 4; // buoyancy damping (settles in ~2s; 9 overdamps the discrete integrator)
const WATER_VEL_DAMP = 2.5; // per-second velocity damping in water
const WATER_NEAR_RANGE = 240; // px — the waterNear sense horizon
const BURIED_NEAR_RANGE = 240; // px — the buriedNear sense horizon
const DRINK_REACH = 40; // px above the surface that still counts as adjacent
const DIG_TIME = 3; // seconds of digging to unearth buried food
const DIG_RADIUS = 60; // px — digAt search radius
// v0.18 "Realms": the diet. Meat kinds burn through meatEfficiency;
// small prey and corpses have fixed nutrition overrides. Plant kinds burn
// through fruitEfficiency. Leaves are medicine, scraps desperation.
// Anything not listed is unknown — skipped, never crashed on.
const MEAT_KINDS = new Set(['meat', 'bug', 'minnow', 'corpse', 'grub', 'morsel']);
const PLANT_KINDS = new Set(['fruit', 'tuber', 'kelp', 'moss', 'seed',
  'propagule', 'cactusfruit', 'berry', 'snowcache', 'sandcache']);
const PREY_NUTRITION = 0.15; // bug/minnow/grub/morsel — small mouthfuls
const CORPSE_NUTRITION = 0.4; // corpse — rotten, but food

const NAMES = [
  'Pip', 'Moss', 'Wren', 'Pebble', 'Fig', 'Nix', 'Bramble', 'Tansy',
  'Clover', 'Soot', 'Miso', 'Plum', 'Ash', 'Juniper', 'Sorrel', 'Dune',
  'Kiki', 'Bram', 'Lark', 'Mallow', 'Nettle', 'Oat', 'Puddle', 'Quill',
];

function createCreature(genome, x, platformIndex, rng, opts = {}) {
  // v0.18 "Realms": the aquatic derivations (swimSpeed/sailDump/waterDrag)
  // overwrite the old fin-based swimSpeed with the membrane formula.
  const pheno = deriveAquaticPheno(phenotype(genome));
  return {
    kind: 'creature',
    id: nextId++,
    name: opts.name || rng.pick(NAMES),
    genome,
    pheno,
    // v0.17 "Bauplan": the realized body plan — what development has built
    // so far. Newborns are babies; the plan re-expresses on stage changes.
    bodyPlan: expressBuds(pheno, developmentalGrowth01('baby')),
    biochem: createBiochem(),
    brain: createBrain(pheno, rng),
    memory: createMemory(pheno), // episodic memory: lived + observed episodes
    episodeReward: 0, // outcome accumulating since the last decision
    episodeInput: null, // senses at the last decision
    episodeAction: -1, // action index executed since the last decision
    sleepTicks: 0, // consecutive sleeping ticks (gates consolidation)
    x,
    platformIndex,
    // physics: real vertical position + velocity. Grounded creatures stand
    // on their platform's y; airborne ones answer to gravity. y snaps to
    // the platform on the first physics tick (see stepPhysics).
    y: opts.y !== undefined ? opts.y : undefined,
    vx: 0,
    vy: 0,
    grounded: true,
    // v0.17.2: the observer's hand. While dragged, updateCreature pauses
    // physics (the hand holds the body, not the world) — the UI sets this
    // on grab and clears it on release. It was designed but never wired.
    dragged: false,
    // v0.18 "Realms": water state — set each tick by stepPhysics.
    // submerged: 14px+ below the surface (the literal formula).
    // _water: the waterAt() record ({surfaceY, salt}) or null.
    // _waterNear: water within 240px (sense 27).
    submerged: false,
    _water: null,
    _waterNear: false,
    // v0.12: home-range imprinting. Birthplace is home — permanent.
    // Philopatry, not a leash: the brain (via homeDist + instHomeSeek)
    // decides how much it matters.
    homeX: x,
    homePlatform: platformIndex,
    facing: rng.chance(0.5) ? 1 : -1,
    action: 'wander',
    actionLabel: 'wandering',
    sleeping: false,
    playing: false,
    nearFriend: false,
    sex: rng.chance(0.5) ? 'male' : 'female',
    parents: opts.parents || null,
    generation: opts.generation || 0, // v0.7: pedigree depth — the ratchet's clock
    children: [],
    alive: true,
    // v0.7 culture: carried tradition ids, per-tradition aim points (noisy
    // copies), and a log of recent meals for invention detection.
    traditions: [],
    traditionAim: {},
    mealLog: [],
    wanderDir: 1,
    wanderTimer: 0,
    actionTimer: 0, // commitment to the current action (anti-dither)
    mateCooldown: 0,
    pettedFlag: false,
    scoldedFlag: false,
    hopPhase: rng.range(0, Math.PI * 2),
    // v0.14 "Voices": the acoustic self. voicePitch starts at the genetic
    // base and drifts toward heard pitches (vocal learning — dialect).
    // heardPitches is the culture memory: a ring buffer of the last 16
    // pitches heard, the raw material of accent.
    voicePitch: pheno.vocalPitch ?? 0.5,
    heardPitches: [],
    // v0.16 "Tongues": the lexicon — per-creature acoustic prototypes with
    // context tallies. Culture, not DNA: hatchlings start empty and learn
    // by hearing (infant critical-period boost in lexLearnRate).
    lexicon: createLexicon(lexSlots(pheno)),
    _contextWindow: [], // hearer's salient-context window (delta a)
    // v0.14 "Voices": the waste cycle — the gut holds what digestion
    // didn't take. Excretion (in updateCreature) returns it to the soil.
    gut: 0,
    flinchT: 0, // seconds since last injury — drives the flinch flash
    clashCooldown: 0, // per-creature refractory so spikes can't machine-gun
    // v0.20 "Hands": the hand. held is null or { material, weight,
    // hardness, sharpness, flammability, wear } — properties only, never
    // item types (termite logic: the engine never knows a 'hammer').
    // craftLog records successful tool uses for tradition invention.
    held: null,
    craftLog: [],
  };
}

// v0.20 "Hands": nearest manipulable object within grasp reach — shared
// by the objectNear sense and the grasp action. Returns { obj, kind, dist }
// or null. Pebbles and sticks are grasped whole; mineral deposits yield a
// sample (amount -= 1, mirroring the observer's digMineral) while the
// deposit stays. Same platform only; reach is groomReach (arm reach).
function nearestGraspable(c, world) {
  const reach = c.pheno.groomReach || 40;
  let best = null;
  const consider = (obj, kind, x) => {
    if (obj.platformIndex !== c.platformIndex) return;
    const d = Math.abs(x - c.x);
    if (d > reach) return;
    if (!best || d < best.dist) best = { obj, kind, dist: d };
  };
  for (const p of world.pebbles || []) consider(p, 'pebble', p.x);
  for (const s of world.sticks || []) consider(s, 'stick', s.x);
  for (const m of world.minerals || []) {
    if (m.amount > 0) consider(m, 'mineral', m.x);
  }
  return best;
}

function creatureRadius(c) {
  return c.pheno.bodyRadius * stageSize(ageStage(c.biochem, c.pheno));
}

// v0.18 "Realms": water state — refreshed every tick. waterAt is null
// outside water; submerged is the literal formula: 14px+ below the
// surface. waterNear scans ±240px. NaN-guarded (the v0.15 lesson).
function refreshWaterState(c, world) {
  const cx = cx0(c);
  const cy = Number.isFinite(c.y) ? c.y : 800;
  let w = null;
  try { w = waterAt(cx, cy); } catch (e) { w = null; }
  c._water = w;
  c.submerged = !!w && Number.isFinite(w.surfaceY) && cy > w.surfaceY + SUBMERGE_MARGIN;
  let near = !!w;
  if (!near) {
    try {
      near = !!waterAt(cx - WATER_NEAR_RANGE, cy) || !!waterAt(cx + WATER_NEAR_RANGE, cy);
    } catch (e) { near = false; }
  }
  c._waterNear = near;
  return w;
}

const SENSE_RANGE = 420;
const EAT_RANGE = 30;

// v0.18 "Realms": homesickness scales by biome-center distance, not just
// raw displacement — leaving the birth biome costs more than leaving the
// birth zone did (BIOMES_DESIGN §4). The v0.13 base (|x−homeX|/800) is kept
// and multiplied by (1+dist/1200), where dist is the creature's distance
// to its birth biome's center; clamped to [0,1]. NaN anywhere (no home,
// no biome map) falls back to the v0.13 behavior — the v0.15 lesson.
function scaledHomeDist(c, world) {
  if (c.homeX === undefined || c.homeX === null) return 0;
  const cx = Number.isFinite(c.x) ? c.x : c.homeX;
  const base = Math.abs(cx - c.homeX) / 800;
  if (!Number.isFinite(base)) return 0;
  let dist = 0;
  let ok = false;
  try {
    const hb = biomeAt(c.homeX, Number.isFinite(c.y) ? c.y : 800);
    const bcx = biomeCenterX(hb);
    if (Number.isFinite(bcx)) { dist = Math.abs(cx - bcx); ok = true; }
  } catch (e) { ok = false; }
  if (!ok || !Number.isFinite(dist)) return clamp01(base);
  return clamp01(base * (1 + dist / 1200));
}

function nearest(list, x, platformIndex, range, excludeId) {
  let best = null;
  let bestD = range;
  for (const o of list) {
    // NB: o.alive === false (strict) so food/toys without an alive field pass.
    if (o.alive === false || o.id === excludeId || o.platformIndex !== platformIndex) continue;
    const d = Math.abs(o.x - x);
    if (d < bestD) {
      bestD = d;
      best = o;
    }
  }
  return best ? { obj: best, dist: bestD / range, dir: Math.sign(best.x - x) || 1 } : null;
}

function nearestSpatial(sorted, x, range, excludeId) {
  if (!sorted || sorted.length === 0) return null;
  let lo = 0, hi = sorted.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (sorted[mid].x < x) lo = mid + 1; else hi = mid;
  }
  let best = null, bestD = range;
  for (let i = lo - 1; i >= 0; i--) {
    const o = sorted[i];
    const d = x - o.x;
    if (d >= bestD) break;
    if (o.id === excludeId) continue;
    bestD = d; best = o;
  }
  for (let i = lo; i < sorted.length; i++) {
    const o = sorted[i];
    const d = o.x - x;
    if (d >= bestD) break;
    if (o.id === excludeId) continue;
    bestD = d; best = o;
  }
  return best ? { obj: best, dist: bestD / range, dir: Math.sign(best.x - x) || 1 } : null;
}

function gatherSenses(c, world) {
  const b = c.biochem;
  // v0.6 morphology: sight range comes from the eyeSize gene.
  const range = c.pheno.sightRange || SENSE_RANGE;
  // v0.8: the sick seek the bitter leaf. When ill, the food sense prefers
  // medicinal leaves over fruit — a species-typical prior; the brain (which
  // now senses illness too) learns the rest. Falls back to any food.
  let food = null;
  if (b.illness > 0.25) {
    for (const f of world.foods) {
      if (f.foodKind !== 'leaf' || f.platformIndex !== c.platformIndex) continue;
      const d = Math.abs(f.x - c.x);
      if (d < range && (!food || d < food.dist * range)) {
        food = { obj: f, dist: d / range, dir: Math.sign(f.x - c.x) || 1 };
      }
    }
  }
  if (!food) food = nearest(world.foods, c.x, c.platformIndex, range);
  const other = nearestSpatial(world._spatial && world._spatial.get(c.platformIndex), c.x, range, c.id);
  const toy = nearest([...world.toys, ...world.critters], c.x, c.platformIndex, range);
  const stage = ageStage(b, c.pheno);
  // v0.12: the social senses. homeDist — how far from the imprinted home
  // range (0 at home, 1 at 800px+). kinNear — pedigree kinship of the
  // nearest creature (1 parent/child/sibling, 0.5 cousin, else 0).
  // bondNear — the pairwise bond value with that creature (-1..1).
  const otherObj = other && other.obj;
  // Canopy senses (new): climbUp/climbDown — 1 when a climb link to a higher
  // (lower y) or lower branch is reachable from the creature's current x.
  // The instinct genes instClimbUp/instClimbDown wire these to the climb
  // action; the brain learns the rest.
  let climbUp = 0, climbDown = 0;
  for (const { to, link } of climbLinksFrom(world, c.platformIndex)) {
    if (c.x >= link.x1 - 30 && c.x <= link.x2 + 30) {
      if (world.platforms[to].y < world.platforms[c.platformIndex].y) climbUp = 1;
      else climbDown = 1;
    }
  }
  // Physics sense (new): jumpNear — 1 when a jumpable ledge (a higher
  // platform within leap range) is nearby. The instJump gene wires this to
  // the jump action; the brain learns the rest.
  let jumpNear = 0;
  {
    const py = world.platforms[c.platformIndex].y;
    const maxD = Math.hypot(JUMP_RANGE_DX, JUMP_RANGE_DY);
    let bd = Infinity;
    for (let i = 0; i < world.platforms.length; i++) {
      if (i === c.platformIndex) continue;
      const p = world.platforms[i];
      const dy = py - p.y; // positive = ledge above
      if (dy < 30 || dy > JUMP_RANGE_DY) continue;
      const cx = Math.max(p.x1, Math.min(p.x2, c.x));
      const dx = Math.abs(c.x - cx);
      if (dx > JUMP_RANGE_DX) continue;
      const d = Math.hypot(dx, dy);
      if (d < bd) bd = d;
    }
    if (bd < Infinity) jumpNear = 1 - bd / maxD;
  }
  // v0.17 "Bauplan": the body-plan senses. airborne is 1 whenever the
  // creature is off the branch — the glide verb's reader. farLedge reports
  // a ledge within glide range but BEYOND jump range: the travel verb's
  // reader, the situation wings are for. submerged/waterNear read the
  // body's water state — 0 in v0.17, because the world has no water yet.
  const airborne = c.grounded ? 0 : 1;
  let farLedge = 0;
  {
    const py = world.platforms[c.platformIndex].y;
    const gMaxD = Math.hypot(GLIDE_RANGE_DX, GLIDE_RANGE_DY);
    const jMaxD = Math.hypot(JUMP_RANGE_DX, JUMP_RANGE_DY);
    let bd = Infinity;
    for (let i = 0; i < world.platforms.length; i++) {
      if (i === c.platformIndex) continue;
      const p = world.platforms[i];
      const dy = py - p.y; // positive = ledge above
      if (dy < 30 || dy > GLIDE_RANGE_DY) continue;
      const cx = Math.max(p.x1, Math.min(p.x2, c.x));
      const dx = Math.abs(c.x - cx);
      if (dx > GLIDE_RANGE_DX) continue;
      const d = Math.hypot(dx, dy);
      if (d < bd) bd = d;
    }
    if (bd < Infinity && bd > jMaxD) farLedge = 1 - bd / gMaxD;
  }
  // v2 (breeding fix): _mate — the nearest VALID mate: adult, opposite sex,
  // in sight. The old code courted s._other (the nearest body), which was so
  // often same-sex or juvenile that tryMate never fired and lineages died out.
  // _mateDist is the normalized distance, like creatureDist. Only adults
  // look — juveniles don't shop for mates.
  // v2 (M): mate preference — heritable beauty standards. Each candidate is
  // scored on proximity AND color match to the chooser's preferred coat
  // color; choosiness scales how much color counts. Founder choosiness 0 →
  // nearest wins, exactly as before. Hue distance is circular.
  // Courtship across branches: mates are sensed in 2D (platform height
  // counts), not just along the home branch. The same-platform restriction
  // meant adults scattered across 9 platforms never found each other — zero
  // matings in long headless runs — and lineages died out. A climbing
  // species courts in the canopy's full depth.
  let mate = null, mateDist = 1;
  if (stage === 'adult' || stage === 'senior') {
    const prefH = c.pheno.matePrefHue ?? 0.5;
    const prefS = c.pheno.matePrefSat ?? 0.5;
    const choosy = c.pheno.matePrefChoosy ?? 0;
    const py = world.platforms[c.platformIndex].y;
    let best = -Infinity;
    for (const o of world.creatures) {
      if (!o.alive || o.id === c.id) continue;
      if (o.sex === c.sex) continue;
      const ost = ageStage(o.biochem, o.pheno);
      if (ost !== 'adult' && ost !== 'senior') continue;
      const oy = world.platforms[o.platformIndex].y;
      const d = Math.hypot(o.x - c.x, oy - py);
      if (d >= range) continue;
      const prox = 1 - d / range;
      let score = prox;
      if (choosy > 0) {
        const mh = o.pheno.coatHue01 ?? 0.5;
        const ms = o.pheno.coatSat01 ?? 0.5;
        const dh = Math.abs(mh - prefH);
        const dHue = Math.min(dh, 1 - dh); // hue is circular
        const dSat = Math.abs(ms - prefS);
        const colorDist = Math.min(1, Math.sqrt(dHue * dHue + dSat * dSat));
        score = prox + choosy * (1 - colorDist);
      }
      // v0.14 "Voices": prezygotic barrier — call choosiness. The chooser
      // prefers mates whose *voice* (learned pitch, i.e. the dialect)
      // resembles its own. Founder 0 = this never fires; dialects evolve,
      // then choosiness can.
      const callChoosy = c.pheno.matePrefCall ?? 0;
      if (callChoosy > 0) {
        const myPitch = c.voicePitch ?? 0.5;
        const op = o.voicePitch ?? 0.5;
        // v0.16 (delta d): lexicon distance joins the dialect mate-choice —
        // accent similarity AND word similarity. Word-drift becomes a
        // prezygotic barrier: this is what turns drift into languages.
        const accentSim = 1 - Math.min(1, Math.abs(myPitch - op));
        const wordSim = 1 - lexiconDistance(c.lexicon, o.lexicon);
        score += callChoosy * (0.6 * accentSim + 0.4 * wordSim);
      }
      // v0.17 "Bauplan": sexual selection on novelty — Fisherian runaway.
      // Choosiness on the candidate's novel-structure area (wings + sails
      // + gills + fins), read from the GENES (choosing genes, not bodies).
      // Founder 0 → nearest/color wins, exactly as before.
      const novelChoosy = c.pheno.matePrefNovel ?? 0;
      if (novelChoosy > 0) {
        const novelty = (o.pheno.wingArea || 0) + (o.pheno.sailArea || 0) +
          (o.pheno.gillArea || 0) + (o.pheno.finArea || 0);
        score += novelChoosy * Math.min(1, novelty);
      }
      if (score > best) { best = score; mate = o; mateDist = d / range; }
    }
  }
  // v2: groomNear — a groomable neighbor in reach, on the same platform.
  // The sense slot existed (index 19) but was never fed; now the brain can
  // learn that grooming needs someone nearby.
  const groomReach = c.pheno.groomReach || 70;
  const groomNear = other && other.platformIndex === c.platformIndex
    ? Math.max(0, 1 - Math.abs(other.x - c.x) / groomReach) : 0;
  // v0.14 "Voices": what the acoustic commons sounds like right now —
  // the loudest recent call on this platform within earshot.
  const heard = callsHeardBy(world, c);
  // v0.18 "Realms": buriedNear (sense 31) — the dig verb's reader. Nearest
  // buried food within 240px; 0 when the world has no pantry (guarded).
  let buriedNear = 0;
  {
    const buried = world.buried || [];
    let bd = Infinity;
    for (const bf of buried) {
      if (!Number.isFinite(bf.x) || !Number.isFinite(bf.y)) continue;
      const d = Math.hypot(bf.x - c.x, bf.y - (c.y ?? bf.y));
      if (d < bd) bd = d;
    }
    if (bd <= BURIED_NEAR_RANGE) buriedNear = 1 - bd / BURIED_NEAR_RANGE;
  }
  // v0.20 "Hands": objectNear (sense 32) — the grasp verb's reader. Nearest
  // manipulable object within arm reach (graspPairs reach, same platform):
  // pebbles, sticks, or a mineral deposit with samples left. heldWeight
  // (sense 33) — 0 empty-handed, else the carried object's weight.
  let objectNear = 0;
  {
    const grasp = nearestGraspable(c, world);
    if (grasp) objectNear = 1 - Math.min(1, grasp.dist / (c.pheno.groomReach || 40));
  }
  const heldWeight = c.held ? clamp01(c.held.weight || 0) : 0;
  // v0.20 "Falling": the vestibular sense — 0 on the branch or leaping up;
  // while dropping fast it climbs toward 1 with the fall's intensity.
  // Gliders feel less (glideLift bleeds vy); the founder's hops stay quiet.
  const vy = Number.isFinite(c.vy) ? c.vy : 0;
  const falling = (!c.grounded && vy > FALL_FEEL_V)
    ? clamp01((vy - FALL_FEEL_V) / (MAX_FALL - FALL_FEEL_V)) : 0;
  const senses = {
    _range: range, // px base for dist normalization (used by contagion/mating checks)
    hunger: b.hunger,
    tiredness: 1 - b.energy,
    boredom: b.fun,
    loneliness: b.social,
    fear: b.fear,
    illness: b.illness, // v0.8: the 15th sense — feeling sick is learnable
    light: world.light,
    homeDist: scaledHomeDist(c, world), // v0.18: biome-center-scaled (was |x−homeX|/800)
    kinNear: otherObj ? pedigreeKin(world, c, otherObj) : 0,
    bondNear: otherObj && world.bonds ? getBond(world.bonds, c, otherObj) : 0,
    climbUp, climbDown, jumpNear, groomNear,
    callHeard: heard.heard, callPitch: heard.pitch,
    airborne, farLedge, // v0.17: the body-plan senses
    submerged: c.submerged ? 1 : 0, waterNear: c._waterNear ? 1 : 0, // v0.18: live from stepPhysics
    // v0.18 "Realms": thirst = 1 − hydration (design doc §6); cold/heat are
    // the coreTemp readouts (senses, not drives — BIOMES_DESIGN §6).
    thirst: 1 - (Number.isFinite(b.hydration) ? b.hydration : 1),
    cold: coldSense(b, c.pheno),
    heat: heatSense(b, c.pheno),
    buriedNear,
    objectNear, heldWeight, // v0.20: the hands senses
    falling, // v0.20 "Falling": the vestibular sense (index 34)
    _heardCall: heard.call || null, // v0.16: the full acoustic event for the lexicon
    wasteOdor: wasteOdorOf(world, c.x), // v0.14: disgust — the smell of fouled ground
    _alarmHeard: heard.alarm, // v0.14: alarm calls reassure — fear drains slightly
    foodDist: food ? food.dist : 1,
    foodDir: food ? food.dir : 0,
    creatureDist: other ? other.dist : 1,
    creatureDir: other ? other.dir : 0,
    toyDist: toy ? toy.dist : 1,
    toyDir: toy ? toy.dir : 0,
    isAdult: stage === 'adult' || stage === 'senior' ? 1 : 0,
    _food: food && food.obj,
    _other: other && other.obj,
    _toy: toy && toy.obj,
    _mate: mate,
    _mateDist: mateDist,
  };
  // v2 (C): receptors — chemical levels modulate senses. Each receptor gene
  // adds gain × max(0, chem − thr) to its target sense. Founder gains are 0:
  // silent by default, evolvable. This is how a lineage can learn that
  // oxytocin means company, or that adrenaline sharpens fear.
  const pheno = c.pheno;
  for (let i = 0; i < 6; i++) {
    const gain = pheno[`rc${i}gain`] ?? 0;
    if (gain === 0) continue;
    const chem = pheno[`rc${i}chem`];
    const chemV = b[chem];
    if (chemV === undefined) continue;
    const senseKey = pheno[`rc${i}sense`];
    if (!(senseKey in senses)) continue;
    senses[senseKey] += gain * Math.max(0, chemV - (pheno[`rc${i}thr`] ?? 0.5));
  }
  return senses;
}

function moveAlong(c, world, dir, dt, mult = 1, edge = 'turn') {
  const stage = ageStage(c.biochem, c.pheno);
  const sickSlow = c.biochem.illness > 0.5 ? 0.7 : 1; // illness saps strength
  // v0.9: wounds slow the body — the body's history constrains the soul.
  const injurySlow = 1 - 0.35 * c.biochem.injury;
  // v0.6 morphology: long legs = fast but fur is heavy.
  const morphSpeed = c.pheno.legSpeedMult * (1 - c.pheno.furWeight);
  // v0.17 "Bauplan": serpentine plans — no grasp limbs, the body is the
  // limb. The realized body plan decides; the founder (2 grasp pairs)
  // walks exactly as before.
  const graspPairs = c.bodyPlan ? c.bodyPlan.graspPairs : (c.pheno.graspPairs ?? 2);
  const baseSpeed = graspPairs === 0 ? (c.pheno.slitherSpeed || c.pheno.walkSpeed) : c.pheno.walkSpeed;
  const speed = baseSpeed * stageSize(stage) * (stage === 'senior' ? 0.7 : 1) * sickSlow * injurySlow * mult * morphSpeed;
  const plat = world.platforms[c.platformIndex];
  const r = creatureRadius(c);
  c.x += dir * speed * dt;
  if (Math.abs(dir) > 0) c._active = Math.max(c._active || 0, Math.min(1, mult)); // exertion for the chemistry
  // edge: 'turn' (wanderers turn around at the brink — branches stay livable)
  //   or 'fall' (directed feet can walk off the edge — gravity takes it).
  if (c.x < plat.x1 + r || c.x > plat.x2 - r) {
    if (edge === 'turn' || !c.grounded) {
      if (c.x < plat.x1 + r) { c.x = plat.x1 + r; c.wanderDir *= -1; }
      else { c.x = plat.x2 - r; c.wanderDir *= -1; }
    } else {
      // Directed movement walks off the edge — the fall begins.
      c.grounded = false;
      c.vx = dir * speed;
      c.vy = Math.min(c.vy, 0);
    }
  }
  if (dir !== 0) c.facing = dir;
  c.hopPhase += dt * 10;
}

// Integrate gravity, land on platforms, take fall damage. The world's own
// natural law — cause and effect, never dice.
// v0.18 "Realms": water gains its own branch — buoyancy replaces gravity.
// Every term NaN-guarded (the v0.15 lesson); with no water the old path
// runs bit-identically.
function stepPhysics(c, world, dt) {
  const plat = world.platforms[c.platformIndex];
  if (c.y === undefined || c.y === null) {
    // First tick: snap to the platform. (createCreature can't see the world.)
    // Position only — a jump or walk-off that fired earlier this same tick
    // already set grounded=false and a velocity; don't stomp the launch.
    c.y = plat.y;
    if (c.grounded) { c.vx = 0; c.vy = 0; }
  }
  // v0.18: water state, every tick (also refreshed in executeAction so the
  // water verbs see this tick's state, not last tick's).
  const w = refreshWaterState(c, world);
  const cy = Number.isFinite(c.y) ? c.y : 0;
  if (w && Number.isFinite(w.surfaceY)) {
    // In water: buoyancy replaces gravity. A spring toward the float
    // equilibrium (11px below the surface) with damping, plus drag —
    // floating bodies read submerged=false and breathe. No gravity here;
    // the swim verb steers, the dive verb holds depth.
    c.grounded = false;
    // The dive verb's depth hold: pin to the held depth instead of
    // floating up (gills or held breath pay for it in oxygen).
    const holdY = c._holdDepth;
    const targetY = (holdY !== undefined && Number.isFinite(holdY))
      ? holdY : w.surfaceY + FLOAT_MARGIN;
    const spring = (targetY - cy) * BUOY_K;
    if (Number.isFinite(spring)) c.vy = (Number.isFinite(c.vy) ? c.vy : 0) + spring * dt;
    const dampK = Math.max(0, 1 - BUOY_DAMP * dt);
    c.vy *= dampK;
    const vDampK = Math.max(0, 1 - WATER_VEL_DAMP * dt);
    c.vx = (Number.isFinite(c.vx) ? c.vx : 0) * vDampK;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    // The world has walls: nobody leaves sideways. And nobody sinks
    // through the floor of the world.
    if (c.x < 0) { c.x = 0; c.vx = Math.abs(c.vx) * 0.3; }
    if (c.x > world.width) { c.x = world.width; c.vx = -Math.abs(c.vx) * 0.3; }
    if (c.y > world.height) { c.y = world.height; c.vy = 0; }
    return;
  }
  if (c.grounded) {
    // v0.20: never teleport — stand on the platform only if we're actually
    // at it. (A body the floor clamp caught with a stale platformIndex
    // rests on the floor instead of popping back up to mid-air.)
    if (Math.abs(c.y - plat.y) < 40 && c.x >= plat.x1 && c.x <= plat.x2) {
      c.y = plat.y; // stand on the branch
    }
    c.vy = 0;
    // v0.20 "Falling": while grounded, remember where the next fall starts.
    c._fallStartY = c.y;
    c._fallPeak = 0;
    return;
  }
  // v0.20: anti-slip — a body just below its own platform, well inside the
  // span (it swam out of a pool below the bank, or tunneled a pixel past),
  // climbs back out onto it. Near the edges we stay hands-off: walking off
  // a cliff must keep working, so the pop-up keeps clear of the brink.
  if (plat && !c.grounded) {
    const r = creatureRadius(c);
    const dy = c.y - plat.y;
    if (dy > 0 && dy < 40 && c.x > plat.x1 + r && c.x < plat.x2 - r) {
      c.y = plat.y;
      c.vy = 0;
      c.vx = 0;
      c.grounded = true;
      return;
    }
  }
  // Airborne: gravity integrates — reduced while gliding (descent, never
  // ascent: glideLift ≤ 0.85 by construction). The wings also steer
  // slightly toward the facing direction. c.gliding is only ever true
  // with real wings, so the founder's falls are untouched.
  integrateGravity(c, world, dt);
  // v0.20 "Falling": the fall is felt WHILE it happens, not just at the
  // landing. Dropping fast, fear and adrenaline climb with the fall's
  // intensity — the vestibular signal the brain's new sense reads. Fear
  // past 0.6 grounds the call type as 'alarm' (groundCallType), so the
  // scream the fall-instinct fires carries honest meaning; the landing
  // startle in land() scales with the peak fear the fall produced.
  if (!c.grounded && c.vy > FALL_FEEL_V && c.biochem) {
    const fi = clamp01((c.vy - FALL_FEEL_V) / (MAX_FALL - FALL_FEEL_V));
    if (fi > (c._fallPeak || 0)) c._fallPeak = fi;
    const b = c.biochem;
    b.fear = clamp01(b.fear + 0.8 * fi * dt);
    b.adrenaline = clamp01(b.adrenaline + 0.5 * fi * dt);
  }
}

// v0.20 "One physics": the airborne gravity branch, extracted from
// stepPhysics so every body in the world falls under the same law —
// tanglekins, beached sharks, bears, all of it. Gravity integrates,
// platforms catch, hard landings cost. Joshua's law: physics works the
// same for everything in this world.
function integrateGravity(c, world, dt) {
  const prevY = c.y;
  const glideLift = c.gliding ? (c.pheno.glideLift || 0) : 0;
  const vy0 = Number.isFinite(c.vy) ? c.vy : 0;
  c.vy = Math.min(MAX_FALL, vy0 + GRAVITY * (1 - glideLift) * dt);
  if (c.gliding) c.vx += c.facing * 30 * dt;
  c.x += (Number.isFinite(c.vx) ? c.vx : 0) * dt;
  // The world has walls: nobody leaves sideways.
  if (c.x < 0) { c.x = 0; c.vx = Math.abs(c.vx) * 0.3; }
  if (c.x > world.width) { c.x = world.width; c.vx = -Math.abs(c.vx) * 0.3; }
  c.y += c.vy * dt;
  // Landing: falling through a platform's span means standing on it.
  // (Only while falling — leaping up through a branch is allowed.)
  if (c.vy > 0) {
    for (let i = 0; i < world.platforms.length; i++) {
      const p = world.platforms[i];
      if (c.x >= p.x1 && c.x <= p.x2 && prevY <= p.y && c.y >= p.y) {
        const impact = c.vy;
        c.y = p.y;
        c.vy = 0;
        c.vx = 0;
        c.grounded = true;
        c.platformIndex = i;
        land(c, world, impact);
        break;
      }
    }
  }
  // v0.18: the world has a floor — nobody falls through it. (The water
  // branch already clamps; the gravity branch needs it too, now that
  // creatures can exit water over pool regions with no platform below.)
  // v0.20: the clamp grounds the body but leaves platformIndex alone —
  // the grounded snap below refuses to teleport, so the body rests on
  // the floor instead of popping back up to a platform it isn't over
  // (the bug Joshua watched: fall through, then hover mid-air).
  if (c.y > world.height) {
    c.y = world.height;
    c.vy = 0;
    c.vx = 0;
    c.grounded = true;
  }
}

// v2 (E): emitters — firing an action releases a pulse of a chemical.
// Each emitter gene names a trigger action and a chemical; committing to
// the action adds the amount (founder: small nudges, not floods).
function fireEmitters(c) {
  const pheno = c.pheno;
  const b = c.biochem;
  for (let i = 0; i < 6; i++) {
    if (pheno[`em${i}trig`] !== c.action) continue;
    const amt = pheno[`em${i}amt`] ?? 0;
    if (amt === 0) continue;
    const chem = pheno[`em${i}chem`];
    if (b[chem] === undefined) continue;
    b[chem] = clamp01(b[chem] + amt);
  }
}

// v2 (S): stimulus valence — world events carry evolvable valence. Each
// stimulus gene names an event and a signed valence × intensity; the sum
// over the four genes nudges chemistry (good → endorphin, bad → adrenaline)
// and adds a learnable reward. Founder valences are 0: silent by default.
function applyStimulus(c, eventName) {
  const pheno = c.pheno;
  let v = 0;
  for (let i = 0; i < 4; i++) {
    if (pheno[`st${i}event`] !== eventName) continue;
    v += (pheno[`st${i}val`] ?? 0) * (pheno[`st${i}int`] ?? 0.5);
  }
  if (v === 0) return;
  const b = c.biochem;
  if (v > 0) b.endorphin = clamp01(b.endorphin + v * 0.5);
  else b.adrenaline = clamp01(b.adrenaline - v * 0.5);
  c.reward += v * 0.3;
}

// Touchdown: hard landings cost injury, startle, and a flinch the painter
// shows. Soft landings are just Tuesday.
// v0.17 "Bauplan": fallSoak — membranes and sails drag the fall, softening
// the impact (exaptation's bridge: display → drag → flight). And a glide
// that ends in a touchdown feels like a small triumph. Founder fallSoak 0.
function land(c, world, impact) {
  const wasGliding = c.gliding;
  c.gliding = false;
  // v0.20 "Falling": how far the body fell, and how frightening the fall
  // was at its peak. _fallStartY is the last grounded height (stepPhysics
  // keeps it current); predators falling through integrateGravity never
  // set it, so their landings stay quiet.
  const fallPeak = c._fallPeak || 0;
  const fallDist = (c._fallStartY !== undefined) ? c.y - c._fallStartY : 0;
  c._fallPeak = 0;
  // v0.20 "Falling": a canopy-to-floor fall strands — even a soft one. The
  // stranding is about where the fall delivered the creature, not how hard
  // it landed. The chronicle notes the delivery; the world's existing costs
  // do the rest: climbing back up bills energy, homesickness drains comfort
  // far from home, bonds decay with separation, and arctic floors have bears.
  if (fallDist > STRAND_PX) {
    world.events.push({
      type: 'strandedFall', creature: c,
      fallPx: Math.round(fallDist), zone: zoneAt(c.x).key, t: world.time,
    });
  }
  impact = impact * (1 - (c.pheno.fallSoak || 0));
  if (impact <= FALL_HURT_V) {
    if (wasGliding) c.reward += 0.05; // the touchdown after a real glide
    return;
  }
  const b = c.biochem;
  const excess = impact - FALL_HURT_V;
  b.injury = clamp01(b.injury + excess * FALL_DMG);
  // The landing startles — more when the fall itself was frightening.
  // A hop that lands hard is a surprise; a long screaming fall that lands
  // hard is the thing the fear was about.
  b.adrenaline = clamp01(b.adrenaline + 0.35 * (0.5 + fallPeak));
  c.flinchT = 0.45;
  c.reward -= 0.25;
  applyStimulus(c, 'hardLanding'); // v2 (S): the fall's evolvable valence
  world.events.push({ type: 'hardLanding', creature: c, impact: Math.round(impact), t: world.time });
}

function moveToward(c, world, targetX, dt, mult = 1) {
  const dx = targetX - c.x;
  if (Math.abs(dx) < 4) return true; // arrived
  moveAlong(c, world, Math.sign(dx), dt, mult, 'fall'); // directed feet can walk off
  return false;
}

// Courtship navigation: step toward a target platform via climb links.
// Picks the link whose destination is nearest the target's height, walks to
// the overlap, and climbs through. Returns true when on (or just arrived
// on) the target platform. Lets courtship cross branches — without it, mates
// sensed on other platforms could never be reached.
function stepTowardPlatform(c, world, targetPi, dt) {
  if (c.platformIndex === targetPi) return true;
  const links = climbLinksFrom(world, c.platformIndex);
  if (links.length === 0) return false;
  const targetY = world.platforms[targetPi].y;
  let best = links[0], bd = Infinity;
  for (const l of links) {
    const dy = Math.abs(world.platforms[l.to].y - targetY);
    if (dy < bd) { bd = dy; best = l; }
  }
  const cx = Math.max(best.link.x1, Math.min(best.link.x2, c.x));
  if (Math.abs(cx - c.x) > 12) {
    const step = Math.sign(cx - c.x) * (c.pheno.climbSpeed || 0.5) * 60 * dt;
    c.x += Math.abs(step) > Math.abs(cx - c.x) ? cx - c.x : step;
    return false;
  }
  // Through the gap — arrive on the new branch.
  c.platformIndex = best.to;
  c.y = world.platforms[best.to].y;
  c.vy = 0; c.vx = 0; c.grounded = true;
  return c.platformIndex === targetPi;
}

function doEat(c, world) {
  const s = c._senses;
  const food = s._food && Math.abs(s._food.x - c.x) < EAT_RANGE ? s._food : null;
  if (!food) return false;
  // v0.18 "Realms": explicit diet branches. Meat kinds (meat, bug, minnow,
  // corpse, grub, morsel) burn through meatEfficiency — small prey and
  // corpses have fixed nutrition overrides. Plant kinds (fruit, tuber,
  // kelp, moss, …) burn through fruitEfficiency. Leaves are medicine,
  // scraps desperation — both keep their existing logic. A truly unknown
  // kind is skipped (return false), never crashed on.
  const kind = food.foodKind;
  const isMeat = MEAT_KINDS.has(kind);
  const isPlant = PLANT_KINDS.has(kind);
  if (kind !== 'leaf' && kind !== 'scrap' && !isMeat && !isPlant) return false;
  // v0.6 morphology: bite size from mouthSize gene; diet efficiencies.
  // v0.7: meat efficiency — carcasses feed carnivores at full value.
  const bite = Math.min(food.amount, c.pheno.biteSize);
  food.amount -= bite;
  // v0.14: the waste cycle — part of every bite passes through the gut.
  // Nutrition feeds blood sugar; the rest is excreted into the soil.
  c.gut = (c.gut || 0) + bite * WASTE_FRACTION;
  // v0.14.1: messy eaters — a fraction of every bite falls as scraps.
  // Poor food for the desperate, compost for the soil if ignored.
  const scrapAmt = bite * SCRAP_FRACTION;
  if (scrapAmt > 0.005 && world.foods.length < 90) {
    addFood(world, c.x + world.rng.range(-8, 8), c.platformIndex, 'scrap', scrapAmt, SCRAP_ROT, { nutrition: SCRAP_NUTRITION });
  }
  // v0.8: medicinal leaves. Bitter and barely nutritious, but they purge
  // illness — self-medication. The illness reward term (below) makes recovery
  // reinforcing, so the brain learns: sick → seek leaf → feel better.
  if (kind === 'leaf') {
    const wasSick = c.biochem.illness > 0.25;
    c.biochem.illness = Math.max(0, c.biochem.illness - 0.4);
    // Bitter medicine: barely nutritious (small ate), powerfully purging.
    c._ate = (c._ate || 0) + bite * 0.3 * c.pheno.fruitEfficiency;
    c.actionLabel = 'chewing bitter leaf';
    // Bitter when well, medicine when sick — the differential that teaches
    // self-medication. A healthy creature finds leaves meh; a sick one that
    // chews a leaf feels better, and the brain (which senses illness) learns
    // the conditional.
    c.reward += wasSick ? 0.6 : 0.15;
  } else if (isMeat) {
    // Meat: small prey (bug/minnow/grub/morsel) are fixed small mouthfuls;
    // corpse is rotten but substantial; meat uses the food's own nutrition.
    let nut = food.nutrition || 1;
    if (kind === 'bug' || kind === 'minnow' || kind === 'grub' || kind === 'morsel') nut = PREY_NUTRITION;
    else if (kind === 'corpse') nut = CORPSE_NUTRITION;
    c._ate = (c._ate || 0) + bite * 1.1 * c.pheno.meatEfficiency * nut;
    c.actionLabel = `eating ${kind}`;
    c.reward += 0.6;
  } else {
    // Food becomes blood sugar via the chemistry tick (c._ate is consumed
    // by tickBiochem before the next action) — the body, not the action,
    // decides what a meal means.
    // v0.13: bitterness from the plant genome — bitter fruit is less
    // rewarding, so the brain learns to avoid bitter plants. The differential
    // (not a hardcoded rule) is what teaches foraging discrimination.
    const eff = c.pheno.fruitEfficiency;
    const bitter = food.bitterness || 0;
    const palatability = 1 - 0.5 * bitter;
    const nutrition = (food.nutrition || 1) * palatability;
    c._ate = (c._ate || 0) + bite * 1.1 * eff * nutrition;
    // v0.14.1: scraps are desperation food — eaten, but joylessly.
    const isScrap = kind === 'scrap';
    c.actionLabel = isScrap ? 'picking at scraps' : `eating ${kind === 'fruit' ? 'fruit' : kind}`;
    c.reward += (isScrap ? 0.25 : 0.6) * palatability; // bitter meals reinforce less
    // v0.13: seed dispersal — the eaten fruit's plant may ride along.
    disperseSeed(world, c, food);
  }
  // v0.14: disgust's honest cost — food eaten on fouled ground carries
  // contamination into the body. wasteOdor is the information; this is the
  // consequence that makes the instinct evolve under real selection.
  // (Medicinal leaves still purge more than they contaminate — the
  // self-medication differential survives.)
  const odor = wasteOdorOf(world, c.x);
  if (odor > 0) {
    c.biochem.illness = clamp01(c.biochem.illness + bite * odor * CONTAM_ILLNESS);
  }
  if (food.amount <= 0.01) {
    const i = world.foods.indexOf(food);
    if (i >= 0) world.foods.splice(i, 1);
  }
  // v0.7 invention: log the meal; clustered success founds a grove tradition.
  c.mealLog.push({ x: c.x, t: world.time });
  while (c.mealLog.length > 8) c.mealLog.shift();
  // v0.8 exam telemetry: opt-in meal hook. The exam harness sets world.onMeal
  // to record who ate what where; unset in normal play (zero cost, no spam).
  if (world.onMeal) world.onMeal(c, bite * eff);
  maybeFoundGrove(c, world);
  return true;
}

// Invention: GROVE_MEALS recent meals clustered in space and time, and no
// existing grove nearby — this creature just discovered a good spot, and
// discovers it *as* a named tradition. Curious explorers invent more.
function maybeFoundGrove(c, world) {
  const now = world.time;
  const recent = c.mealLog.filter((m) => now - m.t < GROVE_WINDOW);
  if (recent.length < GROVE_MEALS) return null;
  let cx = 0;
  for (const m of recent) cx += m.x;
  cx /= recent.length;
  for (const m of recent) {
    if (Math.abs(m.x - cx) > GROVE_RADIUS) return null;
  }
  const cu = world.culture;
  for (const t of cu.traditions) {
    if (t.kind === 'grove' && Math.abs(t.x - cx) < GROVE_NEARBY) return null;
  }
  if (!world.rng.chance(0.04 + 0.16 * c.pheno.curiosity)) return null;
  const t = foundGrove(cu, c, cx, GROVE_RADIUS, now, c.generation, world.rng);
  if (t) world.events.push({ type: 'traditionFounded', name: t.name, creature: c, t: now });
  return t;
}

// v0.20 "Hands": nearest other creature within arm reach — the strike's
