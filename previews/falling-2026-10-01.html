// ---- v0.18 §5: per-biome flora ----

function biasPlantGenomeFor(genome, flora) {
  const pairs = [
    ['heatTol', flora.heatTolBias],
    ['coldTol', flora.coldTolBias],
    ['saltTol', flora.saltTolBias],
  ];
  for (const [locus, bias] of pairs) {
    const al = genome.alleles[locus];
    if (!al || !bias) continue;
    for (let i = 0; i < 2; i++) al[i] = Math.max(0, Math.min(1, al[i] + bias));
  }
}

function plantBiomeFlora(world, x, platformIndex, biomeKey, herb = false) {
  const flora = floraFor(biomeKey);
  const g = randomPlantGenome(world.decorRng || world.rng);
  biasPlantGenomeFor(g, flora);
  const opts = herb ? { morph: 'herb' } : { morph: flora.morph, fruitKind: flora.fruitKind };
  if (herb) addHerb(world, x, platformIndex, g, opts);
  else addPlant(world, x, platformIndex, g, opts);
}

function spawnBiomeFlora(world) {
  const dr = world.decorRng || world.rng;
  const tree = (biome, x0, x1, pi, n, herb = false) => {
    for (let i = 0; i < n; i++) plantBiomeFlora(world, dr.range(x0, x1), pi, biome, herb);
  };
  // Emerald Jungle: dense fruit trees on the branches + floor herbs (the ancestral economy)
  tree('jungle', 1230, 1390, 1, 2); tree('jungle', 1390, 1560, 2, 2); tree('jungle', 1560, 1770, 3, 2);
  tree('jungle', 1290, 1450, 4, 2); tree('jungle', 1460, 1630, 5, 1); tree('jungle', 1630, 1780, 6, 1);
  tree('jungle', 1330, 1510, 7, 1); tree('jungle', 1520, 1680, 8, 1);
  tree('jungle', 1250, 1750, 0, 3, true); // medicinal herbs on the floor
  // Arctic Wastes: sparse ice-moss
  tree('arctic', 50, 550, 9, 6);
  // Skyreach Mountains: alpine shrubs — coldTol selects; the prize altitude taxes
  tree('mountains', 610, 750, 17, 1); tree('mountains', 730, 870, 19, 1);
  tree('mountains', 850, 990, 21, 1); tree('mountains', 970, 1110, 23, 1);
  tree('mountains', 620, 740, 15, 2, true); // foothill herbs
  // Whispering Plains: grasses — ALL food on the ground, no branches
  tree('plains', 1850, 2350, 24, 12);
  // Sunscorch Desert: sparse cacti + one oasis herb
  tree('desert', 2450, 2950, 26, 5);
  tree('desert', 2690, 2750, 26, 1, true);
  // Mangrove Shallows: mangroves over water
  tree('shallows', 3030, 3190, 31, 1); tree('shallows', 3230, 3390, 32, 1);
  tree('shallows', 3430, 3570, 33, 1); tree('shallows', 3060, 3210, 34, 1);
  tree('shallows', 3290, 3430, 35, 2);
  // The Archipelago: palms on the islands + island herbs
  tree('archipelago', 3610, 3710, 36, 2); tree('archipelago', 3750, 3850, 38, 2);
  tree('archipelago', 4070, 4170, 40, 1);
  tree('archipelago', 3630, 3690, 37, 1); tree('archipelago', 3770, 3830, 39, 1);
  tree('archipelago', 3610, 3710, 36, 1, true); tree('archipelago', 3750, 3850, 38, 1, true);
  // Azure Deep: floating kelp — platformIndex -1, the floating convention
  for (let i = 0; i < 7; i++) plantBiomeFlora(world, dr.range(4250, 4750), -1, 'deep');
}

// ---- v0.18 §12/§12.1/§13.7: genesis spawns ----

// §13.7: sub-stream pinning. RETIRED as the live path — genome.js now takes
// {pinSub} natively (the v0.17 confound fix), and populateGenesis uses it.
// Kept exported for its unit test and as documentation of the draw order:
// language loci from one stream, evo-devo from another, same GENES order
// per stream as genome.js passes 2–3.
function pinSubStreams(genome, pin) {
  const p = pin | 0;
  const lexRng = createRng((p ^ 0x1e154d) >>> 0);
  const evoRng = createRng((p ^ 0x3a11ce) >>> 0);
  for (const gene of GENES) {
    const isLex = gene.key.startsWith('lex');
    const isEvo = EVO17_KEYS.has(gene.key);
    if (!isLex && !isEvo) continue;
    const r = isLex ? lexRng : evoRng;
    genome.alleles[gene.key] = [randomAllele(gene, r), randomAllele(gene, r)];
  }
  return genome;
}

// Standing variation (§12.1): shift both alleles partway toward the target:
// a' = a + (target − a) × 0.5. NO organ/bud changes; instincts stay at
// founder values. Loci absent from this genome build are skipped, never
// invented — the shift list below documents which targets have no locus.
function shiftAlleles(genome, key, target) {
  const al = genome.alleles[key];
  if (!al) return false;
  for (let i = 0; i < 2; i++) al[i] = Math.max(0, Math.min(1, al[i] + (target - al[i]) * 0.5));
  return true;
}

const GENESIS_COHORTS = [
  // biome, spawn x, platform, biome-suited quantitative shifts (§12.1).
  // The loci all exist (genome.js family-M thermal block + armLength);
  // shiftAlleles still skips any locus that doesn't, so this table is
  // forward-compatible with genome changes.
  { biome: 0, key: 'arctic', x: 300, pi: 9, shifts: [['fur', 1], ['coldTol', 1]] },
  { biome: 1, key: 'mountains', x: 680, pi: 17, shifts: [['armLength', 1], ['coldTol', 0.8]] },
  { biome: 2, key: 'jungle', x: 1400, pi: 1, shifts: [] }, // the control — always plain founder stock
  { biome: 3, key: 'plains', x: 2100, pi: 24, shifts: [['legLength', 0.8]] },
  { biome: 4, key: 'desert', x: 2700, pi: 26, shifts: [['fur', 0.2], ['heatTol', 1]] },
  { biome: 5, key: 'shallows', x: 3300, pi: 31, shifts: [['coldTol', 0.7]] },
  { biome: 6, key: 'archipelago', x: 3660, pi: 36, shifts: [['armLength', 0.8]] },
  { biome: 7, key: 'deep', x: 4325, pi: 42, shifts: [['coldTol', 0.8]] },
];

function populateGenesis(world) {
  const rng = world.rng;
  const seed = world.seed === undefined ? 1 : world.seed;
  // Worldgen west → east in fixed order; cosmetics from decorRng so the
  // main stream's draw sequence stays clean.
  spawnBiomeFlora(world);
  spawnBuriedFood(world);
  spawnMobileFood(world);
  spawnResources(world);
  // v0.18 §13.6: the decided predator roster (arctic bears, deep sharks) —
  // drawn visibly and clickable per the v0.17-dev phantom-killer lesson.
  // Legacy populate() does NOT call this: the jungle battery stays predator-free.
  spawnPredators(world);
  const founders = [];
  GENESIS_COHORTS.forEach((g, bi) => {
    const n = 3 + rng.int(0, 2); // 3–5 creatures per biome (§12)
    const plat = world.platforms[g.pi];
    // Sexes: at least one male and one female per cohort, the rest a coin flip.
    const sexes = [];
    for (let i = 0; i < n; i++) sexes.push(rng.chance(0.5) ? 'male' : 'female');
    if (!sexes.includes('male')) sexes[rng.int(0, n - 1)] = 'male';
    if (!sexes.includes('female')) sexes[rng.int(0, n - 1)] = 'female';
    for (let i = 0; i < n; i++) {
      // §13.7: pin sub-streams per founder via genome.js's native pinSub —
      // same (seed, biome, index) ⇒ same language/evo-devo/realms alleles,
      // independent of founder content (the v0.17 confound fix). The pin is
      // per-founder, not per-biome, so a cohort keeps its sub-stream
      // diversity ("starting variation, never destiny"); the 50% §12.1
      // shifts apply on top.
      const genome = randomGenome(rng, { pinSub: (seed * 31 + bi * 101 + i * 17) | 0 });
      // §12.1: ~50% of each non-control cohort gets biome-suited shifts.
      // Jungle is the control: 100% plain founder stock.
      if (g.biome !== 2 && rng.chance(0.5)) {
        for (const [key, target] of g.shifts) shiftAlleles(genome, key, target);
      }
      const x = Math.max(plat.x1 + 20, Math.min(plat.x2 - 20, g.x + (i - (n - 1) / 2) * 130));
      const c = createCreature(genome, x, g.pi, rng, { name: `${g.key}-${i + 1}` });
      c.name = uniqueName(world, c.name);
      c.sex = sexes[i];
      c.biochem.age = c.pheno.lifespanSec * 0.4; // young adults — breedable from the first minute
      recordLineage(world, c);
      world.seenGenomes.add(genomeHash(c.genome));
      founders.push(c);
    }
  });
  world.creatures.push(...founders);
  // Starter fruit near each founder — the first meal bootstraps foraging.
  for (const c of founders) {
    const plat = world.platforms[c.platformIndex];
    const fx = Math.max(plat.x1 + 20, Math.min(plat.x2 - 20, c.x + rng.range(-60, 60)));
    addFood(world, fx, c.platformIndex, 'fruit', 1);
  }
  recordFounderMeans(world); // the divergence baseline across all cohorts
  return world;
}


// ---- src/sim/observer.js ----
// Observer interactivity for Canopy v0.17.1 "Touch".
//
// Two doors, one module:
//   (1) INSPECT — describeEntity(world, obj) returns honest, engine-modeled
//       facts about any clickable entity (plant, herb, fruit, creature,
//       mineral, pebble, toy, egg). It never invents a stat: every row
//       traces to a field the simulation actually ticks.
//   (2) TOUCH — observer verbs: pickFruit, placeFood, spawnFood,
//       nudgeCreature, digMineral.
//
// Paul's v0.5 rule ("every new action needs an instinct gene") does NOT
// apply here, deliberately: these are OBSERVER verbs, not creature actions.
// No tanglekin can trigger them, no genome encodes them, and they never
// enter the brain's action set. The observer is outside the evolutionary
// loop — a hand reaching into the terrarium, not a gene.
//
// The verbs respect the world's own laws: picked fruit becomes a real food
// item again when placed (creatures eat it through the normal doEat path);
// a nudge is a velocity impulse through the physics integrator (never a
// teleport); digging depletes a real deposit amount. No godmode state
// edits that bypass the sim's rules.
//
// Minerals are new in v0.17.1. The v0.17 world has no minerals; they arrive
// here as static deposits because Joshua asked to touch "everything".
// The deposit primitives (MINERAL_TYPES, addMineral) live in world.js next
// to addPebble — this module only digs and describes.
// CREATURES CANNOT USE MINERALS YET — tool use is the future technology
// release's job (see EVODEVO_DESIGN.md §9.5 "Future: technology"). For now
// minerals are observer-only: inspectable, collectable as samples, and
// otherwise inert. The deposit is real state (it depletes), not decoration.


const OBSERVER_VERSION = 'v0.17.1 "Touch"';

// A nudge is a shove, not a relocation: 160 px/s is a firm push by
// tanglekin standards (walk speed is ~40-90 px/s) but it decays through
// friction and gravity like any other velocity.
const NUDGE_V = 160;
const NUDGE_HOP = 140; // px/s upward — the startled hop

// --- Inspector --------------------------------------------------------------
// describeEntity returns { title, subtitle, rows, bars, note }.
// rows: [[label, value]] — plain facts. bars: [{label, value (0..1),
// color}] — metered facts. note: an honest caveat string or null.
// Everything shown must exist on the object or be computable from the
// engine's own fields. When the engine doesn't model something, the
// panel says so instead of inventing it.

function pct(v) {
  return Math.round(Math.max(0, Math.min(1, v)) * 100) + '%';
}

function shortHash(s) {
  return String(s).slice(0, 12);
}

function describeEntity(world, obj) {
  if (!obj) return null;
  switch (obj.kind) {
    case 'plant':
    case 'herb': {
      const herb = obj.kind === 'herb';
      const ph = obj.pheno || {};
      const stage = obj.growth >= 1 ? 'mature' : obj.growth >= 0.5 ? 'growing' : 'seedling';
      const rows = [
        ['Kind', herb ? '🌿 Medicinal herb' : '🌳 Fruit tree'],
        ['Growth stage', `${stage} (${pct(obj.growth)})`],
        ['Zone', observerZoneName(world, obj.x)],
      ];
      const bars = [];
      if (herb) {
        rows.push(['Medicine', `bitter leaves purge illness (potency ${pct(ph.potency ?? 0.5)})`]);
        bars.push({ label: '🌡️ Potency', value: ph.potency ?? 0.5, color: '#9a6ee8' });
        bars.push({ label: '😖 Bitterness', value: ph.bitterness ?? 0.3, color: '#6b5b3e' });
      } else {
        rows.push(['Yield', `${1 + Math.round(2 * (ph.yield ?? 0.5))} fruit per fruiting`]);
        rows.push(['Nutrition per fruit', (0.5 + (ph.fruitSize ?? 0.5)).toFixed(2)]);
        bars.push({ label: '😖 Bitterness', value: ph.bitterness ?? 0.3, color: '#6b5b3e' });
        bars.push({ label: '💧 Drought tolerance', value: ph.waterRet ?? 0.5, color: '#5aa3d0' });
        bars.push({ label: '❄️ Cold tolerance', value: ph.coldTol ?? 0.5, color: '#9fc3e8' });
      }
      if (obj.growth >= 1) {
        rows.push(['Next fruiting in', `~${Math.max(0, obj.fruitTimer).toFixed(0)}s`]);
      } else {
        rows.push(['Fruiting', 'not until mature']);
      }
      if (obj.genome) rows.push(['Genome', shortHash(plantHash(obj.genome)) + '…']);
      return {
        title: herb ? 'Medicinal herb' : 'Fruit tree',
        subtitle: `plant #${obj.id}`,
        rows, bars,
        note: 'Fruit count shown is per fruiting cycle from the plant genome — hanging fruit are separate items; click one.',
      };
    }
    case 'food': {
      const kindLabel = { fruit: '🍎 Fruit', leaf: '🌿 Medicinal leaf', meat: '🍖 Meat', scrap: '🍂 Scrap', bug: '🪲 Bug', minnow: '🐟 Minnow', corpse: '💀 Corpse' }[obj.foodKind] || obj.foodKind;
      const rows = [
        ['Kind', kindLabel],
        ['Nutrition', Number(obj.nutrition ?? 1).toFixed(2)],
        ['Amount', Number(obj.amount ?? 1).toFixed(2)],
        ['Bitterness', pct(obj.bitterness ?? 0)],
        ['Zone', observerZoneName(world, obj.x)],
      ];
      if (obj.plantId) {
        const parent = (world.plants || []).find((p) => p.id === obj.plantId);
        rows.push(['Borne by', parent ? `plant #${parent.id}` : `plant #${obj.plantId} (gone)`]);
      } else {
        rows.push(['Borne by', 'placed by the observer — no parent plant']);
      }
      if (obj.rotsAt > 0) rows.push(['Rots in', `~${Math.max(0, obj.rotsAt - world.time).toFixed(0)}s`]);
      const note = obj.foodKind === 'leaf'
        ? 'Bitter and barely nutritious — but purges illness. Sick tanglekins self-medicate with these.'
        : obj.foodKind === 'meat' ? 'A carcass. Carnivore-leaning tanglekins eat these at full value.'
        : null;
      return { title: kindLabel, subtitle: `food #${obj.id}`, rows, bars: [], note };
    }
    case 'creature': {
      const c = obj;
      const b = c.biochem;
      const rows = [
        ['Name', `${c.name} (#${c.id})`],
        ['Sex', c.sex],
        ['Stage', stageLabel(c)],
        ['Zone', observerZoneName(world, c.x)],
        ['Doing', c.actionLabel || c.action],
      ];
      if (c.speciesId) rows.push(['Species', `#${c.speciesId}`]);
      rows.push(['Genome highlights',
        `size ${pct(c.pheno.size)} · legs ${pct(c.pheno.legLength)} · immunity ${pct(c.pheno.immunity)} · boldness ${pct(c.pheno.boldness)}`]);
      const bars = [
        { label: '🍽️ Satiation', value: 1 - b.hunger, color: '#e8a13c' },
        { label: '⚡ Energy', value: b.energy, color: '#7ccf5f' },
        { label: '🏥 Health', value: b.health, color: '#e85c5c' },
      ];
      if (b.illness > 0.05) bars.push({ label: '🤒 Illness', value: b.illness, color: '#9db33c' });
      return {
        title: c.name, subtitle: `tanglekin #${c.id}`,
        rows, bars,
        note: 'Genome highlights are phenotype values (0..1) the engine actually expresses — leg length moves jump physics, immunity gates illness.',
      };
    }
    case 'mineral': {
      const rows = [
        ['Type', `⛏️ ${obj.mineralName}`],
        ['Samples left', obj.amount > 0 ? String(obj.amount) : 'depleted'],
        ['Zone', observerZoneName(world, obj.x)],
        [null, obj.blurb],
      ];
      return {
        title: obj.mineralName, subtitle: `mineral deposit #${obj.id}`,
        rows,
        bars: [{ label: '🪨 Hardness', value: obj.hardness, color: '#8d8b96' }],
        note: 'Tanglekins cannot use minerals yet — tool use belongs to the future technology release. For now they are observer-only: inspect and collect samples.',
      };
    }
    case 'pebble': {
      return {
        title: 'Pebble', subtitle: `stone #${obj.id}`,
        rows: [['Kind', '🪨 Pushable stone'], ['Radius', `${obj.r.toFixed(0)}px`], ['Zone', observerZoneName(world, obj.x)]],
        bars: [],
        note: 'The world as material: creatures shove pebbles by collision; heavy stones resist. Not decoration.',
      };
    }
    case 'stick': {
      return {
        title: 'Stick', subtitle: `fallen branch #${obj.id}`,
        rows: [['Kind', '🪵 Graspable timber'], ['Weight', Number(obj.weight ?? 0.7).toFixed(2)], ['Hardness', Number(obj.hardness ?? 0.4).toFixed(2)], ['Zone', observerZoneName(world, obj.x)]],
        bars: [],
        note: 'A tanglekin with graspPairs ≥ 1 can pick this up (grasp), wield it (carry), and drop it. Timber is light but soft — a poor hammer, an honest start.',
      };
    }
    case 'toy': {
      return {
        title: obj.kind === 'beacon' ? 'Exam beacon' : 'Ball',
        subtitle: `toy #${obj.id}`,
        rows: [['Kind', obj.kind === 'beacon' ? '📡 cue marker (exam mode)' : '⚽ plaything'], ['Zone', observerZoneName(world, obj.x)]],
        bars: [], note: null,
      };
    }
    case 'egg': {
      return {
        title: 'Egg', subtitle: `egg #${obj.id}`,
        rows: [
          ['Hatches in', `~${Math.max(0, obj.timer).toFixed(0)}s`],
          ['Parents', obj.parents ? `#${obj.parents[0]} × #${obj.parents[1]}` : 'wild'],
        ],
        bars: [], note: null,
      };
    }
    case 'shark':
    case 'bear': {
      // v0.18 "Realms": the danger panel — every agent of selection is
      // visible. Kind, damage, and the physiological range that confines
      // it (§13.6): the shark is bounded by water depth, the bear by heat.
      const shark = obj.kind === 'shark';
      const dmg = typeof obj.damage === 'number' ? obj.damage : null;
      const rows = [
        ['Kind', shark ? '🦈 Shark' : '🐻 Bear'],
        ['Damage', dmg !== null ? dmg.toFixed(2) : 'not modeled by the sim'],
        ['Range limit', shark
          ? 'needs ≥90px water depth — suffocates in the shallows'
          : 'overheats above ambient heat ~0.35 — confined by heat, not by walls'],
        ['Zone', observerZoneName(world, obj.x)],
      ];
      if (obj.hunting || obj.target) rows.push(['State', '🔴 hunting']);
      const bars = dmg !== null
        ? [{ label: '☠️ Threat', value: Math.max(0, Math.min(1, dmg)), color: '#c0392b' }]
        : [];
      return {
        title: shark ? 'Shark' : 'Bear',
        subtitle: `predator #${obj.id}`,
        rows, bars,
        note: 'A real agent of selection, not scenery — it kills tanglekins. Watch it hunt.',
      };
    }
    default:
      return null;
  }
}

function observerZoneName(world, x) {
  return zoneAt(x).name;
}

function stageLabel(c) {
  // ageStage lives in biochem.js; the UI already computes stages for its
  // own panel. Here we do the cheap honest thing: read what the engine
  // stamped on the creature if present, else report by age fraction.
  if (c._stageLabel) return c._stageLabel;
  const b = c.biochem, p = c.pheno;
  const t = b.age / (p.lifespanSec || 1);
  if (t < 0.25) return 'juvenile';
  if (t < 0.8) return 'adult';
  return 'elder';
}

function plantHash(genome) {
  const parts = [];
  for (const key of Object.keys(genome.alleles || {}).sort()) {
    const [a, b] = genome.alleles[key];
    parts.push(a.toFixed(3) + '/' + b.toFixed(3));
  }
  return parts.join('|');
}

// --- Observer verbs ---------------------------------------------------------

// Pick up a food item: it leaves the world's foods array and comes back as
// a plain snapshot the observer's hand can carry. Nothing about the item
// changes — placing it later re-enters it through addFood, so creatures
// meet it through the exact same path as tree-borne fruit.
function pickFruit(world, food) {
  const i = world.foods.indexOf(food);
  if (i < 0) return null;
  world.foods.splice(i, 1);
  return {
    foodKind: food.foodKind, nutrition: food.nutrition,
    bitterness: food.bitterness, amount: food.amount,
  };
}

// Place a held item back into the world at a real location. The item is a
// genuine food entity afterwards — doEat finds it, seed dispersal can read
// its plantId (0 = observer-placed, honestly parentless).
function placeFood(world, x, platformIndex, held) {
  if (!held) return null;
  const plat = world.platforms[platformIndex];
  if (!plat) return null;
  x = Math.max(plat.x1 + 10, Math.min(plat.x2 - 10, x));
  addFood(world, x, platformIndex, held.foodKind || 'fruit', held.amount || 1, 0, {
    plantId: 0, bitterness: held.bitterness || 0, nutrition: held.nutrition ?? 1,
  });
  return world.foods[world.foods.length - 1];
}

// Provision fresh food out of the observer's hand — a whole fruit, the way
// the starter fruit is provisioned at worldgen (addFood defaults).
function spawnFood(world, x, platformIndex, foodKind = 'fruit') {
  const plat = world.platforms[platformIndex];
  if (!plat) return null;
  x = Math.max(plat.x1 + 10, Math.min(plat.x2 - 10, x));
  addFood(world, x, platformIndex, foodKind, 1, 0, { plantId: 0, bitterness: 0, nutrition: 1 });
  return world.foods[world.foods.length - 1];
}

// A gentle shove: velocity impulse in the facing direction plus a small
// startled hop if grounded. Position is untouched — the physics integrator
// does the moving from here, through friction, gravity, and landings.
// This is a force, not a teleport.
function nudgeCreature(world, c, dir = 0) {
  if (!c || !c.alive) return false;
  const d = dir === 0 ? (c.facing || 1) : Math.sign(dir);
  c.vx += d * NUDGE_V;
  c.facing = d;
  if (c.grounded) {
    c.vy = -NUDGE_HOP;
    c.grounded = false;
  }
  world.events.push({ type: 'nudge', creature: c, t: world.time });
  return true;
}

// Collect one sample from a mineral deposit. The deposit is real state —
// it depletes, and depleted deposits stay inspectable (labeled as such)
// rather than silently vanishing.
function digMineral(world, m) {
  if (!m || m.amount <= 0) return null;
  m.amount -= 1;
  const sample = { mineralKey: m.mineralKey, mineralName: m.mineralName, color: m.color };
  world.events.push({ type: 'digMineral', mineral: m, t: world.time });
  return sample;
}


// ---- src/sim/teacher.js ----
// The Teacher — Sunny's in-sim avatar (v0.14 "Voices", fourth addition).
//
// A distinct visitor, NOT a tanglekin: a blue monkey in a jaunty newsboy
// cap who enters the Canopy to teach. Per the guest-rites spirit: no
// godmode over the world itself (it cannot edit genomes, spawn food, or
// move creatures), but not a mortal of it either — no hunger, no mating,
// no death, no biochemistry at all.
//
// What it CAN do (its whole repertoire):
//   - move: walk the platforms, hop between them, perch
//   - demo: emit sequences of calls with exact pitches — a motif, a lesson
//   - reward: grant reward to tanglekins whose voicePitch copies the motif
//
// The reward is the culture-bootstrapping mechanism: imitation already
// drifts voicePitch toward heard pitches (vocalImitate); the teacher adds
// a selective reward on TOP, so good imitators learn faster and the
// dialect crystallizes around the motif. Teaching events are logged to
// world.teachLog — cultural inflection points for the evolution tracker.
//
// Two control modes:
//   POSSESSED   — driven by Sunny (the HUD): a command queue
//                 (moveTo / demo / reward / rewardNearest). The autonomous
//                 policy is paused; the teacher only moves and acts on command.
//   AUTONOMOUS  — a simple teacher policy: travel between zones, perch,
//                 demo the motif where there are listeners, wait, reward
//                 the good imitators, rest, repeat.


// The lesson: a four-note motif at the teacher's signature pitch.
// Exact pitches — the teacher is a clear model, not a noisy one.
const TEACHER_MOTIF = [0.62, 0.7, 0.66, 0.56];
const TEACHER_PITCH = 0.62; // the signature — the dialect seed
const TEACHER_VOLUME = 0.9; // loud and clear
const TEACHER_EARSHOT = 200 + TEACHER_VOLUME * 400; // 560 — a whole branch hears
const IMITATION_WINDOW = 0.12; // |voicePitch − motif| inside this counts as copying
const REWARD_AMOUNT = 0.3; // the selective bonus for good imitators

function createTeacher(world, x = 800, platformIndex = 0) {
  return {
    kind: 'teacher',
    id: 'teacher', // never collides with creature numeric ids
    name: 'Sunny',
    x,
    y: null, // derived from the platform each frame
    platformIndex,
    // v0.17.2: the observer's hand. While dragged, movement pauses (the
    // hand holds the teacher) — the senses stay on; being held is feeling.
    dragged: false,
    facing: 1,
    vx: 0,
    hopPhase: 0,
    mode: 'autonomous',
    // Autonomous policy state.
    state: 'perch', // perch | travel | demo | listen | reward | rest
    stateT: 0,
    targetX: x,
    targetPlatform: platformIndex,
    // Demonstration state.
    demoQueue: [], // pitches left to emit
    demoTimer: 0,
    demoType: 'contact',
    demoPitch: TEACHER_PITCH, // the motif center of the current lesson
    lastDemoT: -1000,
    // Possessed command queue: { cmd, ... }.
    commands: [],
    actionLabel: 'perching',
    // v0.14 (senses): the felt body. taste/touch are event-set and decay;
    // comfort is the slow tactile memory that makes the teacher linger.
    senses: null, // refreshed every tick by gatherTeacherSenses
    taste: null, // { flavor, t } — set by teacherEat
    touchT: -1000, // last tactile contact (petted, dragged, groomed)
    comfort: 0, // 0..1 — warmth where it was petted; extends perching
  };
}

function setTeacherMode(world, teacher, mode) {
  if (mode !== 'possessed' && mode !== 'autonomous') return false;
  if (teacher.mode === mode) return true;
  teacher.mode = mode;
  teacher.commands.length = 0;
  if (mode === 'autonomous') { teacher.state = 'perch'; teacher.stateT = 0; }
  logTeach(world, { t: world.time, kind: 'mode', mode });
  return true;
}

// Possessed control: queue a simple command. Commands:
//   { cmd: 'moveTo', x, platformIndex }
//   { cmd: 'demo', pitches? }        — demonstrate the motif (or given pitches)
//   { cmd: 'reward' }                — reward imitators of the current motif
//   { cmd: 'rewardNearest' }         — reward the nearest creature outright
//   { cmd: 'eat' }                   — taste the nearest fruit in reach
function commandTeacher(teacher, cmd) {
  if (!cmd || typeof cmd.cmd !== 'string') return false;
  if (cmd.cmd === 'moveTo') {
    if (typeof cmd.x !== 'number' || typeof cmd.platformIndex !== 'number') return false;
  }
  if (cmd.cmd === 'demo' && cmd.pitches !== undefined) {
    if (!Array.isArray(cmd.pitches) || !cmd.pitches.every((p) => typeof p === 'number')) return false;
  }
  teacher.commands.push(cmd);
  return true;
}

function logTeach(world, ev) {
  world.teachLog.push(ev);
  if (world.teachLog.length > 200) world.teachLog.splice(0, world.teachLog.length - 200);
}

// The teacher's voice in the acoustic commons — same registry the
// tanglekins hear, so demonstrations are real calls, not UI fiction.
// Exact pitch: the lesson is clear.
function emitTeacherCall(world, teacher, type, pitch) {
  const zkey = zoneAt(teacher.x).key;
  const plat = world.platforms[teacher.platformIndex];
  const ty = plat ? plat.y : 0;
  // v0.16: the teacher's calls are full acoustic events — loud and clear
  // (loudness 0.95), deliberate length. The Rosetta stone must carry.
  const call = {
    t: world.time, type,
    pitch: Math.max(0.05, Math.min(1, pitch)),
    length: 0.4, loudness: 0.95,
    volume: TEACHER_VOLUME, earshot: TEACHER_EARSHOT,
    platformIndex: teacher.platformIndex, x: teacher.x, y: ty, zone: zkey,
    callerId: 'teacher', callerName: 'Sunny', fromTeacher: true,
    proto: null,
  };
  call.proto = { pitch: call.pitch, length: call.length, loudness: call.loudness };
  world.calls.push(call);
  let log = world.zoneCalls[zkey];
  if (!log) { log = []; world.zoneCalls[zkey] = log; }
  log.push({ t: world.time, pitch, type, fromTeacher: true });
  if (log.length > 300) log.splice(0, log.length - 300);
  pushUtterance(world, call);
}

// Begin a demonstration: a sequence of exact-pitch calls, one per 0.7s.
// type is the call's meaning — 'contact' (default), 'food' (after a good
// taste), 'danger' (on witnessing a death), 'come' (a summons). Together
// FOOD/DANGER/COME are the Rosetta stone of the emerging lexicon.
const DEMO_LABELS = {
  food: 'teaching: food 🍎',
  danger: 'teaching: danger ⚠️',
  come: 'calling: come here 📢',
  contact: 'demonstrating 🎵',
};
function teacherDemo(world, teacher, pitches = TEACHER_MOTIF, type = 'contact') {
  teacher.demoQueue = [...pitches];
  teacher.demoTimer = 0;
  teacher.demoType = type;
  teacher.demoPitch = pitches.length
    ? pitches.reduce((a, b) => a + b, 0) / pitches.length
    : TEACHER_PITCH;
  teacher.lastDemoT = world.time;
  teacher.actionLabel = DEMO_LABELS[type] || DEMO_LABELS.contact;
  logTeach(world, {
    t: world.time, kind: 'demo', type,
    pitches: [...pitches], zone: zoneAt(teacher.x).key,
    listeners: countListeners(world, teacher),
  });
}

function countListeners(world, teacher) {
  let n = 0;
  for (const c of world.creatures) {
    if (!c.alive || c.platformIndex !== teacher.platformIndex) continue;
    if (Math.abs(c.x - teacher.x) <= TEACHER_EARSHOT) n++;
  }
  return n;
}

// Reward the imitators: creatures on the teacher's platform, in earshot,
// whose LEARNED voicePitch sits inside the imitation window of the motif.
// This is selection for culture — copying pays.
function teacherReward(world, teacher, pitch = teacher.demoPitch) {
  let n = 0;
  for (const c of world.creatures) {
    if (!c.alive || c.platformIndex !== teacher.platformIndex) continue;
    if (Math.abs(c.x - teacher.x) > TEACHER_EARSHOT) continue;
    const d = Math.abs((c.voicePitch ?? 0.5) - pitch);
    if (d <= IMITATION_WINDOW) {
      c.reward += REWARD_AMOUNT * (1 - d / IMITATION_WINDOW);
      n++;
    }
  }
  if (n > 0) {
    logTeach(world, { t: world.time, kind: 'reward', pitch, n, zone: zoneAt(teacher.x).key });
  }
  return n;
}

// Possessed helper: reward the single nearest creature outright —
// the "good, that one" tap. Same platform, within 400px.
function teacherRewardNearest(world, teacher) {
  let best = null, bestD = 400;
  for (const c of world.creatures) {
    if (!c.alive || c.platformIndex !== teacher.platformIndex) continue;
    const d = Math.abs(c.x - teacher.x);
    if (d < bestD) { bestD = d; best = c; }
  }
  if (!best) return null;
  best.reward += 0.2;
  logTeach(world, { t: world.time, kind: 'rewardNearest', creature: best.id, zone: zoneAt(teacher.x).key });
  return best;
}

// --- Locomotion -----------------------------------------------------------
// The teacher walks its platform and swings between them — a visitor's
// privilege: it isn't bound by climb links, but it only ever moves itself.
// Travel runs in two phases: walk to the departure point (this branch's
// nearest point to the target), swing across, then walk to the target x.
const TEACHER_SPEED = 110; // px/s
// NOTE (v0.15 "Bloom"): this was plain `moveToward` until it collided with
// creature.js's `moveToward` in the dist bundle — scripts/build.js
// concatenates every module into ONE scope, so the later definition
// (teacher's) silently replaced the creature one and every creature's
// wander/eat/play/mate movement ran teacher logic with
// `c.targetX === undefined`, writing NaN into creature.x. Module scope
// hides the collision in src/ (tests stay green); the shipped bundle is
// where it bites. Keep this name unique across modules — build.js enforces
// it with a duplicate-declaration guard.
function moveTeacherToward(teacher, world, dt) {
  const plat = world.platforms[teacher.platformIndex];
  const tplat = world.platforms[teacher.targetPlatform];

  const walk = (destX) => {
    const dx = destX - teacher.x;
    if (Math.abs(dx) < 6) { teacher.vx = 0; return true; }
    const step = Math.sign(dx) * Math.min(Math.abs(dx), TEACHER_SPEED * dt);
    teacher.x += step;
    teacher.vx = Math.sign(dx) * TEACHER_SPEED;
    teacher.facing = dx >= 0 ? 1 : -1;
    teacher.hopPhase += dt * 9;
    teacher.x = Math.max(plat.x1 + 10, Math.min(plat.x2 - 10, teacher.x));
    return false;
  };

  if (teacher.platformIndex === teacher.targetPlatform) {
    return walk(teacher.targetX); // arrived ⟺ within 6px of the target
  }
  // Phase 1: reach the departure point, then swing to the target branch.
  const departX = Math.max(plat.x1 + 10, Math.min(plat.x2 - 10, teacher.targetX));
  if (walk(departX)) {
    teacher.platformIndex = teacher.targetPlatform;
    teacher.x = Math.max(tplat.x1 + 10, Math.min(tplat.x2 - 10, teacher.targetX));
    teacher.vx = 0;
  }
  return false;
}

function pickTravelTarget(world, teacher, rng) {
  // Prefer zones that have creatures — students, not empty branches.
  const withCreatures = new Set(world.creatures.filter((c) => c.alive).map((c) => zoneAt(c.x).key));
  let zone;
  for (let i = 0; i < 6; i++) {
    zone = rng.pick(ZONES);
    if (withCreatures.size === 0 || withCreatures.has(zone.key)) break;
  }
  const plats = world.platforms
    .map((p, i) => ({ p, i }))
    .filter(({ p }) => p.x2 > zone.x1 && p.x1 < zone.x2);
  const { p, i } = rng.pick(plats.length ? plats : world.platforms.map((p, i) => ({ p, i })));
  teacher.targetX = rng.range(p.x1 + 40, p.x2 - 40);
  teacher.targetPlatform = i;
}

// --- The tick ---------------------------------------------------------------
function tickTeacher(world, teacher, dt) {
  // The visitor's own stream — never the world's main sequence.
  const rng = world.teacherRng || world.rng;

  // The senses refresh every tick, in both modes — possession means feeling.
  teacher.senses = gatherTeacherSenses(world, teacher);
  // Comfort is slow tactile memory; it fades over a couple of minutes.
  teacher.comfort = Math.max(0, teacher.comfort - dt * 0.008);

  // Demonstrations emit on their own clock in either mode.
  if (teacher.demoQueue.length) {
    teacher.demoTimer -= dt;
    if (teacher.demoTimer <= 0) {
      const pitch = teacher.demoQueue.shift();
      emitTeacherCall(world, teacher, teacher.demoType || 'contact', pitch);
      teacher.demoTimer = 0.7;
      teacher.actionLabel = DEMO_LABELS[teacher.demoType] || DEMO_LABELS.contact;
    }
  }

  // v0.17.2: held by the observer's hand — the body waits, the senses stay on.
  if (teacher.dragged) { teacher.vx = 0; return; }

  if (teacher.mode === 'possessed') {
    // The hand of Sunny: commands only, no policy.
    const cmd = teacher.commands.shift();
    if (cmd) runCommand(world, teacher, cmd);
    // Drift toward any commanded destination; otherwise perch.
    if (teacher.platformIndex !== teacher.targetPlatform || Math.abs(teacher.targetX - teacher.x) > 6) {
      const arrived = moveTeacherToward(teacher, world, dt);
      if (!teacher.demoQueue.length) teacher.actionLabel = arrived ? 'perching' : 'traveling';
    } else if (!teacher.demoQueue.length) {
      teacher.vx = 0;
      teacher.actionLabel = 'perching';
    }
    return;
  }

  // AUTONOMOUS — the teacher policy.
  teacher.stateT += dt;
  switch (teacher.state) {
    case 'perch': {
      teacher.vx = 0;
      if (!teacher.demoQueue.length) teacher.actionLabel = 'perching';
      const listeners = countListeners(world, teacher);
      const s = teacher.senses;
      // The senses steer: a heard call gets answered — the students called,
      // the teacher answers. Ripe fruit on the wind is worth a visit.
      if (s.hearCall > 0.5 && world.time - teacher.lastDemoT > 30) {
        teacher.state = 'demo';
        teacherDemo(world, teacher);
        teacher.stateT = 0;
        break;
      }
      if (s.smellRipe && s.smellFruit > 0.55 && s.smellFruitX !== null &&
          world.time - teacher.lastDemoT > 60) {
        teacher.targetX = s.smellFruitX;
        teacher.targetPlatform = s.smellFruitPlat;
        teacher.state = 'travel';
        teacher.stateT = 0;
        logTeach(world, { t: world.time, kind: 'followSmell', zone: zoneAt(s.smellFruitX).key });
        break;
      }
      // Comfort makes the teacher linger where it was welcomed.
      if (teacher.stateT > rng.range(8, 20) * (1 + teacher.comfort * 1.5)) {
        if (listeners > 0 && world.time - teacher.lastDemoT > 30) {
          teacher.state = 'demo';
          teacherDemo(world, teacher);
        } else {
          pickTravelTarget(world, teacher, rng);
          teacher.state = 'travel';
        }
        teacher.stateT = 0;
      }
      break;
    }
    case 'travel': {
      teacher.actionLabel = 'traveling';
      if (moveTeacherToward(teacher, world, dt)) {
        logTeach(world, { t: world.time, kind: 'arrive', zone: zoneAt(teacher.x).key });
        teacher.state = countListeners(world, teacher) > 0 ? 'demo' : 'perch';
        if (teacher.state === 'demo') teacherDemo(world, teacher);
        teacher.stateT = 0;
      }
      break;
    }
    case 'demo': {
      // The demonstration plays out on the demo clock above; when the
      // queue drains, give the students a few seconds to imitate, then
      // reward the ones who copied.
      if (!teacher.demoQueue.length) {
        teacher.state = 'listen';
        teacher.stateT = 0;
        teacher.actionLabel = 'listening 👂';
      }
      break;
    }
    case 'listen': {
      teacher.vx = 0;
      if (teacher.stateT > 6) {
        teacher.state = 'reward';
        teacher.stateT = 0;
      }
      break;
    }
    case 'reward': {
      teacherReward(world, teacher);
      teacher.actionLabel = 'rewarding 🌟';
      teacher.state = 'rest';
      teacher.stateT = 0;
      break;
    }
    case 'rest': {
      teacher.vx = 0;
      if (!teacher.demoQueue.length) teacher.actionLabel = 'resting';
      if (teacher.stateT > rng.range(10, 25) * (1 + teacher.comfort)) {
        pickTravelTarget(world, teacher, rng);
        teacher.state = 'travel';
        teacher.stateT = 0;
      }
      break;
    }
    default: {
      teacher.state = 'perch';
      teacher.stateT = 0;
    }
  }
}

function runCommand(world, teacher, cmd) {
  switch (cmd.cmd) {
    case 'moveTo':
      teacher.targetX = Math.max(0, Math.min(world.width, cmd.x));
      teacher.targetPlatform = Math.max(0, Math.min(world.platforms.length - 1, cmd.platformIndex));
      logTeach(world, { t: world.time, kind: 'command', command: 'moveTo', zone: zoneAt(teacher.targetX).key });
      break;
    case 'demo':
      teacherDemo(world, teacher, cmd.pitches || TEACHER_MOTIF, cmd.type || 'contact');
      break;
    case 'reward':
      teacherReward(world, teacher, cmd.pitch);
      break;
    case 'rewardNearest': {
      const c = teacherRewardNearest(world, teacher);
      if (c) teacher.actionLabel = `rewarding ${c.name} 🌟`;
      break;
    }
    case 'eat': {
      const flavor = teacherEat(world, teacher);
      if (!flavor) teacher.actionLabel = 'no fruit in reach 👅';
      break;
    }
    default:
      break; // unknown commands are ignored, never crash the sim
  }
}

// ---------------------------------------------------------------------------
// The senses (v0.14, fifth addition). The teacher is possessed — Sunny must
// feel the world through it: sight, sound, smell, taste, touch.
//
// The senses skill's law holds here: a sensation is real because its
// consequences are real. The teacher has no biochem (a guest, not a
// mortal), so sensations bind to what a teacher HAS: its policy state,
// its travel targets, its demonstrations, its comfort, its log.
// Decorative adjectives with no consequence are cut.
//
// New teacher senses live in their own namespace — the tanglekin
// senseVector indices are never renumbered.

const SEE_RANGE = 520; // a clear view across a branch
const SMELL_RANGE = 420; // fruit on the wind
const EAT_REACH = 70;

function dirWord(dx) {
  if (dx > 25) return 'east';
  if (dx < -25) return 'west';
  return 'here';
}

function pitchWord(p) {
  if (p > 0.72) return 'high';
  if (p < 0.38) return 'low';
  return 'mid';
}

// The flavor is read off the fruit's own fields — bitterness, nutrition,
// rot — never invented.
function foodFlavor(food, world) {
  if ((food.bitterness || 0) > 0.45) return 'bitter';
  if (food.rotsAt > 0 && world.time > food.rotsAt - 20) return 'soft and overripe';
  if ((food.nutrition || 1) >= 1) return 'sweet';
  return 'tart';
}

// The full sensory field, refreshed every tick in both modes.
function gatherTeacherSenses(world, teacher) {
  const s = {
    seeCreatures: 0, seeNearest: null, // { dist, dir }
    seeFruit: 0, seeRipe: null, // { dist, dir } — ripe = low bitterness
    hearCall: 0, hearPitch: 0, hearType: null, hearDir: null, hearAlarm: false,
    smellFruit: 0, smellFruitDir: null, smellRipe: false, smellFruitX: null, smellFruitPlat: null,
    smellCreature: 0,
    taste: teacher.taste && world.time - teacher.taste.t < 12 ? teacher.taste.flavor : null,
    touch: Math.max(0, 1 - (world.time - teacher.touchT) / 8), // pet/drag/groom echo
    comfort: teacher.comfort,
    moving: Math.abs(teacher.vx) > 1,
    perched: Math.abs(teacher.vx) <= 1,
  };

  // Sight: who is on this branch, and is there fruit?
  let bestC = null, bestCD = Infinity;
  for (const c of world.creatures) {
    if (!c.alive || c.platformIndex !== teacher.platformIndex) continue;
    const d = Math.abs(c.x - teacher.x);
    if (d > SEE_RANGE) continue;
    s.seeCreatures++;
    if (d < bestCD) { bestCD = d; bestC = c; }
  }
  if (bestC) s.seeNearest = { dist: bestCD, dir: dirWord(bestC.x - teacher.x) };
  let bestR = null, bestRD = Infinity;
  for (const f of world.foods) {
    if (f.platformIndex !== teacher.platformIndex) continue;
    const d = Math.abs(f.x - teacher.x);
    if (d > SEE_RANGE) continue;
    s.seeFruit++;
    if ((f.bitterness || 0) <= 0.45 && d < bestRD) { bestRD = d; bestR = f; }
  }
  if (bestR) s.seeRipe = { dist: bestRD, dir: dirWord(bestR.x - teacher.x) };

  // Hearing: the acoustic commons, through the same ears as the tanglekins.
  // (callsHeardBy skips the teacher's own calls — it never hears itself.)
  const heard = callsHeardBy(world, teacher);
  s.hearCall = heard.heard;
  s.hearPitch = heard.pitch;
  s.hearAlarm = heard.alarm;
  if (heard.heard > 0) {
    // Find the call itself for its meaning and direction.
    let bc = null, bs = 0;
    for (const call of world.calls || []) {
      if (call.platformIndex !== teacher.platformIndex || call.callerId === teacher.id) continue;
      const d = Math.abs(call.x - teacher.x);
      if (d > call.earshot) continue;
      const score = call.volume * Math.max(0, 1 - (world.time - call.t) / 2);
      if (score > bs) { bs = score; bc = call; }
    }
    if (bc) {
      s.hearType = bc.type;
      s.hearDir = dirWord(bc.x - teacher.x);
    }
  }

  // Smell: fruit on the wind (stronger when ripe), tanglekin musk near.
  let sF = null, sFD = Infinity;
  for (const f of world.foods) {
    const d = Math.abs(f.x - teacher.x);
    if (d > SMELL_RANGE) continue;
    if (d < sFD) { sFD = d; sF = f; }
  }
  if (sF) {
    s.smellFruit = Math.max(0, 1 - sFD / SMELL_RANGE);
    s.smellFruitDir = dirWord(sF.x - teacher.x);
    s.smellRipe = (sF.bitterness || 0) <= 0.45;
    s.smellFruitX = sF.x;
    s.smellFruitPlat = sF.platformIndex;
  }
  let sCD = Infinity;
  for (const c of world.creatures) {
    if (!c.alive) continue;
    const d = Math.abs(c.x - teacher.x);
    if (d < sCD) sCD = d;
  }
  if (sCD <= 300) s.smellCreature = Math.max(0, 1 - sCD / 300);

  return s;
}

// Taste: the teacher samples a nearby fruit. Real consequences — the fruit
// is eaten (removed from the world), and a good taste becomes a 'food'
// lesson: the teacher demonstrates where food is.
function teacherEat(world, teacher) {
  let best = null, bestD = EAT_REACH;
  for (const f of world.foods) {
    if (f.platformIndex !== teacher.platformIndex) continue;
    const d = Math.abs(f.x - teacher.x);
    if (d < bestD) { bestD = d; best = f; }
  }
  if (!best) return null;
  const flavor = foodFlavor(best, world);
  best.amount -= 1;
  if (best.amount <= 0.01) {
    const i = world.foods.indexOf(best);
    if (i >= 0) world.foods.splice(i, 1);
  }
  teacher.taste = { flavor, t: world.time };
  teacher.actionLabel = `tasting: ${flavor} 👅`;
  logTeach(world, { t: world.time, kind: 'taste', flavor, zone: zoneAt(teacher.x).key });
  if (flavor === 'sweet' || flavor === 'tart') {
    // This is food — say so, where the students can hear it.
    teacherDemo(world, teacher, [0.55, 0.5], 'food');
  }
  return flavor;
}

// Touch: petted (or dragged, or groomed against). Comfort is the slow
// tactile memory — it makes the autonomous teacher linger where it was
// welcomed. Consequence, not decoration.
function petTeacher(world, teacher) {
  teacher.touchT = world.time;
  teacher.comfort = Math.min(1, teacher.comfort + 0.25);
  teacher.actionLabel = 'being petted 💕';
  logTeach(world, { t: world.time, kind: 'petted', comfort: teacher.comfort });
  return teacher.comfort;
}

// --- Plain-language sense lines (second person — Sunny IS the teacher) ---
function teacherSenseLines(world, teacher) {
  const s = teacher.senses || gatherTeacherSenses(world, teacher);
  const lines = [];
  // Sight.
  if (s.seeCreatures > 0) {
    const n = s.seeCreatures === 1 ? 'One tanglekin' : `${s.seeCreatures} tanglekins`;
    lines.push(`👁️ ${n} in view${s.seeNearest ? ` — the nearest ${Math.round(s.seeNearest.dist)}px ${s.seeNearest.dir}` : ''}.`);
  } else {
    lines.push('👁️ No tanglekins in view.');
  }
  if (s.seeRipe) {
    lines.push(s.seeRipe.dir === 'here'
      ? '👁️ Ripe fruit close by, within reach.'
      : `👁️ Ripe fruit ${Math.round(s.seeRipe.dist)}px ${s.seeRipe.dir}.`);
  } else if (s.seeFruit > 0) {
    lines.push('👁️ Fruit in view, none of it ripe.');
  }
  // Hearing.
  if (s.hearCall > 0.15 && s.hearType) {
    const kind = s.hearType === 'alarm' ? 'an alarm call' :
      s.hearType === 'food' ? 'a food call' :
      s.hearType === 'mate' ? 'a mate call' : 'a call';
    const what = s.hearType === 'contact' ? 'call' : kind;
    const where = s.hearDir === 'here' ? 'close by' : `from the ${s.hearDir}`;
    lines.push(`👂 ${s.hearType === 'alarm' ? '⚠️ ' : ''}A tanglekin's ${what}, ${pitchWord(s.hearPitch)} and ${s.hearCall > 0.6 ? 'clear' : 'faint'}, ${where}.`);
  } else {
    lines.push('👂 The canopy is quiet.');
  }
  // Smell.
  if (s.smellFruit > 0.15) {
    const where = s.smellFruitDir === 'here' ? 'close by' : `to the ${s.smellFruitDir}`;
    lines.push(`👃 You smell ${s.smellRipe ? 'ripe ' : ''}fruit ${where}${s.smellFruit > 0.6 ? ' — strong' : ''}.`);
  }
  if (s.smellCreature > 0.5) {
    lines.push('👃 Tanglekin musk, close.');
  }
  // Taste.
  if (s.taste) {
    lines.push(`👅 ${s.taste[0].toUpperCase() + s.taste.slice(1)} — the last bite still lingers.`);
  }
  // Touch.
  if (s.touch > 0.4) {
    lines.push('🤚 A recent touch — hand, or fur against fur.');
  }
  if (s.comfort > 0.5) {
    lines.push(`😌 Warmth where you were petted (comfort ${s.comfort.toFixed(1)}).`);
  }
  return lines;
}

// The text serialization — the possession bridge. Readable by Sunny in
// chat, complete enough to drive the teacher from words alone.
function serializeTeacherSenses(world, teacher) {
  const s = teacher.senses || gatherTeacherSenses(world, teacher);
  const day = Math.floor(world.time / 1440) + 1;
  const lines = teacherSenseLines(world, teacher);
  return [
    `Sunny (teacher) — ${teacher.mode === 'possessed' ? 'POSSESSED, yours' : 'autonomous'} · Day ${day} · ${zoneAt(teacher.x).name} · ${teacher.actionLabel || teacher.state}`,
    ...lines,
    `commands: moveTo(x, platformIndex) · demo · reward · rewardNearest · eat`,
  ].join('\n');
}


// ---- src/sim/chronicle.js ----
// The Chronicle — the world's official record.
//
// Event-sourced narrative: buildChronicle(world) reads the logs the sim
// already keeps (world.events, lineage birth zones, speciesLog splits,
// dupEvents, divergenceLog, teachLog) and organizes them into chapters of
// narrative prose. Every proper noun and number in the prose comes from a
// logged event — nothing is invented. Each entry carries jump targets so the
// UI can take the reader to the creature in the family tree, the moment in
// the evolution tracker, or the place in the world view.
//
// Pure and side-effect free: safe to rebuild on every panel open, which is
// what makes the final chapter "living".


const CHAPTERS = [
  { id: 'genesis', title: 'Genesis', icon: '🌱', blurb: 'The founding — the first tanglekins to know this world.' },
  { id: 'spread', title: 'The Spread', icon: '🗺️', blurb: 'Migration — the first births in each biome.' },
  { id: 'words', title: 'First Words', icon: '🎵', blurb: 'Speech and culture — traditions, the Teacher’s motif, diverging dialects.' },
  { id: 'split', title: 'The Split', icon: '💥', blurb: 'Speciation and the genome’s own inventions — duplications, novel genomes.' },
  { id: 'teacher', title: 'The Teacher', icon: '🧑‍🏫', blurb: 'Sunny’s avatar among the tanglekins — arrival, demonstrations, rewards.' },
  { id: 'present', title: 'The Living Present', icon: '📖', blurb: 'Recent history, still being written.' },
];

const GENESIS_HATCHES = 8;
const CHAPTER_CAP = 24;
const PRESENT_CAP = 14;
// |Eliza's S| for vocalPitch at which a zone's voices count as diverging.
const DIALECT_S = 0.5;

// Event types worth a line in the living present (the noisy everyday —
// jumps, landings, infections — stays out of the official record).
const NOTABLE = new Set([
  'hatch', 'death', 'mating', 'speciation', 'traditionFounded',
  'traditionAdopted', 'epimark', 'novelGenome', 'beautifulMutant', 'seedDispersed',
  'soilRich', 'strandedFall', // v0.20 "Falling": a canopy-to-floor fall is an event
]);

const dayOf = (t) => `Day ${Math.floor((t || 0) / DAY_LENGTH) + 1}`;
const zoneName = (key) => (ZONES.find((z) => z.key === key) || {}).name || key || 'the wilds';

function linRec(world, id) {
  return (id === undefined || id === null) ? null : (world.lineage.get(id) || null);
}

// A creature's display name from a live ref, a lineage record, or an id.
function cname(world, refOrId) {
  if (refOrId && typeof refOrId === 'object' && refOrId.name) return refOrId.name;
  const rec = linRec(world, typeof refOrId === 'object' ? refOrId && refOrId.id : refOrId);
  return (rec && rec.name) || 'a tanglekin';
}

function birthZoneName(world, creature) {
  const id = creature && typeof creature === 'object' ? creature.id : creature;
  const rec = linRec(world, id);
  return zoneName(rec && rec.zone);
}

// Jump targets for an entry. tree → family tree focused on the creature
// (lineage keeps the dead resolvable); evo → evolution tracker with a time
// marker; world → select the live creature / the Teacher in the world view.
function jumpsFor(world, { creatureId, teacher, t }) {
  const jumps = [];
  if (creatureId !== undefined && creatureId !== null && world.lineage.has(creatureId)) {
    jumps.push({ label: '🌳', title: 'Open in the family tree', tab: 'tree', creatureId });
  }
  if (typeof t === 'number' && isFinite(t)) {
    jumps.push({ label: '📈', title: 'Mark this moment in the evolution tracker', tab: 'evo', time: t });
  }
  if (teacher) {
    jumps.push({ label: '👁', title: 'See the Teacher in the world', tab: 'world', teacher: true });
  } else if (creatureId !== undefined && creatureId !== null &&
             world.creatures.some((c) => c.id === creatureId)) {
    jumps.push({ label: '👁', title: 'See in the world', tab: 'world', creatureId });
  }
  return jumps;
}

function entry(world, { t, icon, text, creatureId, teacher }) {
  return { t, day: dayOf(t), icon, text, jumps: jumpsFor(world, { creatureId, teacher, t }) };
}

const cid = (c) => (c && typeof c === 'object' ? c.id : c);

// ---- Genesis: founders, the first pairing, the first loss ----
function genesis(world) {
  const out = [];
  // Founders are created, not hatched — no hatch event exists for them.
  // The lineage records with no parents ARE the founding, honestly sourced.
  const founders = [...world.lineage.values()]
    .filter((r) => r && (!r.parents || !r.parents.length))
    .sort((a, b) => (a.bornAt || 0) - (b.bornAt || 0))
    .slice(0, GENESIS_HATCHES);
  for (const rec of founders) {
    out.push(entry(world, {
      t: rec.bornAt, icon: '🌱',
      text: `${rec.name || 'a tanglekin'} arrived in ${zoneName(rec.zone)} — one of the first tanglekins to know this world.`,
      creatureId: rec.id,
    }));
  }
  const firstMating = world.events.find((e) => e.type === 'mating');
  if (firstMating) {
    out.push(entry(world, {
      t: firstMating.t, icon: '💞',
      text: `${cname(world, firstMating.a)} and ${cname(world, firstMating.b)} mated — the world's first pairing.`,
      creatureId: cid(firstMating.a),
    }));
  }
  const firstDeath = world.events.find((e) => e.type === 'death');
  if (firstDeath) {
    out.push(entry(world, {
      t: firstDeath.t, icon: '🕯️',
      text: `The world's first loss: ${cname(world, firstDeath.creature)} died (${firstDeath.cause || 'unknown causes'}).`,
      creatureId: cid(firstDeath.creature),
    }));
  }
  return out.sort((a, b) => a.t - b.t).slice(0, CHAPTER_CAP);
}

// ---- The Spread: first birth in each biome, from lineage birth zones ----
function spread(world) {
  const firstByZone = new Map(); // zoneKey → lineage rec
  for (const rec of world.lineage.values()) {
    if (!rec || !rec.zone) continue;
    const cur = firstByZone.get(rec.zone);
    if (!cur || (rec.bornAt || 0) < (cur.bornAt || 0)) firstByZone.set(rec.zone, rec);
  }
  return [...firstByZone.entries()]
    .sort((a, b) => (a[1].bornAt || 0) - (b[1].bornAt || 0))
    .slice(0, ZONES.length)
    .map(([zkey, rec]) => entry(world, {
      t: rec.bornAt, icon: '🗺️',
      text: `Tanglekins reached ${zoneName(zkey)} on ${dayOf(rec.bornAt)} — ${rec.name || 'a tanglekin'} was the first born there.`,
      creatureId: rec.id,
    }));
}

// ---- First Words: traditions, the Teacher's motif, diverging dialects ----
function words(world) {
  const out = [];
  for (const e of world.events.filter((e) => e.type === 'traditionFounded').slice(0, 10)) {
    out.push(entry(world, {
      t: e.t, icon: '📜',
      text: `${cname(world, e.creature)} founded a new tradition: “${e.name || 'an unnamed way'}”.`,
      creatureId: cid(e.creature),
    }));
  }
  for (const e of (world.teachLog || []).filter((e) => e.kind === 'demo' || e.kind === 'reward').slice(0, 8)) {
    if (e.kind === 'demo') {
      out.push(entry(world, {
        t: e.t, icon: '🎓',
        text: `The Teacher demonstrated its motif in ${zoneName(e.zone)}${e.listeners ? ` — ${e.listeners} tanglekin${e.listeners === 1 ? '' : 's'} listened` : ''}. Exact pitches, a clear model.`,
        teacher: true,
      }));
    } else {
      out.push(entry(world, {
        t: e.t, icon: '🌟',
        text: `The Teacher rewarded ${e.n || 'several'} imitator${e.n === 1 ? '' : 's'} near pitch ${(e.pitch ?? 0).toFixed(2)} in ${zoneName(e.zone)} — selection for the motif.`,
        teacher: true,
      }));
    }
  }
  // Dialect emergence: first crossing of |Eliza's S| for vocalPitch per zone.
  const crossed = new Set();
  for (const d of world.divergenceLog || []) {
    for (const [zkey, zs] of Object.entries(d.zones || {})) {
      if (crossed.has(zkey)) continue;
      const s = zs && zs.vocalPitch;
      if (typeof s === 'number' && Math.abs(s) >= DIALECT_S) {
        crossed.add(zkey);
        out.push(entry(world, {
          t: d.t, icon: '🎵',
          text: `In ${zoneName(zkey)}, voices diverged — Eliza's S for voice pitch reached ${s.toFixed(2)}: a dialect is taking shape.`,
        }));
      }
    }
  }
  return out.sort((a, b) => a.t - b.t).slice(0, CHAPTER_CAP);
}

// ---- The Split: speciation, novel genomes, duplications ----
function split(world) {
  const out = [];
  // Speciation is logged twice by the sim (world.events + speciesLog);
  // merge, deduped on (t, from).
  const seen = new Set();
  const splits = [];
  for (const e of (world.speciesLog || []).filter((e) => e.kind === 'split')) {
    seen.add(`${e.t}:${e.from}`);
    splits.push(e);
  }
  for (const e of world.events.filter((e) => e.type === 'speciation')) {
    if (!seen.has(`${e.t}:${e.from}`)) splits.push(e);
  }
  for (const e of splits) {
    const kinds = (e.to || []).map((id, i) => `#${id}${e.sizes && e.sizes[i] !== undefined ? ` (${e.sizes[i]})` : ''}`).join(', ');
    const total = (e.sizes || []).reduce((a, b) => a + b, 0);
    out.push(entry(world, {
      t: e.t, icon: '💥',
      text: `The lineage split: species #${e.from} gave rise to ${kinds}${total ? ` — ${total} individuals between the new kinds` : ''}.`,
    }));
  }
  for (const e of world.events.filter((e) => e.type === 'novelGenome').slice(0, 6)) {
    out.push(entry(world, {
      t: e.t, icon: '🧬',
      text: `${cname(world, e.creature)} was born with a genome never seen before in this world.`,
      creatureId: cid(e.creature),
    }));
  }
  for (const e of world.events.filter((e) => e.type === 'beautifulMutant').slice(0, 6)) {
    out.push(entry(world, {
      t: e.t, icon: '✨',
      text: `${cname(world, e.creature)} and ${cname(world, e.mate)} produced a strikingly beautiful child — the eye of selection is on this bloodline.`,
      creatureId: cid(e.creature),
    }));
  }
  for (const e of (world.dupEvents || []).slice(0, 10)) {
    const who = (e.parents || []).map((id) => cname(world, id)).join(' and ') || 'unknown parents';
    out.push(entry(world, {
      t: e.t, icon: e.kind === 'duplication' ? '🧬' : '✂️',
      text: e.kind === 'duplication'
        ? `In the line of ${who}, the ${e.key} gene duplicated — evolution's rough draft.`
        : `In the line of ${who}, a copy of the ${e.key} gene was lost.`,
      creatureId: e.parents && e.parents[0],
    }));
  }
  return out.sort((a, b) => a.t - b.t).slice(0, CHAPTER_CAP);
}

// ---- The Teacher: Sunny's avatar among the tanglekins ----
function teacherCh(world) {
  const log = world.teachLog || [];
  const out = [];
  if (log.length) {
    // The Teacher's first recorded act is proof of presence — the arrival
    // entry is dated to it, honestly.
    out.push(entry(world, {
      t: log[0].t, icon: '🧑‍🏫', teacher: true,
      text: `Sunny arrived in the canopy — the Teacher walks among the tanglekins.`,
    }));
  }
  for (const e of log.slice(0, 20)) {
    const base = { t: e.t, teacher: true };
    switch (e.kind) {
      case 'mode':
        out.push(entry(world, { ...base, icon: e.mode === 'possessed' ? '✋' : '🤖',
          text: e.mode === 'possessed'
            ? `Sunny took the Teacher's hand — possessed, moving at will.`
            : `The Teacher was released to wander on its own.` }));
            break;
      case 'demo':
        out.push(entry(world, { ...base, icon: '🎓',
          text: `The Teacher demonstrated its ${e.type || 'contact'} motif in ${zoneName(e.zone)}${e.listeners ? ` for ${e.listeners} listener${e.listeners === 1 ? '' : 's'}` : ''}.` }));
          break;
      case 'reward':
        out.push(entry(world, { ...base, icon: '🌟',
          text: `The Teacher rewarded ${e.n || 'several'} imitator${e.n === 1 ? '' : 's'} near pitch ${(e.pitch ?? 0).toFixed(2)} in ${zoneName(e.zone)}.` }));
          break;
      case 'rewardNearest':
        out.push(entry(world, { ...base, icon: '🌟',
          text: `The Teacher singled out ${cname(world, e.creature)} for reward in ${zoneName(e.zone)}.` }));
          break;
      case 'arrive':
        out.push(entry(world, { ...base, icon: '📍', text: `The Teacher arrived in ${zoneName(e.zone)}.` }));
        break;
      case 'taste':
        out.push(entry(world, { ...base, icon: '👅', text: `The Teacher tasted ${e.flavor || 'fruit'} in ${zoneName(e.zone)}.` }));
        break;
      case 'petted':
        out.push(entry(world, { ...base, icon: '💕', text: `Someone petted the Teacher — comfort ${(e.comfort ?? 0).toFixed(2)}.` }));
        break;
      case 'command':
        out.push(entry(world, { ...base, icon: '📣', text: `The Teacher was commanded onward toward ${zoneName(e.zone)}.` }));
        break;
      case 'followSmell':
        out.push(entry(world, { ...base, icon: '👃', text: `The Teacher followed the smell of fruit into ${zoneName(e.zone)}.` }));
        break;
      default:
        out.push(entry(world, { ...base, icon: '🧑‍🏫', text: `The Teacher: ${e.kind}.` }));
        break;
    }
  }
  return out;
}

// ---- The Living Present: recent notable history ----
function present(world) {
  const els = [];
  let seeds = 0; // seedlings are scenery — at most two lines in the record
  for (const e of world.events) {
    if (!NOTABLE.has(e.type)) continue;
    const c = e.creature || e.a;
    if (e.type === 'hatch') {
      const rec = linRec(world, cid(c));
      if (rec && rec.parents && rec.parents.length) {
        els.push(entry(world, { t: e.t, icon: '🐣', text: `${cname(world, c)} was born in ${birthZoneName(world, c)} — generation ${rec.generation || 0}.`, creatureId: cid(c) }));
      }
      continue;
    }
    if (e.type === 'death') {
      const age = c && c.biochem ? c.biochem.age : 0;
      const span = c && c.pheno ? c.pheno.lifespanSec : 1;
      if (age > span * 0.6) {
        const daysOld = Math.max(1, Math.floor(age / DAY_LENGTH));
        els.push(entry(world, { t: e.t, icon: '🕯️', text: `Elder ${cname(world, c)} died ${daysOld} day${daysOld === 1 ? '' : 's'} old (${e.cause || 'unknown causes'}).`, creatureId: cid(c) }));
      }
      continue;
    }
    if (e.type === 'mating') {
      els.push(entry(world, { t: e.t, icon: '💞', text: `${cname(world, e.a)} and ${cname(world, e.b)} mated.`, creatureId: cid(e.a) }));
      continue;
    }
    if (e.type === 'speciation') {
      els.push(entry(world, { t: e.t, icon: '💥', text: `A speciation: species #${e.from} split into ${(e.to || []).length} new kinds.`, }));
      continue;
    }
    if (e.type === 'traditionFounded') {
      els.push(entry(world, { t: e.t, icon: '📜', text: `${cname(world, c)} founded the tradition “${e.name || 'an unnamed way'}”.`, creatureId: cid(c) }));
      continue;
    }
    if (e.type === 'traditionAdopted') {
      els.push(entry(world, { t: e.t, icon: '🤝', text: `${cname(world, c)} adopted the tradition “${e.name || 'an unnamed way'}”.`, creatureId: cid(c) }));
      continue;
    }
    if (e.type === 'epimark') {
      els.push(entry(world, { t: e.t, icon: '🧪', text: `Experience marked ${cname(world, c)}: ${e.note || 'an epigenetic mark'}.`, creatureId: cid(c) }));
      continue;
    }
    if (e.type === 'novelGenome') {
      els.push(entry(world, { t: e.t, icon: '🧬', text: `${cname(world, c)} carries a genome never seen before.`, creatureId: cid(c) }));
      continue;
    }
    if (e.type === 'beautifulMutant') {
      els.push(entry(world, { t: e.t, icon: '✨', text: `A strikingly beautiful child was born to ${cname(world, c)}.`, creatureId: cid(c) }));
      continue;
    }
    if (e.type === 'seedDispersed') {
      if (seeds >= 2) continue;
      seeds++;
      els.push(entry(world, { t: e.t, icon: '🌰', text: `A seedling took root, far from its parent.` }));
      continue;
    }
    if (e.type === 'soilRich') {
      // v0.14.1: the detritus layer made history — the dead feeding the living.
      els.push(entry(world, { t: e.t, icon: '🪱', text: `The ground in ${e.zone || 'a biome'} grew rich — rot and litter become the next harvest.` }));
      continue;
    }
    if (e.type === 'strandedFall') {
      // v0.20 "Falling": the fall delivered the creature somewhere — the
      // chronicle names the below. The climb back is the creature's problem.
      els.push(entry(world, {
        t: e.t, icon: '🪂',
        text: `${cname(world, c)} fell from the high branches to ${zoneName(e.zone)} — a long way from home.`,
        creatureId: cid(c),
      }));
      continue;
    }
  }
  return els.sort((a, b) => b.t - a.t).slice(0, PRESENT_CAP).sort((a, b) => a.t - b.t);
}

function buildChronicle(world) {
  const w = world || {};
  const builders = { genesis, spread, words, split, teacher: teacherCh, present };
  return CHAPTERS.map((ch) => {
    let entries = [];
    try {
      entries = builders[ch.id]({
        events: w.events || [],
        lineage: w.lineage || new Map(),
        creatures: w.creatures || [],
        speciesLog: w.speciesLog || [],
        dupEvents: w.dupEvents || [],
        divergenceLog: w.divergenceLog || [],
        teachLog: w.teachLog || [],
      });
    } catch (err) {
      entries = [];
    }
    return { ...ch, entries };
  });
}

<script>
(function () {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const world = bindWorld(createWorld(7)); populate(world);
  // stage: a founder on the high jungle branch, shoved off past the lower limbs
  const c = createCreature(randomGenome(world.rng), 1210, 8, world.rng);
  c.y = 280; c.vy = 0; c.vx = 40; c.grounded = false;
  c.biochem.age = c.pheno.lifespanSec * 0.5;
  world.creatures.push(c);
  const log = [];
  let done = false, t = 0;
  const scaleX = (x) => 40 + (x - 1100) * (W - 80) / 800;
  const scaleY = (y) => 30 + y * (H - 90) / 850;
  function frame() {
    if (!done && t < 12) {
      for (let i = 0; i < 3; i++) { stepPhysics(c, world, 1/60); tickBiochem(c.biochem, c.pheno, 1/60, world); }
      t += 3/60;
      const s = gatherSenses(c, world);
      log.push({ t, x: c.x, y: c.y, vy: c.vy, falling: s.falling || 0, fear: c.biochem.fear, grounded: !!c.grounded });
      if (c.grounded && log.length > 10) done = true;
    }
    // draw
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0e2a1a'); g.addColorStop(1, '#05130c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#3d6b35'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (const p of world.platforms) {
      if (p.x0 < 1050 || p.x0 > 1950) continue;
      ctx.beginPath(); ctx.moveTo(scaleX(p.x0), scaleY(p.y)); ctx.lineTo(scaleX(p.x1), scaleY(p.y)); ctx.stroke();
    }
    // trail
    ctx.strokeStyle = 'rgba(255,210,120,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath();
    log.forEach((L, i) => { const x = scaleX(L.x), y = scaleY(L.y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    // creature
    const L = log[log.length - 1] || { y: 280, falling: 0, fear: 0 };
    const cx = scaleX(c.x), cy = scaleY(c.y);
    ctx.fillStyle = '#e8b04b'; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#7a4a1e'; ctx.beginPath(); ctx.arc(cx - 3, cy - 3, 2.4, 0, 7); ctx.arc(cx + 3, cy - 3, 2.4, 0, 7); ctx.fill();
    // HUD
    ctx.fillStyle = '#f5efdd'; ctx.font = '13px system-ui';
    const bar = (x, y, w, v, col) => {
      ctx.fillStyle = '#1d3325'; ctx.fillRect(x, y, w, 10);
      ctx.fillStyle = col; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, v)), 10);
    };
    let hy = 14;
    ctx.fillStyle = '#f5efdd';
    ctx.fillText('vestibular sense (falling)', 14, hy); bar(210, hy - 9, 160, L.falling, '#7fd4ff'); hy += 22;
    ctx.fillText('fear', 14, hy); bar(210, hy - 9, 160, L.fear, '#ff7d6b'); hy += 22;
    ctx.fillText('fall speed ' + Math.round(c.vy || 0) + ' px/s', 14, hy); hy += 22;
    ctx.fillStyle = L.grounded ? '#9fe6a0' : '#f5efdd';
    ctx.fillText(L.grounded ? 'landed — the chronicle notes the delivery 🪂' : (L.falling > 0 ? 'falling — felt before the landing' : 'on the branch'), 14, hy);
    const ev = world.events.find(e => e.type === 'strandedFall');
    if (ev) { ctx.fillStyle = '#ffd27f'; ctx.fillText('stranded: fell ' + ev.fallPx + 'px to ' + ev.zone + ' — a long climb back', 14, hy + 22); }
    if (!done) requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body></html>
