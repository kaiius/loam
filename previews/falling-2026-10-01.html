<script>
// ---- src/sim/rng.js ----
// Seeded RNG (mulberry32) so worlds are reproducible.

function createRng(seed) {
  let a = seed >>> 0;
  const rng = {
    next() {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    range(min, max) {
      return min + (max - min) * rng.next();
    },
    int(min, max) {
      return Math.floor(rng.range(min, max + 1));
    },
    pick(arr) {
      return arr[Math.floor(rng.next() * arr.length)];
    },
    chance(p) {
      return rng.next() < p;
    },
    // Box-Muller Gaussian for small-effect mutation steps.
    gauss(mean = 0, sigma = 1) {
      let u = 0;
      while (u === 0) u = rng.next();
      const v = rng.next();
      return mean + sigma * Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    },
  };
  return rng;
}


// ---- src/sim/biomes.js ----
// Canopy v0.18 "Realms": the biome map.
//
// Eight contiguous regions, west → east, on a 4800×1100 canvas. Biomes are
// selection readers for the Bauplan body plan — not scenery. This module is
// pure geography: region layout, ambient temperature fields, waters, ground,
// and the per-biome flora table. No rng, no state, no behavior — the same
// inputs always give the same outputs.

const WORLD_W = 4800;
const WORLD_H = 1100;

// West → east: arctic, mountains, jungle, plains, desert, shallows,
// archipelago, deep. cx = region center x.
const BIOMES = [
  { key: 'arctic', name: 'Arctic Wastes', x0: 0, x1: 600, cx: 300 },
  { key: 'mountains', name: 'Skyreach Mountains', x0: 600, x1: 1200, cx: 900 },
  { key: 'jungle', name: 'Emerald Jungle', x0: 1200, x1: 1800, cx: 1500 },
  { key: 'plains', name: 'Whispering Plains', x0: 1800, x1: 2400, cx: 2100 },
  { key: 'desert', name: 'Sunscorch Desert', x0: 2400, x1: 3000, cx: 2700 },
  { key: 'shallows', name: 'Mangrove Shallows', x0: 3000, x1: 3600, cx: 3300 },
  { key: 'archipelago', name: 'The Archipelago', x0: 3600, x1: 4200, cx: 3900 },
  { key: 'deep', name: 'Azure Deep', x0: 4200, x1: 4800, cx: 4500 },
];

function biomeAt(x, y) {
  const xc = Math.max(0, Math.min(WORLD_W - 1, x));
  return Math.min(7, Math.floor(xc / 600));
}

function biomeKeyAt(x, y) {
  return BIOMES[biomeAt(x, y)].key;
}

function biomeCenterX(i) {
  return BIOMES[Math.max(0, Math.min(7, i))].cx;
}

function clamp01(v) {
  return v < 0 ? 0 : v > 1 ? 1 : v;
}

// Altitude cold + biome cold. Arctic: the honest cold, base 1.0.
// Mountains: altitude lapse — 0 at foothills (y≥700) → 1 above y≤250.
// Deep: water chill 0.3. Everywhere else: 0.
function ambientCold(x, y) {
  const b = biomeAt(x, y);
  if (b === 0) return 1.0;
  if (b === 1) return clamp01((700 - y) / (700 - 250));
  if (b === 7) return 0.3;
  return 0;
}

// Desert interior (x2550–2850) → 1.0, ramping from 0.3 at the biome edges.
// Jungle 0.1, plains 0.2, everywhere else 0.
function ambientHeat(x, y) {
  const b = biomeAt(x, y);
  if (b === 4) {
    if (x >= 2550 && x <= 2850) return 1.0;
    const d = x < 2550 ? (x - 2400) / 150 : (3000 - x) / 150;
    return clamp01(0.3 + 0.7 * Math.max(0, Math.min(1, d)));
  }
  if (b === 2) return 0.1;
  if (b === 3) return 0.2;
  return 0;
}

function ambientTemp(x, y) {
  return clamp01(0.5 + ambientHeat(x, y) * 0.5 - ambientCold(x, y) * 0.5);
}

// Waters: point-in-water test. Returns null outside water, or
// { surfaceY, salt } when the point (x, y) is at/below the surface.
// depth is internal (used for minnow movement bounds).
const WATERS = [
  { x0: 1300, x1: 1400, surfaceY: 790, depth: 35, salt: false },  // jungle pool, west
  { x0: 1600, x1: 1700, surfaceY: 790, depth: 35, salt: false },  // jungle pool, east
  { x0: 2680, x1: 2760, surfaceY: 820, depth: 40, salt: false },  // desert oasis
  { x0: 3000, x1: 3600, surfaceY: 800, depth: 150, salt: true },  // shallows (seabed 950)
  { x0: 3600, x1: 4200, surfaceY: 800, depth: 120, salt: true },  // archipelago channels
  { x0: 4200, x1: 4800, surfaceY: 700, depth: 350, salt: true },   // deep (bottom 1050)
];

function waterAt(x, y) {
  for (const w of WATERS) {
    if (x >= w.x0 && x < w.x1 && y >= w.surfaceY) return { surfaceY: w.surfaceY, salt: w.salt };
  }
  return null;
}

function waterDepthAt(x, y) {
  for (const w of WATERS) {
    if (x >= w.x0 && x < w.x1 && y >= w.surfaceY) return w.depth;
  }
  return 0;
}

// Renderer-facing water list (world.waters-compatible shape).
function waterRects() {
  return WATERS.map((w) => ({ x0: w.x0, x1: w.x1, surfaceY: w.surfaceY, salt: w.salt }));
}

// Ground level at x, or null for open water (archipelago gaps, deep).
// Mountains have partial ground — the foothill shelf and the east shelf.
const ARCHIPELAGO_ISLANDS = [[3600, 3860], [4060, 4180]]; // v0.20: the [3720,3740] seam is filled — one island
function groundYAt(x) {
  const b = biomeAt(x, 0);
  switch (b) {
    case 0: return 800;                                            // arctic ice
    // v0.20: the [760,1040] gap is filled ground now — mountains are
    // continuous foothills, no holes.
    case 1: return 800;
    case 2: return 800;                                            // jungle floor
    case 3: return 820;                                            // plains
    case 4: return 830;                                            // desert
    case 5: return 950;                                            // shallows seabed (walkable, wading)
    case 6:
      for (const [a, z] of ARCHIPELAGO_ISLANDS) if (x >= a && x < z) return 780;
      return null;                                                 // open water between islands
    default: return null;                                          // deep: open water
  }
}

// Per-biome flora table (§5). morph selects the render path; the three
// *TolBias fields are added to the plant genome's heatTol/coldTol/saltTol
// alleles at spawn; fruitKind is the food entity kind; yield scales fruiting.
function floraFor(biomeKey) {
  const t = {
    arctic:      { morph: 'moss',     heatTolBias: -0.4, coldTolBias:  0.7, saltTolBias: 0,   fruitKind: 'moss',        yield: 0.2 },
    mountains:   { morph: 'shrub',    heatTolBias: -0.2, coldTolBias:  0.6, saltTolBias: 0,   fruitKind: 'berry',       yield: 0.6 },
    jungle:      { morph: 'tree',     heatTolBias:  0,   coldTolBias:  0,   saltTolBias: 0,   fruitKind: 'fruit',       yield: 0.7 },
    plains:      { morph: 'grass',    heatTolBias:  0.1, coldTolBias:  0,   saltTolBias: 0,   fruitKind: 'seed',        yield: 0.4 },
    desert:      { morph: 'cactus',   heatTolBias:  0.6, coldTolBias: -0.2, saltTolBias: 0,   fruitKind: 'cactusfruit', yield: 0.5 },
    shallows:    { morph: 'mangrove', heatTolBias:  0.1, coldTolBias:  0,   saltTolBias: 0.6, fruitKind: 'propagule',   yield: 0.5 },
    archipelago: { morph: 'palm',     heatTolBias:  0.2, coldTolBias: -0.1, saltTolBias: 0.4, fruitKind: 'fruit',       yield: 0.6 },
    deep:        { morph: 'kelp',      heatTolBias:  0,   coldTolBias:  0.2, saltTolBias: 0.7, fruitKind: 'kelp',        yield: 0.5 },
  }[biomeKey];
  return t ? { ...t }
    : { morph: 'tree', heatTolBias: 0, coldTolBias: 0, saltTolBias: 0, fruitKind: 'fruit', yield: 0.5 };
}


// ---- src/sim/genome.js ----
// Digital DNA for Canopy tanglekins: diploid genome, inheritance with
// CHROMOSOMAL meiosis + epigenetics, and phenotype expression.
//
// v0.12: 43 loci (Wildcode v0.12's 37 — incl. the sense→action instinct
// genes, morphology, tradition fidelity — plus 6 canopy genes:
// instClimbUp, instClimbDown, instLonelyGroom, instJump, legPower,
// brainSize).
//
// GENOME v2 (2026-09-29): 45 multi-parameter genes across 9 functional
// families, appended AFTER locus 43 — the original 43 keep their indices,
// append-only. 132 new loci → 175 total. Every new locus is wired into the
// tick or the render (no decorative genes):
//   R — reactions ×8: evolvable chemistry (substrate→product, mass-conserving)
//   C — receptors ×6: chemical levels modulate senses
//   E — emitters ×6: firing an action releases a chemical pulse
//   B — brain architecture ×4: layers, sparsity, Hebbian rate, inhibition,
//       attention gates, eligibility traces, neuromodulation of learning
//   L — life history ×4: longevity, maturation, fertility, senescence
//   M — morphology ×8: bulk, tail, regional pigmentation, ears, arms
//   S — stimulus valence ×4: evolvable valence for world events
//   D — drive tuning ×5: gain + baseline on the chemical→drive readout
// (the 9th family is the original 43: instincts, senses, metabolism, form.)
//
// New allele kind 'sym': signed [-1,1] for gains and valences.
//
// The machinery is Emberhollow's: chromosomes, meiosis with 1–3 crossovers
// per chromosome (linked genes travel together; distant genes assort),
// mutation at 0.008 per allele (5% large-effect re-roll, else small Gaussian
// step), and epigenetic marks that scale expression 0.5×–1.5× and fade
// across generations. Linked inheritance is what makes lineages legible:
// a chromosome is a story, not a bag of alleles.


const GENES = [
  // appearance
  { key: 'bodyHue', kind: 'float' },
  { key: 'patternDensity', kind: 'float' },
  { key: 'size', kind: 'float' },
  { key: 'tailLength', kind: 'float' },
  { key: 'eyeSize', kind: 'float', founder: 0.6 }, // bigger eyes, farther sight
  { key: 'pattern', kind: 'choice', choices: ['plain', 'spots', 'stripes'] },
  { key: 'earShape', kind: 'choice', choices: ['round', 'pointy', 'floppy'] },
  // metabolism
  { key: 'hungerRate', kind: 'float' },
  { key: 'energyDrain', kind: 'float' },
  { key: 'lifespan', kind: 'float' },
  { key: 'growthRate', kind: 'float' },
  { key: 'fertility', kind: 'float' },
  { key: 'immunity', kind: 'float' }, // disease resistance + recovery speed
  // mind
  { key: 'learningRate', kind: 'float' },
  { key: 'curiosity', kind: 'float' },
  { key: 'sociability', kind: 'float' },
  { key: 'boldness', kind: 'float' },
  { key: 'memory', kind: 'float' }, // episodic memory capacity (16–64)
  // brainSize is an UNBOUNDED locus (kind 'exp'): a positive multiplier with
  // no ceiling. Associative-layer neurons = 100 × expressed value, so the
  // founder 8.0 gives ~800 — emberling scale — and mutation + selection can
  // drive it upward forever. There is deliberately no cap: brains may evolve
  // endlessly. (The practical cost is compute per tick, which grows linearly
  // with neuron count — a tradeoff the lineage itself will negotiate.)
  { key: 'brainSize', kind: 'exp', founder: 8.0 },
  // instincts — evolvable sense→action reflex weights. `sense`/`action` index
  // into the brain's sense vector / action list; `founder` biases gen-0.
  { key: 'instHungerSeek', kind: 'float', sense: 0, action: 0, founder: 0.8 },
  { key: 'instHungerEat', kind: 'float', sense: 0, action: 1, founder: 0.8 },
  { key: 'instTiredSleep', kind: 'float', sense: 1, action: 2, founder: 0.8 },
  { key: 'instBoredPlay', kind: 'float', sense: 2, action: 3, founder: 0.8 },
  { key: 'instLonelyApproach', kind: 'float', sense: 3, action: 4, founder: 0.8 },
  { key: 'instFearFlee', kind: 'float', sense: 4, action: 5, founder: 0.8 },
  { key: 'instLightSleep', kind: 'float', sense: 5, action: 2, founder: 0.15 },
  { key: 'instFoodDistSeek', kind: 'float', sense: 6, action: 0, founder: 0.8 },
  { key: 'instCreatureDistApproach', kind: 'float', sense: 8, action: 4, founder: 0.2 },
  { key: 'instToyDistPlay', kind: 'float', sense: 10, action: 3, founder: 0.8 },
  { key: 'instLonelyMate', kind: 'float', sense: 3, action: 6, founder: 0.8 },
  { key: 'instIllnessSeek', kind: 'float', sense: 13, action: 0, founder: 0.5 },
  { key: 'instHomeSeek', kind: 'float', sense: 14, action: 8, founder: 0.5 },
  // canopy instincts (new): climb links above/below (senses 17/18)
  // drive the climb action (9). Same v0.5 precedent: an action with no
  // instinct pathway is never tried and never learned.
  { key: 'instClimbUp', kind: 'float', sense: 17, action: 9, founder: 0.5 },
  { key: 'instClimbDown', kind: 'float', sense: 18, action: 9, founder: 0.5 },
  // social grooming (new): loneliness drives grooming (action 10), the
  // troop's bonding ritual. Grooming builds bonds and oxytocin.
  { key: 'instLonelyGroom', kind: 'float', sense: 3, action: 10, founder: 0.6 },
  // physics (new): a jumpable ledge nearby (sense 21) drives the jump
  // action (11). Same v0.5 precedent: an action with no instinct pathway
  // is never tried and never learned.
  { key: 'instJump', kind: 'float', sense: 20, action: 11, founder: 0.5 },
  // morphology — body parts with stat tradeoffs. What you see IS the DNA.
  { key: 'diet', kind: 'choice', choices: ['herbivore', 'omnivore', 'carnivore'], founder: 0 },
  { key: 'mouthSize', kind: 'float', founder: 0.5 },
  { key: 'legLength', kind: 'float', founder: 0.5 },
  { key: 'legPower', kind: 'float', founder: 0.4 }, // jump impulse — how hard the legs launch. v0.17: 0.5 → 0.4 (via 0.3 — 0.3 flipped seeds 4/7/99 through illness from floor-foraging; 0.4 is the middle path); selection re-strengthens them.
  { key: 'spikes', kind: 'float', founder: 0.2 },
  { key: 'fur', kind: 'float', founder: 0.5 },
  // tradition — fidelity of cultural transmission.
  { key: 'tradition', kind: 'float', founder: 0.5 },
];

// === GENOME v2 (2026-09-29): 45 multi-parameter genes, 132 loci =========
// Append-only: everything below is new. The original 43 loci keep their
// indices. Choice vocabularies shared by the families:
const CHEM5 = ['bloodSugar', 'fatigue', 'oxytocin', 'endorphin', 'adrenaline'];
// v0.18 "Realms": oxygen (drowning) and hydration (thirst) join the
// chemistry. Old indices 0–4 keep their meaning — append-only.
const CHEM7 = [...CHEM5, 'oxygen', 'hydration'];
// The 32 real senses (bias excluded) — mirrors brain.js senseVector order.
// Append-only: a new sense goes at the END, never renumbered, so old
// brains and old saved genomes keep their meaning.
// v0.17 "Bauplan": airborne 24 (off the branch — the glide verb's reader),
// farLedge 25 (a ledge within glide range but beyond jump range),
// submerged 26, waterNear 27. The water senses read 0 until v0.18 brings
// water — the sense exists and works; the world just lacks water.
// v0.18 "Realms": thirst 28 (1 − hydration — the felt sense of the new
// chemical), cold 29, heat 30 (body-state readers, not drives), buriedNear
// 31 (scent of buried food — the dig verb's reader).
// v0.20 "Hands": objectNear 32 (a manipulable object within grasp reach —
// the grasp verb's reader), heldWeight 33 (0 empty-handed, else the
// carried object's weight — the put-down reflex's reader).
const SENSE32 = [
  'hunger', 'tiredness', 'boredom', 'loneliness', 'fear', 'light',
  'foodDist', 'foodDir', 'creatureDist', 'creatureDir', 'toyDist', 'toyDir',
  'isAdult', 'illness', 'homeDist', 'kinNear', 'bondNear',
  'climbUp', 'climbDown', 'groomNear', 'jumpNear',
  'callHeard', 'callPitch',
  'wasteOdor', // v0.14: disgust — the smell of fouled ground
  'airborne', 'farLedge', 'submerged', 'waterNear', // v0.17: the body-plan senses
  'thirst', 'cold', 'heat', 'buriedNear', // v0.18: the realms senses
  'objectNear', 'heldWeight', // v0.20: the hands senses
  'falling', // v0.20 "Falling": the vestibular sense — appended, never renumbered
];
// The pre-v0.17 vocabulary — family-C genes name senses against these
// indices, which are never renumbered.
const SENSE24 = SENSE32.slice(0, 24);
const ACT20 = [
  'seekFood', 'eat', 'sleep', 'play', 'approach', 'flee',
  'mate', 'wander', 'seekHome', 'climb', 'groom', 'jump', 'vocal',
  'glide', 'brachiate', 'swim', 'dive', // v0.17: the dormant verbs
  'drink', 'bask', 'dig', // v0.18: water, warmth, earth — wired by the realms pass
  'grasp', 'carry', 'drop', // v0.20: the hands verbs (name ACT20 is historical)
];
// The pre-v0.17 vocabulary — family-E genes name actions against these
// indices, which are never renumbered.
const ACT13 = ACT20.slice(0, 13);
// Stimulus events that actually occur in the tick (rain/thunder were cut —
// Canopy has no weather; fed-by-other was cut — no food-sharing mechanic).
const STIM4 = ['groomed', 'petted', 'scolded', 'hardLanding'];
const PIGPAT = ['none', 'spots', 'stripes'];

const _f = (key, founder) => ({ key, kind: 'float', founder });
const _s = (key, founder) => ({ key, kind: 'sym', founder });
const _c = (key, choices, founder) => ({ key, kind: 'choice', choices, founder });

// --- Family R: chemical reactions ×8 (chr 6) ------------------------------
// Each gene converts substrate→product above a threshold at a rate.
// Founder rates are near-zero: quiet chemistry evolution can turn up.
// Mass-conserving by construction (see tickBiochem).
{
  const sub = [0, 1, 2, 3, 4, 0, 1, 2];
  const prod = [1, 2, 3, 4, 0, 2, 3, 4];
  for (let i = 0; i < 8; i++) {
    GENES.push(_c(`rx${i}sub`, CHEM7, sub[i]), _c(`rx${i}prod`, CHEM7, prod[i]),
      _f(`rx${i}rate`, 0.03), _f(`rx${i}thr`, 0.5));
  }
}
// --- Family C: receptors ×6 (chr 5) --------------------------------------
// Chemical levels modulate senses: sense += gain × max(0, chem − thr).
// Founder gains are 0: silent by default, evolvable.
{
  const senses = [0, 3, 1, 4, 13, 2]; // hunger, loneliness, tiredness, fear, illness, boredom
  for (let i = 0; i < 6; i++) {
    GENES.push(_c(`rc${i}chem`, CHEM7, i % 5), _c(`rc${i}sense`, SENSE24, senses[i]),
      _s(`rc${i}gain`, 0), _f(`rc${i}thr`, 0.5));
  }
}
// --- Family E: emitters ×6 (chr 6) ---------------------------------------
// Firing the trigger action releases a pulse of the chemical.
// Founder amounts are small nudges, not floods.
{
  const trig = [1, 2, 3, 10, 5, 6]; // eat, sleep, play, groom, flee, mate
  for (let i = 0; i < 6; i++) {
    GENES.push(_c(`em${i}trig`, ACT13, trig[i]), _c(`em${i}chem`, CHEM7, (i * 2) % 5),
      _f(`em${i}amt`, 0.05));
  }
}
// --- Family B: brain architecture ×4 (chr 3) ------------------------------
GENES.push(
  // brainPlan: how the brainSize neuron budget is organized.
  _c('bpLayers', [1, 2, 3], 0), // hidden layers splitting the budget (founder: 1 = classic)
  _f('bpSparsity', 0.65), // 1 − density of sensory→assoc wiring (founder → 0.35, as before)
  _f('bpHebb', 0.5), // Hebbian rate multiplier (founder → ×1.0)
  _f('bpLatInhib', 0.85), // lateral inhibition: loser scale = 1 − value (founder → 0.15, as before)
  // attenGate: evolvable attention gates on the salience EMA.
  _f('agCount', 0), // how many senses get gated (×5, founder → 0 = off)
  _f('agGain', 0), // gain boost on gated senses (founder → none)
  _f('agThresh', 0.5), // minimum salience to earn a gate
  // memoryTrace: eligibility traces for delayed credit assignment.
  _f('mtDecay', 0.9), // trace decay per learn
  _f('mtGain', 0), // trace contribution to weight updates (founder → off)
  // neuroMod: a chemical level modulates the learning rate.
  _c('nmChem', CHEM5, 4), // founder: adrenaline — stress tunes learning
  _f('nmGain', 0), // founder → no modulation
  _f('nmThresh', 0.5),
);
// --- Family L: life history ×4 (chr 7) ------------------------------------
// The viability family: founder defaults reproduce the old constants.
GENES.push(
  // longevity: scales the lifespan locus + lifelong frailty.
  _f('longScale', 0.5), // lifespanSec × (0.5 + value) (founder → ×1.0)
  _f('longAging', 0), // lifelong health decline (founder → none)
  // maturation: juvenile timing + the learning boost of youth.
  _f('matTime', 0.5), // stage thresholds × (0.5 + value) (founder → ×1.0)
  _f('matBoost', 0), // juvenile learning-rate boost (founder → none)
  // fertility: the reproductive window + litter + gestation.
  _f('ferPeak', 0.5), // age-fraction of peak fertility (window ±0.4)
  _c('ferLitter', [1, 2, 3], 1), // eggs per mating (founder → 2, as before)
  _f('ferGest', 0.5), // egg timer × (0.5 + value) (founder → ×1.0)
  // senescence: programmed late-life decline.
  _f('senOnset', 0.8), // age-fraction when decline starts
  _f('senRate', 0), // decline rate (founder → off)
);
// --- Family M: morphology ×8 (chr 1) --------------------------------------
// Bulk, tail, regional pigmentation, ears, arms. Mostly render; tailGrip
// and armLength touch the sim (climb speed, reach).
GENES.push(
  _f('bulk', 0.5), // body girth (render)
  _f('tailCurl', 0.5), // curl of the classic tail pose (render; founder → as before)
  _f('tailGrip', 0), // prehensile strength: climb-speed bonus (sim)
  _f('pigHeadHue', 0.5), _f('pigHeadSat', 0.5), _c('pigHeadPat', PIGPAT, 0),
  _f('pigTorsoHue', 0.5), _f('pigTorsoSat', 0.5), _c('pigTorsoPat', PIGPAT, 0),
  _f('pigLimbsHue', 0.5), _f('pigLimbsSat', 0.5), _c('pigLimbsPat', PIGPAT, 0),
  _f('earSize', 0.5), // (founder → 1.0 scale, as drawn before)
  _f('earTilt', 0.5), // (founder → upright, as drawn before)
  _f('armLength', 0.5), // replaces legLength in the arm formula (founder → same)
  // matePref: heritable beauty standards — the chooser's preferred coat color
  // (hue/sat) and choosiness. Wired into _mate selection in creature.js:
  // candidates are scored on proximity + color-match × choosiness. Founder
  // choosiness 0 → nearest wins, exactly as before; as the preference genes
  // evolve, beauty standards drift and sexual selection starts to bite.
  _f('matePrefHue', 0.5),
  _f('matePrefSat', 0.5),
  _f('matePrefChoosy', 0),
);
// --- Family S: stimulus valence ×4 (chr 4) --------------------------------
// World events carry evolvable valence → chemistry nudge + learnable reward.
for (let i = 0; i < 4; i++) {
  GENES.push(_c(`st${i}event`, STIM4, i % 4), _s(`st${i}val`, 0), _f(`st${i}int`, 0.5));
}
// --- Family D: drive tuning ×5 (chr 5) ------------------------------------

    // can ratchet up (or down) without bound across generations.
    if (rng.chance(0.05)) return gene.founder * (0.5 + rng.next() * 1.5);
    const step = rng.gauss ? rng.gauss(0, 0.06) : (rng.next() - 0.5) * 0.12;
    return Math.max(0.05, value * (1 + step));
  }
  if (gene.kind === 'sym') {
    // Signed locus: 5% full re-roll, else a small Gaussian step, clamped.
    if (rng.chance(0.05)) return rng.next() * 2 - 1;
    const step = rng.gauss ? rng.gauss(0, 0.06) : (rng.next() + rng.next() + rng.next() - 1.5) * 0.08;
    return Math.max(-1, Math.min(1, value + step));
  }
  // 5% large-effect re-roll, else a small Gaussian step.
  if (rng.chance(0.05)) return rng.next();
  const step = rng.gauss ? rng.gauss(0, 0.06) : (rng.next() + rng.next() + rng.next() - 1.5) * 0.08;
  return clamp01(value + step);
}

// Meiosis: build one gamete. For each chromosome, pick 1–3 crossover points;
// alternate between the two homologs between crossovers. Marks fade halfway
// toward 1 (imperfect epigenetic inheritance — the past attenuates).
function meiosis(genome, rng) {
  const gamete = {};
  const gameteMarks = {};
  for (const chrom of CHROMOSOMES) {
    if (chrom.length === 0) continue;
    const nX = 1 + rng.int(0, 2);
    const points = new Set();
    while (points.size < nX && points.size < chrom.length - 1) {
      points.add(1 + rng.int(0, chrom.length - 2));
    }
    const cuts = [...points].sort((a, b) => a - b);
    let useFirst = rng.chance(0.5);
    let cutIdx = 0;
    for (let i = 0; i < chrom.length; i++) {
      if (cutIdx < cuts.length && i === cuts[cutIdx]) {
        useFirst = !useFirst;
        cutIdx++;
      }
      const key = chrom[i];
      const allele = genome.alleles[key][useFirst ? 0 : 1];
      gamete[key] = allele;
      const m = (genome.marks && genome.marks[key]) || 1.0;
      gameteMarks[key] = 1.0 + (m - 1.0) * 0.5;
    }
  }
  // v0.14: duplicated copies segregate like presence/absence alleles linked
  // to the base locus — each copy passes to the gamete with 50% chance.
  const gameteExtra = {};
  for (const key of Object.keys(genome.extra || {})) {
    if (rng.chance(0.5)) gameteExtra[key] = genome.extra[key].slice();
  }
  return { gamete, gameteMarks, gameteExtra };
}

function inherit(momGenome, dadGenome, rng, mutationRate = MUTATION_RATE) {
  const m = meiosis(momGenome, rng);
  const d = meiosis(dadGenome, rng);
  const alleles = {};
  const marks = {};
  for (const gene of GENES) {
    alleles[gene.key] = [mutateAllele(gene, m.gamete[gene.key], rng, mutationRate), mutateAllele(gene, d.gamete[gene.key], rng, mutationRate)];
    marks[gene.key] = 1.0 + (((m.gameteMarks[gene.key] || 1) + (d.gameteMarks[gene.key] || 1)) / 2 - 1.0);
  }
  // v0.14: gene duplication — the evolvable-complexity machinery.
  // Extra copies from both gametes combine (at most one per gene: two
  // incoming copies resolve to one by drift). Deletion prunes copies;
  // duplication copies the child's own fresh base pair. Choice genes are
  // excluded — a second choice allele pair has no expression path, which
  // would be a dead gene by construction.
  const extra = {};
  for (const key of Object.keys(m.gameteExtra || {})) extra[key] = m.gameteExtra[key].slice();
  for (const key of Object.keys(d.gameteExtra || {})) {
    if (!extra[key] || rng.chance(0.5)) extra[key] = d.gameteExtra[key].slice();
  }
  const dupLog = [];
  for (const key of Object.keys(extra)) {
    if (rng.chance(DEL_RATE)) { delete extra[key]; dupLog.push({ kind: 'deletion', key }); }
  }
  if (Object.keys(extra).length < MAX_EXTRA) {
    for (const gene of GENES) {
      if (gene.kind === 'choice' || extra[gene.key]) continue;
      if (rng.chance(DUP_RATE)) {
        extra[gene.key] = alleles[gene.key].slice(); // the newborn copy
        dupLog.push({ kind: 'duplication', key: gene.key });
        if (Object.keys(extra).length >= MAX_EXTRA) break;
      }
    }
  }
  // The copies mutate independently from birth — divergence starts now.
  for (const key of Object.keys(extra)) {
    const gene = GENE_MAP[key];
    if (!gene) { delete extra[key]; continue; }
    extra[key] = extra[key].map((a) => mutateAllele(gene, a, rng, mutationRate));
  }
  return { alleles, marks, extra, dupLog };
}

// Nudge an epigenetic mark on one locus (0.5–1.5×). Called by life events:
// scarcity marks hungerRate up, isolation marks sociability, illness marks
// immunity. What life writes, time erodes.
function markLocus(genome, key, delta) {
  if (!genome.marks || genome.marks[key] === undefined) return;
  genome.marks[key] = Math.max(0.5, Math.min(1.5, genome.marks[key] + delta));
}

// Express the diploid genome as observable traits. Floats average, then
// the epigenetic mark scales expression. Choice genes express the maternal
// allele (deterministic).
function phenotype(genome) {
  const p = {};
  for (const gene of GENES) {
    const [a, b] = genome.alleles[gene.key];
    const mark = (genome.marks && genome.marks[gene.key]) || 1.0;
    if (gene.kind === 'choice') {
      p[gene.key] = gene.choices[a];
      continue;
    }
    // v0.14: duplicated copies average in by dosage — a newborn copy is an
    // identical twin of the base pair, then diverges by independent
    // mutation. Every copy is wired into expression from birth: no dead genes.
    let mean = (a + b) / 2;
    const xc = genome.extra && genome.extra[gene.key];
    if (xc) mean = (mean + (xc[0] + xc[1]) / 2) / 2;
    if (gene.kind === 'exp') {
      p[gene.key] = Math.max(0.05, mean * mark); // never capped above
    } else if (gene.kind === 'sym') {
      p[gene.key] = Math.max(-1, Math.min(1, mean * mark));
    } else {
      p[gene.key] = clamp01(mean * mark);
    }
  }
  // Derived, game-ready values (kept from v0.12):
  p.hueDeg = p.bodyHue * 360;
  p.bodyRadius = 14 + p.size * 18; // px at adult size
  // v2 (L): longevity scales the lifespan locus (founder ×1.0).
  p.lifespanSec = (300 + p.lifespan * 1500) * (0.5 + p.longScale); // 5–30 minutes
  p.walkSpeed = 28 + p.size * 26; // px/sec, bigger = slightly faster
  p.fruitEfficiency = { herbivore: 1.0, omnivore: 0.8, carnivore: 0.5 }[p.diet];
  p.meatEfficiency = { herbivore: 0.25, omnivore: 0.7, carnivore: 1.0 }[p.diet];
  p.biteSize = 0.2 + p.mouthSize * 0.3;
  p.sightRange = 420 * (0.7 + p.eyeSize * 0.6);
  p.legSpeedMult = 0.7 + p.legLength * 0.6;
  p.legDrainMult = 0.8 + p.legLength * 0.4;
  p.spikeFear = p.spikes * 0.25;
  p.spikeArmor = p.spikes * 0.3;
  p.furInsulation = p.fur * 0.3;
  p.furWeight = p.fur * 0.15;
  // canopy (new): climbing speed and grooming reach from morphology.
  // v2 (M): tailGrip adds a prehensile-strength bonus to climb speed.
  // v0.17 "Bauplan": evo-devo derivations — the developmental program's
  // gene-level potentials (budPotentials in sim/evodevo.js). All founder
  // values reproduce v0.15 exactly (asserted by test): areas 0,
  // graspPairs 2, bodySegs 1, every bonus +0.
  const _bp = budPotentials(p);
  p.wingArea = _bp.wingArea; p.sailArea = _bp.sailArea;
  p.gillArea = _bp.gillArea; p.finArea = _bp.finArea;
  p.graspPairs = _bp.graspPairs; p.bodySegs = _bp.bodySegs;
  // Always descends, never powered flight.
  p.glideLift = Math.min(0.85, _bp.wingArea * 1.2);
  p.brachMult = 1 + 0.35 * Math.max(0, _bp.graspPairs - 2);
  p.fallSoak = Math.min(0.9, (_bp.wingArea + _bp.sailArea) * 0.9);
  p.swimSpeed = p.walkSpeed * (0.3 + Math.min(1, _bp.finArea * 1.2));
  p.breathTime = 30 + _bp.gillArea * 300;
  p.slitherSpeed = p.walkSpeed * (0.9 + 0.1 * _bp.bodySegs);
  p.developDrain = (_bp.wingArea + _bp.sailArea + _bp.gillArea + _bp.finArea +
    Math.max(0, _bp.graspPairs - 2) * 0.5) * 0.004;
  p.wingUpkeep = _bp.wingArea * 0.0015;
  p.gillUpkeep = _bp.gillArea * 0.002;
  p.finUpkeep = _bp.finArea * 0.0012;
  // The limb economy: extra grasp pairs climb better; longer grasp limbs
  // extend grooming reach (the general manipulation affordance);
  // serpentine plans trade reach away.
  p.climbSpeed = 40 + p.legLength * 40 + p.tailLength * 20 + p.tailGrip * 30
    + Math.max(0, _bp.graspPairs - 2) * 15; // px/sec vertical
  p.groomReach = 40 + p.size * 30 + _bp.reachBonus - Math.max(0, _bp.bodySegs - 1) * 10;
  // v2 (D): drive tuning — gain + baseline on the chemical→drive readout.
  // Founder defaults are the identity: gain 1.0, baseline 0.
  for (const d of ['Hunger', 'Energy', 'Social', 'Fun', 'Fear']) {
    p['driveGain' + d] = 2 * p['drv' + d + 'Gain'];
    p['driveBase' + d] = (p['drv' + d + 'Base'] - 0.5) * 0.4;
  }
  // v2 (M): regional pigmentation — hue/sat offsets around the body base.
  for (const region of ['Head', 'Torso', 'Limbs']) {
    p['pig' + region + 'HueDeg'] = (p['pig' + region + 'Hue'] - 0.5) * 120;
    p['pig' + region + 'SatShift'] = (p['pig' + region + 'Sat'] - 0.5) * 40;
  }
  // v2 (M): the expressed coat color — the canonical readable coloration.
  // Torso is the largest region; mate preference matches against this, and
  // the later biomes phase can read it for camouflage selection. Per-region
  // values (pigHead/Torso/LimbsHueDeg/SatShift) are on the phenotype too.
  p.coatHue01 = ((((p.hueDeg + (p.pigTorsoHueDeg ?? 0)) % 360) + 360) % 360) / 360;
  p.coatSat01 = clamp01((58 + (p.pigTorsoSatShift ?? 0)) / 100);
  p.earScale = 0.7 + p.earSize * 0.6; // founder 0.5 → 1.0
  p.earTiltRad = (p.earTilt - 0.5) * 0.8; // founder 0.5 → upright
  return p;
}

// Fraction of alleles shared with another genome (0..1) — for family UI.
// v0.14: duplicated copies count — two genomes sharing a diverged copy are
// closer than two where one side carries a copy the other lacks.
function relatedness(g1, g2) {
  let same = 0;
  let total = 0;
  for (const gene of GENES) {
    const [a1, b1] = g1.alleles[gene.key];
    const [a2, b2] = g2.alleles[gene.key];
    let s0;
    if (gene.kind === 'choice') {
      s0 = (a1 === a2 ? 0.5 : 0) + (b1 === b2 ? 0.5 : 0);
    } else if (gene.kind === 'sym') {
      // Signed alleles span [-1, 1]: normalize the distance by the range.
      s0 = (1 - Math.abs(a1 - a2) / 2) * 0.5 + (1 - Math.abs(b1 - b2) / 2) * 0.5;
    } else if (gene.kind === 'exp') {
      // Unbounded loci compare relatively — absolute distance is meaningless.
      const rel = (x, y) => 1 - Math.min(1, Math.abs(x - y) / Math.max(x, y, 1e-6));
      s0 = rel(a1, a2) * 0.5 + rel(b1, b2) * 0.5;
    } else {
      s0 = (1 - Math.abs(a1 - a2)) * 0.5 + (1 - Math.abs(b1 - b2)) * 0.5;
    }
    // v0.14: copy-number-aware. Shared copies compare allele-by-allele and
    // average with the base; a copy only one side carries discounts similarity.
    const x1 = g1.extra && g1.extra[gene.key];
    const x2 = g2.extra && g2.extra[gene.key];
    if (x1 && x2) {
      let se;
      if (gene.kind === 'sym') {
        se = (1 - Math.abs(x1[0] - x2[0]) / 2) * 0.5 + (1 - Math.abs(x1[1] - x2[1]) / 2) * 0.5;
      } else if (gene.kind === 'exp') {
        const rel = (x, y) => 1 - Math.min(1, Math.abs(x - y) / Math.max(x, y, 1e-6));
        se = rel(x1[0], x2[0]) * 0.5 + rel(x1[1], x2[1]) * 0.5;
      } else {
        se = (1 - Math.abs(x1[0] - x2[0])) * 0.5 + (1 - Math.abs(x1[1] - x2[1])) * 0.5;
      }
      same += (s0 + se) / 2;
    } else if (x1 || x2) {
      same += s0 * 0.75;
    } else {
      same += s0;
    }
    total += 1;
  }
  return same / total;
}

// v0.14: genome distance — the speciation metric. 0 = identical, 1 = nothing shared.
function genomeDistance(g1, g2) {
  return 1 - relatedness(g1, g2);
}


// ---- src/sim/evodevo.js ----
// Evo-devo: the body plan as a developmental program (v0.17 "Bauplan").
//
// The genome no longer describes a fixed body with knobs — it describes a
// developmental program: five paired bud sites (shoulder, hip, dorsal,
// mid-torso, neck), each with grow/type/pow loci (+len where no ancestral
// gene exists), that unfold baby → child → adult. Shoulder and hip buds
// ADOPT the existing armLength/legLength genes as their len source — the
// founder's arms and legs are ancestral buds that simply always grew, so
// the founder phenotype is exactly the old one by construction.
//
// Bud types are an APPENDABLE string registry (like the senses): a future
// version appends new types and old genomes keep parsing. Never ordinals.
//
// The rules the tick lives by:
// - Gene-level potentials (budPotentials) are stage-independent: what the
//   genome wants. Mate choice and divergence read these.
// - The realized body plan (expressBuds) multiplies by growth01: what
//   development has built SO FAR. Physics gates read the realized values —
//   a baby with wing genes cannot glide, an undergrown membrane is a nub.
//   This is the honest developmental story, not a special case.
// - Growth is nutrition-scaled and permanent: starved juveniles stunt and
//   the stunt factor freezes at maturation (canalization is a v+1 question).

// Paired (bilaterally symmetric) limb sites. Append-only — a future version
// may add e.g. 'crown' or 'flank' without breaking old genomes.
const BUD_SITES = ['shoulder', 'hip', 'dorsal', 'mid', 'neck'];
// Bud-type registry. 'grasp' is the ancestral type (every founder limb).
// Append-only strings — never reordered, never renumbered.
const BUD_TYPES = ['grasp', 'membrane', 'sail', 'gill', 'fin'];

// A bud erupts once its grown grow01 reaches this; between BUD_ERUPT and
// BUD_NUB_HI it is a nub (costs development, does nothing) — the honest
// half-built organ, and the reason membranes are a liability before wings.
const BUD_ERUPT = 0.15;
const BUD_NUB_HI = 0.4;

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

// Founder defaults, so a genome missing evo-devo loci reads as the founder.
function growDefault(site) { return site === 'shoulder' || site === 'hip' ? 1 : 0; }
function typeDefault(site) {
  return site === 'dorsal' ? 1 : site === 'neck' ? 3 : 0; // membrane / gill latent
}

function budGrow01(site, p) { return clamp01(p['bud' + cap(site) + 'Grow'] ?? growDefault(site)); }
function budType(site, p) {
  const v = p['bud' + cap(site) + 'Type'];
  // phenotype() maps choice genes to their string; accept a raw index too.
  if (typeof v === 'string' && BUD_TYPES.includes(v)) return v;
  return BUD_TYPES[v] ?? BUD_TYPES[typeDefault(site)];
}
function budPow01(site, p) { return clamp01(p['bud' + cap(site) + 'Pow'] ?? 0.5); }

// Len source per site: shoulder/hip adopt the ancestral genes (armLength,
// legLength) — zero dead genes, founder-exact by construction. Dorsal has
// no ancestral len gene: the founder proportion 0.5. Mid/neck read their own.
function budLen01(site, p) {
  if (site === 'shoulder') return clamp01(p.armLength ?? 0.5);
  if (site === 'hip') return clamp01(p.legLength ?? 0.5);
  if (site === 'mid') return clamp01(p.budMidLen ?? 0.5);
  if (site === 'neck') return clamp01(p.budNeckLen ?? 0.5);
  return 0.5; // dorsal — the founder proportion
}

// px length of a bud's limb — mirrors the founder limb formulas for the
// adopted sites so the founder draws pixel-identically.
function budLenPx(site, p) {
  const r = p.bodyRadius || 30;
  const len01 = budLen01(site, p);
  if (site === 'shoulder') return r * (0.45 + len01 * 0.65); // = painter armLen
  if (site === 'hip') return r * (0.15 + len01 * 0.6);       // = painter legLen
  return r * (0.3 + len01 * 0.7);
}

// Gene-level bud potentials — stage-independent, what the genome WANTS.
// Mate choice and divergence read these (choosing genes, not bodies).
function budPotentials(p) {
  let wingArea = 0, sailArea = 0, gillArea = 0, finArea = 0;
  let graspSites = 0, reachPx = 0;
  for (const site of BUD_SITES) {
    const grow01 = budGrow01(site, p);
    const type = budType(site, p);
    // Organ power: a strong bud does more with the same size — a big
    // membrane with no muscle is a sail, not a wing. ×1.0 at founder
    // (pow 0.5), so the founder plan is untouched by construction.
    const powK = 0.5 + budPow01(site, p);
    const area = grow01 * budLen01(site, p) * powK;
    if (type === 'membrane') wingArea += area;
    else if (type === 'sail') sailArea += area;
    else if (type === 'gill') gillArea += area;
    else if (type === 'fin') finArea += area;
    if (type === 'grasp' && grow01 >= BUD_ERUPT) {
      graspSites++;
      const lp = budLenPx(site, p) * powK;
      if (lp > reachPx) reachPx = lp;
    }
  }
  // Founder reach baseline: the shoulder at armLength 0.5. The bonus is
  // exactly 0 for the founder; longer grasp limbs extend it.
  const baseline = (p.bodyRadius || 30) * (0.45 + 0.5 * 0.65);
  return {
    wingArea, sailArea, gillArea, finArea,
    graspPairs: graspSites,
    bodySegs: 1 + (p.segCount || 0),
    tails: 1 + (p.tailCount || 0),
    reachPx, reachBonus: reachPx - baseline,
  };
}

// The realized body plan: potentials × growth01, with the limb list a
// creature actually has. Physics reads THIS, never the genes.
function expressBuds(p, growth01) {
  const g = clamp01(growth01 ?? 1);
  const pot = budPotentials(p);
  const limbs = [];
  let graspPairs = 0;
  for (const site of BUD_SITES) {
    const grown = budGrow01(site, p) * g;
    if (grown < BUD_ERUPT) continue;
    const type = budType(site, p);
    if (type === 'grasp') graspPairs++;
    const lenPx = budLenPx(site, p);
    const pow01 = budPow01(site, p);
    for (const side of ['L', 'R']) {
      limbs.push({ site, side, type, grow01: grown, lenPx, pow01 });
    }
  }
  return {
    limbs, tails: pot.tails, bodySegs: pot.bodySegs, graspPairs,
    wingArea: pot.wingArea * g, sailArea: pot.sailArea * g,
    gillArea: pot.gillArea * g, finArea: pot.finArea * g,
    growth01: g,
  };
}

// The developmental clock. base by stage; juveniles scale by their own
// mean bloodSugar (starvation stunts); adults freeze the stunt factor they
// grew up with. No canalization yet — a v+1 question.
function developmentalGrowth01(stage, juvSugarMean, stuntFactor) {
  const base = stage === 'baby' ? 0.25 : stage === 'child' ? 0.6
    : stage === 'adult' ? 1.0 : 0.95;
  if (stage === 'adult' || stage === 'senior') return base * (stuntFactor ?? 1);
  const mean = juvSugarMean ?? 0.75;
  return base * (0.5 + 0.5 * mean);
}

// v0.18 "Realms": the aquatic phenotype — membranes are the swim organ.
// genome.js still carries the old fin-based swimSpeed formula; this
// overwrites it with the membrane formula. Founder wingArea=0 → flail
// speed (~12px/s ≈ the old walkSpeed×0.3), so the founder is untouched.
// sailDump and waterDrag are new derivations the chemistry/physics read.
// Idempotent: recomputed from the same fields every call.
const SWIM_FLAIL_SPEED = 12; // px/s — dog-paddling without membranes
const SWIM_BASE_SPEED = 40; // px/s — membrane swimming base
const SWIM_WING_K = 120; // +px/s per unit of realized wingArea
const SWIM_FLAIL_AREA = 0.15; // wingArea below this is flailing —
// covers the random founder range (0–0.137 in 1000 samples), so the
// founder flails at 12px/s, untouched. Real membranes evolve far above.
const SAIL_DUMP_K = 0.5; // sailArea × this = heat dumped (ctx.sailDump)
const WATER_DRAG_K = 8; // graspPairs × this = drag in water

function deriveAquaticPheno(p) {
  const wingArea = p.wingArea || 0;
  p.swimSpeed = wingArea < SWIM_FLAIL_AREA
    ? SWIM_FLAIL_SPEED
    : SWIM_BASE_SPEED + wingArea * SWIM_WING_K;
  p.sailDump = (p.sailArea || 0) * SAIL_DUMP_K;
  p.waterDrag = (p.graspPairs || 0) * WATER_DRAG_K;
  return p;
}


// ---- src/sim/plantgenome.js ----
// Plant genomes for Canopy v0.13 "Roots": every plant species carries its
// own diploid genome. Fruit trees and herbs evolve — yield, bitterness,
// drought tolerance, cold tolerance, medicinal potency. Coevolution with
// the tanglekins is real: seeds disperse where fruit is eaten, so heavy
// foraging spreads high-yield plants while bitterness deters.
//
// The machinery mirrors genome.js honestly but lighter: diploid, 2
// chromosomes with 1 crossover each, mutation 0.008/allele, no epigenetic
// marks (plants are simpler organisms). Phenotype = mean of alleles.

const PLANT_GENES = [
  // Y — yield family
  { key: 'yield', kind: 'float', founder: 0.5 },      // fruits per cycle = 1 + round(2×yield)
  { key: 'fruitSize', kind: 'float', founder: 0.5 },  // nutrition per fruit = 0.5 + fruitSize
  // T — timing family
  { key: 'interval', kind: 'float', founder: 0.5 },   // fruiting interval × (0.7 + 0.6×interval)
  { key: 'growthRate', kind: 'float', founder: 0.5 }, // maturation speed
  // D — defense family
  { key: 'bitterness', kind: 'float', founder: 0.3 }, // deterrence: nutrition × (1 − 0.5×bitterness)
  // W — water family
  { key: 'waterRet', kind: 'float', founder: 0.5 },   // arid tolerance
  // H — hardiness family
  { key: 'coldTol', kind: 'float', founder: 0.5 },    // highland tolerance
  // v0.18 §5: appended per the additive discipline (existing indices never
  // shift). Selected by the biome fruiting stress: desert heat, shallow/
  // archipelago salt.
  { key: 'heatTol', kind: 'float', founder: 0.5 },    // desert heat tolerance
  { key: 'saltTol', kind: 'float', founder: 0.5 },    // saltwater tolerance
  // M — medicine family (herbs; fruit trees ignore it)
  { key: 'potency', kind: 'float', founder: 0.5 },    // medicinal strength
];

// Two chromosomes: [yield, fruitSize, interval, growthRate],
// [bitterness, waterRet, coldTol, potency]. Linked genes travel together.
// v0.18: heatTol + saltTol join the second (climate) chromosome; append-only.
const PLANT_CHROMOSOMES = [
  ['yield', 'fruitSize', 'interval', 'growthRate'],
  ['bitterness', 'waterRet', 'coldTol', 'potency', 'heatTol', 'saltTol'],
];

const PLANT_MUTATION_RATE = 0.008;

function clamp01(v) {
  return v < 0 ? 0 : v > 1 ? 1 : v;
}

function randomPlantAllele(gene, rng) {
  if (gene.founder !== undefined) {
    return clamp01(gene.founder + (rng.next() - 0.5) * 0.5);
  }
  return rng.next();
}

// A plant genome is { alleles: { key: [a, b] } } — diploid, no marks.
function randomPlantGenome(rng) {
  const alleles = {};
  for (const gene of PLANT_GENES) {
    alleles[gene.key] = [randomPlantAllele(gene, rng), randomPlantAllele(gene, rng)];
  }
  return { alleles };
}

function mutatePlantAllele(value, rng, rate = PLANT_MUTATION_RATE) {
  if (!rng.chance(rate)) return value;
  // 5% large-effect re-roll, else a small Gaussian step.
  if (rng.chance(0.05)) return rng.next();
  const step = rng.gauss ? rng.gauss(0, 0.06) : (rng.next() + rng.next() + rng.next() - 1.5) * 0.08;
  return clamp01(value + step);
}

// Meiosis: one gamete. One crossover per chromosome, alternating homologs.
function plantMeiosis(genome, rng) {
  const gamete = {};
  for (const chrom of PLANT_CHROMOSOMES) {
    const cut = 1 + rng.int(0, chrom.length - 2);
    let useFirst = rng.chance(0.5);
    for (let i = 0; i < chrom.length; i++) {
      if (i === cut) useFirst = !useFirst;
      const key = chrom[i];
      gamete[key] = genome.alleles[key][useFirst ? 0 : 1];
    }
  }
  return gamete;
}

// Inheritance: two gametes fuse. Plants self-pollinate here (mom == dad is
// the common case via seed dispersal) — a noted simplification; outcrossing
// via pollinators is a future pressure to add.
function inheritPlant(momGenome, dadGenome, rng, mutationRate = PLANT_MUTATION_RATE) {
  const m = plantMeiosis(momGenome, rng);
  const d = plantMeiosis(dadGenome, rng);
  const alleles = {};
  for (const gene of PLANT_GENES) {
    alleles[gene.key] = [
      mutatePlantAllele(m[gene.key], rng, mutationRate),
      mutatePlantAllele(d[gene.key], rng, mutationRate),
    ];
  }
  return { alleles };
}

// Phenotype: mean of the two alleles per locus.
function plantPhenotype(genome) {
  const pheno = {};
  for (const gene of PLANT_GENES) {
    const [a, b] = genome.alleles[gene.key];
    pheno[gene.key] = (a + b) / 2;
  }
  return pheno;
}

// Compact hash for the beautiful-mutant watch (novel genotype detection).
function plantGenomeHash(genome) {
  const parts = [];
  for (const gene of PLANT_GENES) {
    const [a, b] = genome.alleles[gene.key];
    parts.push(a.toFixed(3) + '/' + b.toFixed(3));
  }
  return parts.join('|');
}


// ---- src/sim/biochem.js ----
// Body chemistry: chemicals in, drives out, health, fear, age.
//
// Drives are needs in [0,1] (0 = fully satisfied, 1 = desperate) — but they
// are COMPUTED from a chemical network, not stored directly. Eating produces
// blood sugar; living burns it. Company produces oxytocin; solitude lets it
// decay. Gene-driven rates make each creature's temperament physically
// different. The drive fields keep their v0.12 names and pacing so the
// brain, UI, and QA baselines keep working — what's new is that they're
// readouts of chemistry, not the chemistry itself.
//
// v0.18 "Realms": seven chemicals (oxygen, hydration join the five).
// thirst/cold/heat are SENSES, not drives — the chemistry invariant holds:
// drives are readouts of chemicals; hazards are chemicals and body states.

function createBiochem() {
  return {
    // chemicals — the actual body state
    bloodSugar: 0.75, // fuel; eating produces it, living burns it
    fatigue: 0.1, // accumulates while awake, clears while sleeping
    oxytocin: 0.5, // rises with grooming and bonded company, decays
    endorphin: 0.5, // rises with play, decays
    adrenaline: 0, // spikes on fear events, decays fast
    oxygen: 1, // v0.18: breath — drains while submerged (~25s of air at founder)
    hydration: 0.8, // v0.18: body water — drains with heat × exertion
    // body states — not chemicals, not drives
    coreTemp: 0.5, // v0.18: 0..1, 0.5 neutral — drifts toward ambient
    // drives — computed readouts (refreshed every tick)
    hunger: 0.25, // need for food
    energy: 0.9, // 1 = fully rested
    comfort: 0.8, // 1 = comfortable
    social: 0.5, // need for company
    fun: 0.5, // need for play
    fear: 0, // 0 = calm, 1 = terrified
    health: 1.0,
    illness: 0, // 0 = healthy, 1 = gravely ill
    injury: 0, // 0 = unhurt, 1 = badly wounded — the body records history
    age: 0, // seconds since birth
  };
}

function ageStage(b, pheno) {
  // v2 (L): maturation stretches or compresses the juvenile stages.
  const m = 0.5 + (pheno.matTime ?? 0.5); // founder → ×1.0
  const t = b.age / pheno.lifespanSec;
  if (t < 0.07 * m) return 'baby';
  if (t < 0.25 * m) return 'child';
  if (t < 0.8) return 'adult';
  return 'senior';
}

// Size multiplier by life stage (babies are small, seniors slightly shrunken).
function stageSize(stage) {
  return { baby: 0.45, child: 0.7, adult: 1.0, senior: 0.92 }[stage];
}

function clamp01(v) {
  return v < 0 ? 0 : v > 1 ? 1 : v;
}
// v0.18: context hygiene — a non-finite ctx value falls back to its default
// instead of poisoning the body (the v0.15 NaN lesson).
function cf(v, dflt) {
  return Number.isFinite(v) ? v : dflt;
}
function cf01(v, dflt) {
  const x = Number.isFinite(v) ? v : dflt;
  return x < 0 ? 0 : x > 1 ? 1 : x;
}

// ctx: { sleeping, playing, nearFriend, petted, scolded,
//        grooming, groomed, ate (0..1 food value this tick),
//        active (0..1 exertion), threat (0..1) } — set by creature.
function tickBiochem(b, pheno, dt, ctx = {}) {
  // --- ctx hygiene ---------------------------------------------------------
  // v0.18 (the v0.15 NaN lesson): normalize every context input once, up
  // front. A non-finite value falls back to its default instead of
  // poisoning the body — Math.max/Math.min-style clamps pass NaN straight
  // through, so the guard has to happen here, before any arithmetic.
  ctx = {
    sleeping: !!ctx.sleeping,
    playing: !!ctx.playing,
    nearFriend: !!ctx.nearFriend,
    petted: !!ctx.petted,
    scolded: !!ctx.scolded,
    grooming: !!ctx.grooming,
    groomed: !!ctx.groomed,
    ate: cf(ctx.ate, 0),
    active: cf(ctx.active, 0.6),
    threat: cf(ctx.threat, 0),
    homesick: cf(ctx.homesick, 0),
    develop: cf(ctx.develop, 0),
    submerged: cf01(ctx.submerged, 0),
    heat: cf01(ctx.heat, 0),
    drank: cf01(ctx.drank, 0),
    ambientTemp: cf(ctx.ambientTemp, 0.5),
    basking: cf01(ctx.basking, 0),
    sailDump: cf01(ctx.sailDump, 0),
  };
  // --- chemistry ---------------------------------------------------------
  // Fuel: eating fills the tank, living drains it. A full belly lasts a
  // few minutes — the same pacing as v0.12, now as a chemical.
  // v0.17 "Bauplan": ctx.develop — juveniles growing novel structures burn
  // extra fuel. It enters as a hungerRate term, not a new chemical: drives
  // stay readouts of the seven chemicals.
  const hungerRate = 0.004 + pheno.hungerRate * 0.014 + (ctx.develop || 0); // per second
  const exert = ctx.sleeping ? 0.6 : (0.5 + (ctx.active ?? 0.6) * 0.5);
  b.bloodSugar = clamp01(b.bloodSugar + (ctx.ate ?? 0) * 0.9 - hungerRate * dt * exert);

  // Fatigue: sleep clears it, waking life accumulates it. Fur insulates
  // (slower drain), long legs burn more — the v0.6 morphology tradeoffs.
  const drainRate = (0.003 + pheno.energyDrain * 0.009)
    * (1 - (pheno.furInsulation || 0)) * (pheno.legDrainMult || 1);
  if (ctx.sleeping) {
    b.fatigue = clamp01(b.fatigue - 0.09 * dt);
  } else {
    // v0.18: hypothermia doubles fatigue gain — the cold exhausts.
    const hypoGain = b.coreTemp < (0.25 - (pheno.coldTol ?? 0.5) * 0.1) ? 2 : 1;
    b.fatigue = clamp01(b.fatigue + drainRate * hypoGain * dt);
  }

  // Oxytocin: the bonding chemical. Grooming is the troop's ritual —
  // giving and receiving both bond. Mere company helps; solitude starves it.
  const bondRate = 0.05 + (pheno.sociability ?? 0.5) * 0.04;
  b.oxytocin = clamp01(b.oxytocin
    + (ctx.grooming ? 0.25 * dt : 0)
    + (ctx.groomed ? 0.35 * dt : 0)
    + (ctx.nearFriend ? bondRate * dt : 0)
    - 0.006 * dt);

  // Endorphin: play is its own reward, chemically.
  b.endorphin = clamp01(b.endorphin + (ctx.playing ? 0.12 * dt : 0) - 0.008 * dt);

  // Adrenaline: fear spikes, then fades fast.
  if (ctx.scolded) b.adrenaline = clamp01(b.adrenaline + 0.6);
  if (ctx.threat) b.adrenaline = clamp01(b.adrenaline + ctx.threat * 0.8);
  b.adrenaline = clamp01(b.adrenaline - 0.25 * dt);

  // --- v0.18 "Realms": the survival chemistry --------------------------------
  // Every ctx term below was normalized up front (see ctx hygiene) — all
  // are finite here. Every new term is clamp01'd.
  const sub01 = ctx.submerged; // 1 = fully submerged
  const heat01 = ctx.heat; // ambientHeat 0..1 (desert interior)
  const drank01 = ctx.drank; // 0..1 drinking this tick
  const active01 = ctx.active; // exertion 0..1
  const ambient = clamp01(ctx.ambientTemp); // 0..1, 0.5 neutral
  const basking01 = ctx.basking; // basking in warmth this tick
  const sailDump01 = ctx.sailDump; // sail as heat radiator

  // Oxygen: drains while submerged (~25s of air at founder breathTime 30),
  // refills fast in air. Gills (breathTime) stretch the dive honestly —
  // founder ×1.0, so the control group is untouched. At 0: health drains
  // and adrenaline spikes — drowning is terrifying, and fear already knows
  // what to do with it.
  const breathTime = Math.max(1, pheno.breathTime ?? 30);
  if (sub01 > 0) {
    b.oxygen = clamp01(b.oxygen - 0.04 * (30 / breathTime) * sub01 * dt);
  } else {
    b.oxygen = clamp01(b.oxygen + 0.5 * dt);
  }
  const drowning = b.oxygen <= 0.001;
  if (drowning) {
    b.health = clamp01(b.health - 0.03 * dt);
    b.adrenaline = clamp01(b.adrenaline + 0.9 * dt);
  }

  // Hydration: drains with heat × exertion — base ~0.004/s, up to ~0.02/s
  // hot and sprinting. ctx.drank restores it; fruit is mostly water, so
  // eating (ctx.ate) restores a little too — the founder-neutral hydration
  // source that keeps the jungle control group viable without teaching it
  // to drink in four minutes. At 0: dehydration drains health.
  const hydroRate = 0.004 + 0.016 * heat01 * exert;
  b.hydration = clamp01(b.hydration - hydroRate * dt + drank01 * 0.3 + (ctx.ate ?? 0) * 0.5);
  const dehydrated = b.hydration <= 0.001;
  if (dehydrated) b.health = clamp01(b.health - 0.03 * dt);

  // Core temperature: drifts toward ambient; fur insulation slows the drift
  // BOTH ways (a parka in the desert is a liability); metabolic heat rises
  // with exertion; basking in warmth pushes up; sails dump heat.
  // TUNING (BIOMES_DESIGN §13.6): k = 0.02/s with metabolic 0.00228 +
  // 0.0024×active puts the equilibria exactly where the probes need them:
  //   max-fur (ins 0.3) walking (active 0.8) at ambient 0.55 → eq 0.85,
  //     crosses the hyper threshold (0.80 at heatTol 0.5) at ~139s
  //     (inside the 60–180s window), dead ~67s later — ~3.4 min total.
  //   founder (ins 0.15) walking in the jungle (ambient 0.5) → eq 0.747
  //     < 0.80: the ancestral territory stays thermally neutral.
  //   founder resting in arctic ambient 0.1 (active 0.1) → eq 0.248
  //     > hypo threshold 0.20: cold but alive — no hypothermia death.
  // A bear (max fur) walking south equilibrates AT ~0.80 in the jungle —
  // it can cross only by evolving thinner fur or better heatTol. Ranges
  // are physiological, not geographical.
  const subCold = sub01 * 0.35; // water chill — submerged is cold
  const ambientEff = clamp01(ambient - subCold);
  const driftK = 0.02 * (1 - (pheno.furInsulation ?? 0));
  const metabolic = 0.00228 + 0.0024 * active01;
  const warmthFrac = clamp01((ambientEff - 0.4) / 0.5); // basking only pays in warmth
  b.coreTemp = clamp01(b.coreTemp
    + driftK * (ambientEff - b.coreTemp) * dt
    + metabolic * dt
    + basking01 * 0.008 * warmthFrac * dt
    - sailDump01 * 0.01 * dt);
  // Hypothermia: health drains, fatigue accumulates 2×. Hyperthermia:
  // health drains. Thresholds shift with the thermal-tolerance loci.
  const hypoThr = 0.25 - (pheno.coldTol ?? 0.5) * 0.1;
  const hyperThr = 0.75 + (pheno.heatTol ?? 0.5) * 0.1;
  const hypothermic = b.coreTemp < hypoThr;
  const hyperthermic = b.coreTemp > hyperThr;
  if (hypothermic) b.health = clamp01(b.health - 0.015 * dt);
  if (hyperthermic) b.health = clamp01(b.health - 0.015 * dt);

  // Comfort stays direct: touch soothes, scolding wounds.
  // v0.13: homesickness — being far from the imprinted home range wears
  // on homebodies (ctx.homesick = homeDist × instHomeSeek). Gentle: at full
  // homesickness the drain is ~2.5× baseline, a pull not a shove. (0.03 was
  // tried first — it crashed comfort in under a minute 229px from home and
  // starved seed 21's founders next to uneaten food. Friction, not force.)
  b.comfort = clamp01(b.comfort - 0.004 * dt - (ctx.homesick || 0) * 0.006 * dt + (ctx.petted ? 0.5 : 0));
  if (ctx.scolded) b.comfort = clamp01(b.comfort - 0.3);

  // --- v2 (R): evolvable chemical reactions --------------------------------
  // Each reaction gene converts substrate→product above its threshold at
  // its rate. MASS-CONSERVING: the transfer is bounded by both what the
  // substrate holds and what the product can take — chemistry rearranges,
  // never creates or destroys. Founder rates are near-zero: quiet
  // chemistry that evolution can turn up.
  for (let i = 0; i < 8; i++) {
    const sub = pheno[`rx${i}sub`];
    const thr = pheno[`rx${i}thr`] ?? 0.5;
    const subV = b[sub];
    if (subV === undefined || subV <= thr) continue;
    const prod = pheno[`rx${i}prod`];
    const rate = pheno[`rx${i}rate`] ?? 0;
    if (rate <= 0 || sub === prod) continue;
    const move = Math.min(rate * (subV - thr) * dt, subV, 1 - b[prod]);
    if (move > 0) {
      b[sub] = subV - move;
      b[prod] = b[prod] + move; // bounded by (1 − prod) above: no clamp needed
    }
  }

  // --- drives computed from chemistry ------------------------------------
  // v2 (D): gain + baseline tune the readout. The chemistry invariant
  // stands — drives are still readouts of the seven chemicals; the tuning
  // is genetic. Founder defaults are the identity (gain 1, baseline 0).
  const dg = (d) => pheno['driveGain' + d] ?? 1;
  const db = (d) => pheno['driveBase' + d] ?? 0;
  b.hunger = clamp01((1 - b.bloodSugar) * dg('Hunger') + db('Hunger'));
  b.energy = clamp01((1 - b.fatigue) * dg('Energy') + db('Energy'));
  b.social = clamp01((1 - b.oxytocin) * dg('Social') + db('Social'));
  b.fun = clamp01((1 - b.endorphin) * dg('Fun') + db('Fun'));
  b.fear = clamp01(b.adrenaline * dg('Fear') + db('Fear'));

  // --- health --------------------------------------------------------------
  // Health: starvation and exhaustion hurt; contentment heals.
  let dh = 0;
  if (b.hunger > 0.9) dh -= 0.03;
  if (b.energy <= 0.01) dh -= 0.02;
  if (b.fear > 0.7) dh -= 0.01;
  if (b.injury > 0.6) dh -= (b.injury - 0.6) * 0.05; // severe wounds bleed health
  // v2 (L): life history writes on health — lifelong frailty (longAging)
  // plus programmed senescence after senOnset. Both off at founder defaults.
  const longAging = pheno.longAging ?? 0;
  if (longAging > 0) dh -= longAging * 0.002;
  const senRate = pheno.senRate ?? 0;
  if (senRate > 0) {
    const ageFrac = b.age / (pheno.lifespanSec || 1);
    const onset = pheno.senOnset ?? 0.8;
    if (ageFrac > onset) dh -= senRate * 0.03 * (ageFrac - onset);
  }
  if (dh === 0 && b.hunger < 0.6 && b.energy > 0.3) dh += 0.008;
  b.health = clamp01(b.health + dh * dt);

  // Illness: a tug-of-war. The disease worsens on its own, fastest in the
  // frail; immunity fights it off — faster when rested and fed.
  if (b.illness > 0) {
    const worsen = 0.008 * (1 - pheno.immunity);
    const recovery =
      (0.002 + pheno.immunity * 0.012) *
      (b.energy > 0.5 ? 1.4 : 1) *
      (b.hunger < 0.5 ? 1.3 : 1);
    b.illness = clamp01(b.illness + (worsen - recovery) * dt);
  }
  if (b.illness > 0.25) {
    b.health = clamp01(b.health - (b.illness - 0.25) * 0.06 * dt);
    b.fatigue = clamp01(b.fatigue + b.illness * 0.004 * dt); // sickness exhausts
  }

  // Injuries: the body records its history. Wounds heal with rest —
  // fast asleep, slow awake.
  if (b.injury > 0) {
    b.injury = clamp01(b.injury - (ctx.sleeping ? 0.03 : 0.006) * dt);
  }

  b.age += dt;
}

function isDead(b, pheno) {
  return b.health <= 0 || b.age >= pheno.lifespanSec;
}

// v0.18 "Realms": the thermal senses — 0..1 readouts of coreTemp for the
// brain (senses 29/30), wired by the realms pass in creature.js. Cold and
// heat are SENSES, not drives: the brain can learn to seek warmth or shade,
// but no new need enters the drive economy.
function coldSense(b, pheno) {
  void pheno;
  const t = Number.isFinite(b.coreTemp) ? b.coreTemp : 0.5;
  return clamp01((0.5 - t) * 2);
}
function heatSense(b, pheno) {
  void pheno;
  const t = Number.isFinite(b.coreTemp) ? b.coreTemp : 0.5;
  return clamp01((t - 0.5) * 2);
}

// Dominant readable state for UI / behavior priority.
function mood(b) {
  if (b.fear > 0.5) return 'afraid';
  if (b.illness > 0.5) return 'sick';
  if (b.health < 0.4) return 'sick';
  if (b.hunger > 0.75) return 'hungry';
  if (b.energy < 0.25) return 'tired';
  if (b.fun > 0.75) return 'bored';
  if (b.social > 0.75) return 'lonely';
  if (b.comfort < 0.4) return 'uncomfortable';
  return 'content';
}


// ---- src/sim/brain.js ----
// A tanglekin brain: sparse associative network, shaped by reward.
// Senses in → hidden layer(s) → action-drives out. Instincts are
// evolvable sense→action reflexes wired straight from instinct genes
// (nature); the sparse middle learns from experience (nurture).
//
// Machinery (from Emberhollow): sparse connectivity (adjacency lists),
// winner-take-all inhibition in the hidden layers, reward-modulated Hebbian
// plasticity (winner learns at full rate, sensory→associative at 1/3),
// attention gating (EMA of salience sharpens what the brain listens to),
// neurogenesis in juveniles + pruning in adults.
//
// GENOME v2 (B family): the brainPlan gene splits the brainSize neuron
// budget across 1–3 hidden layers; sparsity, Hebbian rate, lateral
// inhibition, attention gates, eligibility traces, and chemical
// neuromodulation of learning are all evolvable. Founder defaults reproduce
// the classic single-layer brain exactly.
//
// Contracts kept from Wildcode v0.12 (borrowed from paulthecat):
// ACTIONS, senseVector, decide(brain, input, exploration, rng, votes),
// learn(brain, pheno, reward, chems?), forward. The instinct genes wire
// sense→action directly, exactly as before.


const ACTIONS = [
  'seekFood', // move toward nearest food
  'eat', // consume adjacent food
  'sleep', // lie down, restore energy
  'play', // interact with toy/critter
  'approach', // move toward nearest creature
  'flee', // move away from threat/scary thing
  'mate', // approach & court nearest adult creature
  'wander', // explore randomly
  'seekHome', // walk back toward the imprinted home range
  'climb', // move up/down a climb link to another branch
  'groom', // groom the nearest creature — the troop's bonding ritual
  'jump', // leap: gravity's answer to the gap between branches (physics)
  'vocal', // call out: grounded call type, evolvable pitch (v0.14 Voices)
  'glide', // launch and ride the air — needs real wings (v0.17 Bauplan)
  'brachiate', // arm-swing along the branch — wants a third grasp pair (v0.17)
  'swim', // paddle — the water verb, dormant until v0.18 (v0.17)
  'dive', // hold depth — needs real gills (v0.17)
  'drink', // drink adjacent water — restores hydration (v0.18 Realms)
  'bask', // stationary sunning — restores coreTemp in warmth (v0.18 Realms)
  'dig', // dig at the ground — unearths buried food (v0.18 Realms)
  'grasp', // pick up the nearest manipulable object within reach (v0.20 Hands)
  'carry', // wield what is held — the strike-with-object lives here (v0.20 Hands)
  'drop', // release the held object with the carrier's velocity (v0.20 Hands)
];

const N_IN = 36; // 35 senses + bias... see senseVector
const N_OUT = ACTIONS.length;

const ATTENTION_ALPHA = 0.15; // EMA rate for attention
const ATTENTION_SHARPNESS = 3.0; // softmax sharpness on attention
const PLASTICITY_CLAMP = 1.5; // Hebbian weights live in [-1.5, 1.5]
const MIN_ASSOC = 16; // pruning never goes below this

// senses: [hunger, tiredness, boredom, loneliness, fear, light,
//           foodDist, foodDir, creatureDist, creatureDir, toyDist, toyDir,
//           isAdult, illness, homeDist, kinNear, bondNear,
//           climbUp, climbDown, groomNear, jumpNear, callHeard, callPitch,
//           wasteOdor, airborne, farLedge, submerged, waterNear,
//           thirst, cold, heat, buriedNear, objectNear, heldWeight, bias]
// v0.12 rule kept: never renumber. New senses append before the bias.
function senseVector(s) {
  return [
    s.hunger, s.tiredness, s.boredom, s.loneliness, s.fear, s.light,
    s.foodDist, s.foodDir, s.creatureDist, s.creatureDir,
    s.toyDist, s.toyDir, s.isAdult, s.illness,
    s.homeDist || 0, s.kinNear || 0, s.bondNear || 0,
    s.climbUp || 0, s.climbDown || 0, s.groomNear || 0, s.jumpNear || 0,
    s.callHeard || 0, s.callPitch || 0, s.wasteOdor || 0,
    s.airborne || 0, s.farLedge || 0, s.submerged || 0, s.waterNear || 0,
    s.thirst || 0, s.cold || 0, s.heat || 0, s.buriedNear || 0,
    s.objectNear || 0, s.heldWeight || 0, // v0.20: the hands senses
    s.falling || 0, // v0.20 "Falling": the vestibular sense — appended, never renumbered
    1,
  ];
}

function assocSize(pheno) {
  // The brainSize locus sizes the associative layer: 100 × expressed value,
  // with NO upper cap — founder 8.0 gives ~800 (emberling scale) and evolution
  // may drive it upward without bound. Floor of 16 keeps degenerate genomes alive.
  return Math.max(16, Math.round(100 * (pheno.brainSize ?? 8.0)));
}

function randSparse(rng, rows, cols, density, scale) {
  // Adjacency lists: for each row, [colIndices], [weights].
  const idx = [];
  const w = [];
  for (let r = 0; r < rows; r++) {
    // v0.14: clamp to cols — a density near 1 could otherwise ask for more
    // distinct inputs than exist, hanging the while loop forever.
    const n = Math.min(cols, Math.max(1, Math.round(cols * density * (0.5 + rng.next()))));
    const cols_ = new Set();
    while (cols_.size < n) cols_.add(rng.int(0, cols - 1));
    idx.push([...cols_]);
    w.push([...cols_].map(() => rng.range(-scale, scale)));
  }
  return { idx, w };
}

function createBrain(pheno, rng) {
  const nAssoc = assocSize(pheno);
  // v2 (B): brainPlan splits the brainSize neuron budget across 1–3 hidden
  // layers (founder 1 = the classic single-layer brain). Layers get an
  // even split; every layer keeps ≥ 4 neurons.
  const nLayers = Math.min(3, Math.max(1, Math.round(pheno.bpLayers ?? 1)));
  const sizes = [];
  {
    const base = Math.floor(nAssoc / nLayers);
    let rem = nAssoc - base * nLayers;
    for (let l = 0; l < nLayers; l++) sizes.push(base + (rem-- > 0 ? 1 : 0));
  }
  // v2 (B): evolvable sparsity — density = 1 − sparsity. Founder → 0.35,
  // exactly the classic sensory→assoc wiring density.
  const s2aDensity = 1 - (pheno.bpSparsity ?? 0.65);
  const layers = [];
  let fanIn = N_IN - 1;
  for (let l = 0; l < nLayers; l++) {
    const m = randSparse(rng, sizes[l], fanIn, l === 0 ? s2aDensity : 0.5, 0.9);
    layers.push({
      n: sizes[l],
      idx: m.idx,
      w: m.w,
      bias: Array.from({ length: sizes[l] }, () => rng.range(-0.2, 0.2)),
    });
    fanIn = sizes[l];
  }
  // Associative → motor: sparse (density ~0.5), motor units map 1:1 to actions.
  const a2m = randSparse(rng, N_OUT, sizes[nLayers - 1], 0.5, 0.9);
  const biasM = new Array(N_OUT).fill(0);

  // Instincts: evolvable sense→action reflexes, wired straight from the genome.
  // Each instinct gene's [0,1] phenotype maps to a weight in [-1.2, 1.2].
  // These weights are genetic — they change only via inheritance + mutation.
  const instW = Array.from({ length: N_OUT }, () => new Array(N_IN).fill(0));
  for (const gene of GENES) {
    if (gene.sense === undefined || gene.action >= N_OUT) continue;
    instW[gene.action][gene.sense] = (pheno[gene.key] - 0.5) * 2.4;
  }

  // Small personality baselines so newborns aren't blank slates.
  biasM[0] = 0.15; // seekFood
  biasM[1] = 0.1; // eat
  biasM[2] = 0.05; // sleep
  biasM[3] = pheno.curiosity * 0.4; // play
  biasM[4] = pheno.sociability * 0.4; // approach
  biasM[5] = (1 - pheno.boldness) * 0.25; // flee
  biasM[6] = 0.05; // mate
  biasM[7] = 0.1 + pheno.curiosity * 0.25; // wander
  biasM[8] = 0.05; // seekHome — the homeward pull starts as a whisper
  biasM[9] = 0.05; // climb — curiosity about the vertical
  biasM[10] = pheno.sociability * 0.4; // groom — the social instinct
  biasM[12] = 0.03; // vocal — answering calls starts as a whisper
  biasM[17] = 0.05; // drink — water is worth a nudge
  biasM[18] = 0.02; // bask — a whisper of sun-seeking
  biasM[19] = 0.02; // dig — scratching at dirt starts as a whisper
  biasM[20] = 0.02; // grasp — hands are curious (v0.20 Hands)
  biasM[21] = 0; // carry — wielding unheld nothing is silence
  biasM[22] = 0.02; // drop — the put-down whisper (v0.20 Hands)

  return {
    nAssoc,
    nLayers,
    layerSizes: sizes,
    layers,
    // Compat: the classic single-layer fields address layer 0. Tests and
    // old saves read brain.s2a / brain.biasA; they still work.
    s2a: layers[0],
    biasA: layers[0].bias,
    a2m, biasM, instW,
    // v2 (B): architecture readouts, fixed at construction — genes set the
    // plan, the brain builds it once.
    latInhibScale: Math.max(0.02, 1 - (pheno.bpLatInhib ?? 0.85)), // founder → 0.15
    s2aDensity,
    gate: {
      count: Math.round((pheno.agCount ?? 0) * 5),
      gain: pheno.agGain ?? 0,
      thresh: pheno.agThresh ?? 0.5,
    },
    // v2 (B): eligibility traces — one per motor synapse, for delayed credit.
    traces: { e: a2m.w.map((row) => new Array(row.length).fill(0)) },
    attention: new Array(N_IN - 1).fill(1 / (N_IN - 1)), // EMA of salience
    age: 0, // brain age in ticks (drives neurogenesis → pruning)
    neurogenesis: 0.3 + (pheno.neurogenesis ?? 0.5) * 0.7,
    rng, // seeded RNG — neurogenesis/pruning stay deterministic
    lastAssoc: null, lastActs: null, lastWinners: null,
    lastOut: null, lastInput: null, lastWinner: -1,
  };
}

const tanh = (x) => Math.tanh(x);

// Expected a2m fan-in at the original ~88-neuron scale (density 0.5).
// The motor readout normalizes against this so learned-pathway magnitude
// is invariant to brain size.
const REF_FANIN = 44;

// Attention: sharpen the sense vector by the EMA of recent salience.
// What the brain has been attending to shapes what it hears now.
function applyAttention(brain, input) {
  const att = brain.attention;
  const gated = new Array(N_IN - 1);
  let sum = 0;
  const sharp = [];
  for (let k = 0; k < N_IN - 1; k++) {
    const e = Math.exp(att[k] * ATTENTION_SHARPNESS);
    sharp.push(e);
    sum += e;
  }
  for (let k = 0; k < N_IN - 1; k++) {
    gated[k] = input[k] * (sharp[k] / sum) * (N_IN - 1);
  }
  // v2 (B): attention gates — the most-salient senses (above thresh, up to
  // count of them) get a gain boost. Founder count 0 → off: the classic
  // attention behavior above, exactly as before.
  const gate = brain.gate;
  if (gate && gate.count > 0 && gate.gain !== 0) {
    const top = [];
    for (let k = 0; k < N_IN - 1; k++) {
      if (att[k] < gate.thresh) continue;
      if (top.length < gate.count) {
        top.push(k);
      } else {
        let minI = 0;
        for (let i = 1; i < top.length; i++) if (att[top[i]] < att[top[minI]]) minI = i;
        if (att[k] > att[top[minI]]) top[minI] = k;
      }
    }
    for (const k of top) gated[k] *= (1 + gate.gain);
  }
  return gated;
}

function forward(brain, input) {
  // v0.13.1: sanitize the sense vector — a single NaN sense would poison
  // every activation downstream (tanh(NaN) = NaN, and NaN comparisons in
  // winner-take-all silently misbehave). A dead sense reads as 0.
  for (let k = 0; k < input.length; k++) {
    if (!Number.isFinite(input[k])) input[k] = 0;
  }
  const gated = applyAttention(brain, input);
  // v2 (B): the neuron budget may be split across hidden layers. Layer 0
  // reads the gated senses (+ bias sense); each deeper layer reads the
  // layer before; the motor readout reads the last layer. At founder
  // defaults (1 layer) this is the classic forward pass exactly.
  const nL = brain.nLayers ?? 1;
  const acts = new Array(nL);
  const winners = new Array(nL);
  let src = gated;
  for (let l = 0; l < nL; l++) {
    const L = brain.layers[l];
    const a = new Array(L.n);
    for (let i = 0; i < L.n; i++) {
      let pre = L.bias[i];
      const cols = L.idx[i];
      const ws = L.w[i];
      for (let n = 0; n < cols.length; n++) pre += ws[n] * src[cols[n]];
      if (l === 0) pre += input[N_IN - 1]; // the bias sense
      a[i] = tanh(pre);
    }
    // Winner-take-all: the strongest neuron inhibits the rest. One thought
    // at a time — every layer commits. Inhibition is evolvable (founder:
    // losers scaled to 0.15, exactly as before).
    let winner = 0;
    let best = -Infinity;
    for (let i = 0; i < L.n; i++) {
      if (a[i] > best) { best = a[i]; winner = i; }
    }
    const loserScale = brain.latInhibScale ?? 0.15;
    for (let i = 0; i < L.n; i++) {
      if (i !== winner) a[i] *= loserScale;
    }
    acts[l] = a;
    winners[l] = winner;
    src = a;
  }
  const assoc = acts[nL - 1];
  // Motor: sparse readout, 1:1 with actions. The learned sum is normalized
  // by fan-in so its magnitude stays size-invariant: without this, a large
  // brain's random readout noise drowns the instinct pathway. REF_FANIN is
  // the expected fan-in at the original ~88-neuron scale, so behavior there
  // is unchanged and bigger brains keep the same signal balance.
  const { idx: mIdx, w: mW } = brain.a2m;
  const o = new Array(N_OUT);
  for (let j = 0; j < N_OUT; j++) {
    let pre = brain.biasM[j];
    const cols = mIdx[j];
    const ws = mW[j];
    const norm = Math.sqrt(REF_FANIN / Math.max(1, cols.length));
    for (let n = 0; n < cols.length; n++) pre += ws[n] * assoc[cols[n]] * norm;
    const iw = brain.instW[j];
    for (let k = 0; k < N_IN; k++) pre += iw[k] * input[k];
    o[j] = tanh(pre);
  }
  brain.lastAssoc = assoc;
  brain.lastActs = acts;
  brain.lastWinners = winners;
  brain.lastOut = o;
  brain.lastInput = input;
  brain.lastWinner = winners[0];
  // Attention EMA: salience = |sense value|.
  for (let k = 0; k < N_IN - 1; k++) {
    brain.attention[k] = (1 - ATTENTION_ALPHA) * brain.attention[k] +
      ATTENTION_ALPHA * Math.abs(input[k]);
  }
  return o;
}

function decide(brain, input, exploration, rng, votes = null) {
  const o = forward(brain, input);
  let best = 0;
  let bestScore = -Infinity;
  for (let j = 0; j < N_OUT; j++) {
    // Recall votes nudge the choice but are NOT stored in lastOut —
    // learning reinforces what the brain itself computed, not the nudge.
    const score = o[j] + (votes ? votes[j] : 0) + rng.range(-exploration, exploration);
    if (score > bestScore) {
      bestScore = score;
      best = j;
    }
  }
  return { action: ACTIONS[best], index: best, outputs: o };
}

function clampW(w) {
  // v0.13.1: NaN passes straight through the comparisons below, so check
  // finiteness first — a poisoned weight resets to 0 instead of spreading.
  if (!Number.isFinite(w)) return 0;
  return w < -PLASTICITY_CLAMP ? -PLASTICITY_CLAMP : w > PLASTICITY_CLAMP ? PLASTICITY_CLAMP : w;
}

// Reward-modulated Hebbian learning. reward in [-1, 1]. The winning
// associative neuron learns at full rate; sensory→associative synapses at
// 1/3 (the world model changes slower than the action model).
// v2 (B): eligibility traces for delayed credit assignment. Each motor
// synapse carries a trace of recent pre×post co-activity; when reward
// arrives late, the trace says who was responsible. Decay and gain are
// genetic (founder gain 0 → off).
function updateTraces(brain, pheno) {
  const decay = pheno.mtDecay ?? 0.9;
  const gain = pheno.mtGain ?? 0;
  if (gain === 0) return;
  const assoc = brain.lastAssoc;
  const o = brain.lastOut;
  for (let j = 0; j < N_OUT; j++) {
    const cols = brain.a2m.idx[j];
    const es = brain.traces.e[j];
    for (let n = 0; n < cols.length; n++) {
      // v0.13.1: a non-finite trace never recovers (decay × NaN = NaN),
      // so reset it instead of propagating it.
      const e = decay * es[n] + gain * assoc[cols[n]] * o[j];
      es[n] = Number.isFinite(e) ? e : 0;
    }
  }
}

function learn(brain, pheno, reward, chems = null) {
  if (!brain.lastAssoc || !brain.lastOut || !brain.lastInput || reward === 0) return;
  // NaN guard (v0.13.1): a non-finite reward poisons every weight it
  // touches — Math.max/Math.min pass NaN straight through, so the old
  // clamp was no protection. Skip the update; the next tick brings a
  // fresh reward.
  if (!Number.isFinite(reward)) return;
  // Structural guard (v0.13.1): neurogenesis/pruning can change the layer
  // sizes AFTER the last forward() — decide() runs on a commitment timer
  // while learn() runs every tick, so the cached activations may address a
  // stale architecture (assoc[719] on a 719-long vector = undefined = NaN,
  // which then spread through traces and weights and starved seed-21
  // lineages next to uneaten food). Refresh the caches when they no
  // longer match the live architecture.
  const lastLayer = brain.layers[brain.nLayers - 1];
  if (brain.lastAssoc.length !== lastLayer.n) {
    forward(brain, brain.lastInput);
  }
  updateTraces(brain, pheno);
  // v2 (B): the Hebbian rate is evolvable — founder → ×1.0, the classic rate.
  let lr = (0.02 + (pheno.learningRate ?? 0.5) * 0.18) * (2 * (pheno.bpHebb ?? 0.5));
  // v2 (B): neuromodulation — a chemical level scales the learning rate.
  // Founder gain 0 → no modulation, exactly as before. When evolved, the
  // modulator gene picks the chemical (founder: adrenaline — stress tunes
  // learning) and the threshold above which it bites.
  const nmGain = pheno.nmGain ?? 0;
  if (chems && nmGain !== 0) {
    const chemVal = chems[pheno.nmChem ?? 'adrenaline'] ?? 0;
    lr *= 1 + nmGain * Math.max(0, chemVal - (pheno.nmThresh ?? 0.5));
  }
  const r = Math.max(-1, Math.min(1, reward));
  const traceGain = pheno.mtGain ?? 0;
  const assoc = brain.lastAssoc;
  const o = brain.lastOut;
  // Motor layer: Hebbian on the last hidden layer's pattern, plus
  // eligibility traces for delayed credit.
  for (let j = 0; j < N_OUT; j++) {
    const err = lr * r * o[j];
    const cols = brain.a2m.idx[j];
    const ws = brain.a2m.w[j];
    const es = brain.traces.e[j];
    for (let n = 0; n < cols.length; n++) {
      ws[n] = clampW(ws[n] + err * (assoc[cols[n]] + traceGain * es[n]));
    }
    brain.biasM[j] = clampW(brain.biasM[j] + err * 0.3);
  }
  // Hidden layers: winner at full rate, others at 1/3. The same rule runs
  // on every layer — layer 0 sees the senses, deeper layers see the layer
  // before. (Classic behavior at founder defaults: one layer, ×1.0.)
  const acts = brain.lastActs ?? [assoc];
  const winners = brain.lastWinners ?? [brain.lastWinner];
  const x = brain.lastInput;
  for (let l = 0; l < (brain.nLayers ?? 1); l++) {
    const L = brain.layers[l];
    const src = l === 0 ? x : acts[l - 1];
    const winner = winners[l];
    const a = acts[l];
    for (let i = 0; i < L.n; i++) {
      const rate = (i === winner ? lr : lr / 3) * r;
      if (rate === 0) continue;
      const cols = L.idx[i];
      const ws = L.w[i];
      for (let n = 0; n < cols.length; n++) {
        ws[n] = clampW(ws[n] + rate * src[cols[n]] * a[i]);
      }
    }
  }
  brain.age++;
  maybeGrow(brain, pheno);
}

// Neurogenesis in juveniles, pruning in adults. Growth happens on the LAST
// hidden layer (the motor-adjacent one) \u2014 for the classic single-layer
// brain this is the associative layer, exactly as before. The brain grows
// while the body is young, then trims the least-used neurons \u2014 but the
// classic brain never drops below 16, and a deeper brain never drops a
// layer below 8.
function maybeGrow(brain, pheno) {
  const rng = brain.rng;
  const p = brain.neurogenesis * 0.01;
  const juvenile = brain.age < 3000; // ~first minutes of life at 10Hz
